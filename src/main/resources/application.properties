spring.application.name=BottomMart

# MySQL connection - override via env vars (DB_URL/DB_USERNAME/DB_PASSWORD) so credentials never get committed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bottommart?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate - auto-create/update tables from entities during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

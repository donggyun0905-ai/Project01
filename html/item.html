<!DOCTYPE html> <!-- 08.12 생성 품목 관리 -->
<!-- 품목관리 페이지에 맞게 일부 내용을 고쳤습니다 (명세서엔 없던 카테고리 항목 추가, 입고 일자 빠짐 등등) -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>품목 관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/item.css">
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
			<a class="active">입출고 관리</a>
			<a>반품 및 폐기 관리</a>
			<a>알림</a>
			<a>통계</a>
			<a>설정 및 권한 관리</a>
		</nav>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
	
	<!-- 사용자 계정 -->
	<div class="top-bar">
		<h2>품목 관리</h2>
		
		<div class="user-info">
			<span class="notification">🔔</span>
			<span class="user-name">관리자 계정</span>
		</div>
	</div>
	
	
		<header class="top-menu">
			<button class="menu-btn active">품목 관리</button> <!--현재 화면이 품목 관리라서 -->
			<button class="menu-btn">입출고 등록</button>
			<button class="menu-btn">창고 및 구역 관리</button>
			<button class="menu-btn">창고 간 재고 이동</button>
			<button class="menu-btn">감사로그</button>
		</header>
		
		<!-- 검색하는 부분 -->
		<section class="search-box">
			<label for="item-search">품목명</label>
			<div class="search-input-wrap">
				<input type="text" id="item-search" placeholder="검색">
				<button type= "button" class="search-btn"></button>
			</div>
			
			<select class="category-select">
	       	 	<option>전체</option>
	       	 	<option>품목 코드</option>
	       	 	<option>품목명</option>
	       	 	<option>카테고리</option>
	       	 	<option>단위</option>
	       	 	<option>단가</option>
	       	 	<option>유통기한</option>
	       	 	<option>구역</option>
	        	<option>담당자</option>
	    	</select>
	    	
		</section>
		
		<!-- 품목 목록(표)  -->
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>품목 코드</th>
						<th>품목명</th>
						<th>카테고리</th>
						<th>단위</th>
						<th>단가</th>
						<th>유통기한</th>
						<th>구역</th>
						<th>담당자</th>
					</tr>				
				</thead>
				
				<tbody> <!--보기 좋게 표 안에 임의로 값을 넣어뒀습니다 나중에 넣어서 고치시면 될듯하옵니다-->
					<tr>
						<td>1</td>
						<td>ITEM-2001</td>
						<td>두부</td>
						<td>냉장식품</td>
						<td>EA</td>
						<td>1,500</td>
						<td>2026-08-05~2026-12-28</td>
						<td>A</td>
						<td>홍길동</td>
					</tr>
					
					<tr>
						<td>2</td>
						<td>ITEM-1554</td>
						<td>소면</td>
						<td>냉장식품</td>
						<td>EA</td>
						<td>800</td>
						<td>2026-08-05~2026-12-28</td>
						<td>A</td>
						<td>김나나</td>
					</tr>
					
						<tr>
						<td>3</td>
						<td>ITEM-1668</td>
						<td>신발</td>
						<td>몰루</td>
						<td>EA</td>
						<td>1,500</td>
						<td>2026-08-05~2026-12-28</td>
						<td>C</td>
						<td>안민지</td>
					</tr>
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

</body>



</html>

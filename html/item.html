<!DOCTYPE html> <!-- 08.12 생성 품목 관리 -->
<!-- 품목관리 페이지에 맞게 일부 내용을 고쳤습니다 (명세서엔 없던 카테고리 항목 추가, 입고 일자 빠짐 등등) -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>품목 관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/item.css">
		
		<!-- 서버 통신 공통 함수 -->
		<script src="../js/api.js"></script>
		<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn active">품목 관리</button> <!--현재 화면이 품목 관리라서 -->
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button>
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<!-- 검색하는 부분 -->
		<section class="search-box">
			<label for="item-search">품목명</label>
			<div class="search-input-wrap">
				<input type="text" id="item-search" placeholder="검색" onkeyup="pressEnter(event)">
				<button type="button" class="search-btn" onclick="doSearch()"></button>
			</div>
			
			<select class="category-select" id="searchField" onchange="doSearch()">
	       	 	<option>전체</option>
	       	 	<option>품목 코드</option>
	       	 	<option>품목명</option>
	       	 	<option>카테고리</option>
	       	 	<option>단위</option>
	    		</select>
	    	
			<!-- 품목 등록 (F-01) -->
			<button class="register-btn" onclick="openItem(-1)">품목 등록</button>
		</section>
		
		<!-- 품목 목록(표)  -->
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>품목 코드</th>
						<th>품목명</th>
						<th>카테고리</th>
						<th>단위</th>
						<th>유통기한</th>
						<th>총 재고</th>
						<th>관리</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="itemBody">
					</tbody>
			</table>
		
			<!-- 쪽 번호 -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     품목 관리 화면 로직
     ------------------------------------------------------------
     품목 정보 : 품목코드 / 품목명 / 카테고리 / 단위 / 유통기한 일수

     총 재고는 ITEM 이 아니라 STOCK_LOT 에 있는 값이라 따로 받아옵니다.
     서버가 품목 목록에 totalStock 을 같이 내려주면 그 값을 쓰고,
     아직 없으면 화면에서 로트를 받아 품목별로 더합니다.
     (서버가 만들어지면 아래 loadStock() 만 지우면 됩니다)
     ============================================================ -->
<script>

	/* 서버에서 받아온 품목 목록.
	   같은 번호끼리 한 줄이 됩니다. */
	let itemIds = [];
	let itemNames = [];
	let itemCategories = [];
	let itemUnits = [];
	let itemMins = [];       // 부족 알림 기준
	let itemMaxs = [];       // 초과 알림 기준
	let itemShelfs = [];     // 유통기한 일수 (없으면 null)

	/* 지금 보고 있는 쪽과 전체 건수 */
	let nowPage = 1;
	let totalCount = 0;

	/* 수정 중인 품목 번호. -1 이면 새로 등록하는 중입니다. */
	let editId = -1;

	/* 품목별 총 재고. 품목번호로 찾아 씁니다. */
	let stockItemIds = [];
	let stockTotals = [];

	/* 재고 로트 하나하나. 재고를 눌렀을 때 상세로 보여 줍니다. */
	let lotItemIds = [];
	let lotIds = [];
	let lotZoneIds = [];
	let lotQtys = [];
	let lotInDates = [];
	let lotExpiries = [];

	/* 재고를 이미 받아왔는지 (한 번만 받으면 됩니다) */
	let stockLoaded = false;


	/* ============================================================
	   1. 목록 불러오기  (GET /api/items)

	   서버가 page / size 로 잘라서 보내주기 때문에
	   화면에서 따로 자르지 않고 받은 그대로 그립니다.
	   ============================================================ */
	function loadData() {

		let path = "/api/items?page=" + nowPage + "&size=" + pageSize;

		/* 검색어가 있으면 조건을 붙입니다.
		   카테고리를 고르면 category, 그 외에는 keyword(품목명 검색)로 보냅니다. */
		let word = document.querySelector("#item-search").value;
		let field = document.querySelector("#searchField").value;

		if (word != "") {
			if (field == "카테고리") {
				path = path + "&category=" + encodeURIComponent(word);
			} else {
				path = path + "&keyword=" + encodeURIComponent(word);
			}
		}

		apiGet(path, putItems);
	}


	/* 서버 응답을 배열에 옮겨 담습니다.
	   data 안에는 items / page / size / total 이 들어 있습니다. */
	function putItems(data) {

		let list = data.items;
		totalCount = data.total;

		itemIds = [];
		itemNames = [];
		itemCategories = [];
		itemUnits = [];
		itemMins = [];
		itemMaxs = [];
		itemShelfs = [];

		for (let i = 0; i < list.length; i++) {
			itemIds[i] = list[i].itemId;
			itemNames[i] = list[i].itemName;
			itemCategories[i] = list[i].category;
			itemUnits[i] = list[i].unit;
			itemMins[i] = list[i].thresholdMin;
			itemMaxs[i] = list[i].capacityMax;
			itemShelfs[i] = list[i].shelfLifeDays;

			/* 서버가 총 재고를 같이 내려주면 그 값을 씁니다.
			   (4번 담당자가 만들어 주면 여기가 자동으로 쓰입니다) */
			if (list[i].totalStock != null) {

				let found = false;

				for (let k = 0; k < stockItemIds.length; k++) {
					if (stockItemIds[k] == list[i].itemId) {
						stockTotals[k] = list[i].totalStock;
						found = true;
					}
				}

				if (found == false) {
					let n = stockItemIds.length;
					stockItemIds[n] = list[i].itemId;
					stockTotals[n] = list[i].totalStock;
				}
			}
		}

		drawList();
	}


	/* ============================================================
	   2. 표 그리기
	   ============================================================ */
	function drawList() {

		let html = "";

		if (itemIds.length == 0) {
			document.querySelector("#itemBody").innerHTML = "<tr><td colspan='8'>조건에 맞는 품목이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		/* 지금 쪽의 첫 번호 (2쪽이면 11번부터) */
		let startNo = (nowPage - 1) * pageSize;

		for (let i = 0; i < itemIds.length; i++) {

			/* 값이 없는 칸은 - 로 보여 줍니다 */
			let category = itemCategories[i];
			if (category == null || category == "") {
				category = "-";
			}

			let shelf = "-";
			if (itemShelfs[i] != null) {
				shelf = itemShelfs[i] + "일";
			}

			html = html + "<tr>";
			html = html + "<td>" + (startNo + i + 1) + "</td>";
			html = html + "<td>ITEM-" + itemIds[i] + "</td>";
			html = html + "<td>" + itemNames[i] + "</td>";
			html = html + "<td>" + category + "</td>";
			html = html + "<td>" + itemUnits[i] + "</td>";
			html = html + "<td>" + shelf + "</td>";
			html = html + "<td>" + stockCell(i) + "</td>";
			html = html + "<td>";
			html = html + "<button class='edit-btn' onclick='openItem(" + i + ")'>수정</button>";
			html = html + "<button class='delete-btn' onclick='doDelete(" + i + ")'>삭제</button>";
			html = html + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#itemBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	/* 쪽 번호를 눌렀을 때 - 서버에서 그 쪽을 새로 받아옵니다 */
	function goPage(p) {
		nowPage = p;
		loadData();
	}


	/* 검색 버튼 - 검색하면 항상 1쪽부터 봅니다 */
	function doSearch() {
		nowPage = 1;
		loadData();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	/* ============================================================
	   2-1. 총 재고

	   재고는 로트마다 흩어져 있어서, 품목 하나의 총 재고를 알려면
	   그 품목의 로트를 모두 더해야 합니다.

	   서버가 품목 목록에 totalStock 을 넣어 주면 그 값을 그대로 쓰고,
	   아직 없으면 여기서 로트를 받아 더합니다.
	   ============================================================ */
	function loadStock() {

		/* 한 번만 받으면 됩니다 */
		if (stockLoaded == true) {
			loadData();
			return;
		}

		stockItemIds = [];
		stockTotals = [];
		lotItemIds = [];
		lotIds = [];
		lotZoneIds = [];
		lotQtys = [];
		lotInDates = [];
		lotExpiries = [];

		apiGet("/api/stock-lots?status=NORMAL&page=1&size=200", putStock1);
	}


	function putStock1(data) {

		addStock(data.items);

		/* 로트가 200개를 넘으면 다음 쪽도 받아옵니다 */
		if (data.total > 200) {
			apiGet("/api/stock-lots?status=NORMAL&page=2&size=200", putStock2);
		} else {
			finishStock();
		}
	}


	function putStock2(data) {
		addStock(data.items);
		finishStock();
	}


	function addStock(list) {

		for (let i = 0; i < list.length; i++) {

			/* 로트 하나하나를 따로 보관합니다 (상세보기용) */
			let last = lotIds.length;

			lotIds[last] = list[i].lotId;
			lotItemIds[last] = list[i].itemId;
			lotZoneIds[last] = list[i].zoneId;
			lotQtys[last] = list[i].quantity;
			lotInDates[last] = list[i].inboundDate;
			lotExpiries[last] = list[i].expiryDate;

			/* 품목별로 수량을 더합니다 */
			let found = false;

			for (let k = 0; k < stockItemIds.length; k++) {
				if (stockItemIds[k] == list[i].itemId) {
					stockTotals[k] = stockTotals[k] + list[i].quantity;
					found = true;
				}
			}

			if (found == false) {
				let n = stockItemIds.length;
				stockItemIds[n] = list[i].itemId;
				stockTotals[n] = list[i].quantity;
			}
		}
	}


	function finishStock() {
		stockLoaded = true;
		loadData();
	}


	/* 품목번호로 총 재고를 찾습니다. 없으면 0 */
	function findStock(itemId) {

		for (let i = 0; i < stockItemIds.length; i++) {
			if (stockItemIds[i] == itemId) {
				return stockTotals[i];
			}
		}
		return 0;
	}


	/* 표의 총 재고 칸을 만듭니다.
	   누르면 어느 창고 어느 구역에 있는지 볼 수 있습니다. */
	function stockCell(i) {

		let total = findStock(itemIds[i]);
		let text = addComma(total) + " " + itemUnits[i];

		/* 재고가 아예 없으면 가장 눈에 띄게(빨강) 표시하고,
		   볼 로트도 없어서 버튼을 안 만듭니다 */
		if (total == 0) {
			return "<span class='zone-full'>0 " + itemUnits[i] + "</span>";
		}

		/* 부족 기준 아래면 주의 표시(주황)를 합니다 */
		if (itemMins[i] != null && total <= itemMins[i]) {
			text = "<span class='zone-warn'>" + text + "</span>";
		}

		return "<button class='edit-btn' onclick='openStock(" + i + ")'>" + text + "</button>";
	}


	/* ============================================================
	   2-2. 재고 상세 - 어느 창고 어느 구역에 있는지
	   ============================================================ */
	function openStock(i) {

		let itemId = itemIds[i];
		let total = findStock(itemId);

		document.querySelector("#stockTitle").innerHTML = itemNames[i] + " (ITEM-" + itemId + ") 재고 상세";
		document.querySelector("#stockTotalText").innerHTML =
			"총 재고 " + addComma(total) + " " + itemUnits[i] + " / 부족 기준 " + itemMins[i] + " " + itemUnits[i];

		/* 이 품목의 로트만 골라서 그립니다.
		   유통기한이 빠른 순으로 줄을 세웁니다 (먼저 나가야 할 것이 위로). */
		let pick = [];

		for (let k = 0; k < lotIds.length; k++) {
			if (lotItemIds[k] == itemId) {
				pick[pick.length] = k;
			}
		}

		for (let a = 0; a < pick.length; a++) {
			for (let b = a + 1; b < pick.length; b++) {

				let left = lotExpiries[pick[a]];
				let right = lotExpiries[pick[b]];

				/* 유통기한이 없는 것은 맨 뒤로 보냅니다 */
				if (left == null) {
					left = "9999-99-99";
				}
				if (right == null) {
					right = "9999-99-99";
				}

				if (left > right) {
					let t = pick[a];
					pick[a] = pick[b];
					pick[b] = t;
				}
			}
		}

		let html = "";
		let zoneCount = 0;
		let zoneSeen = [];

		for (let n = 0; n < pick.length; n++) {

			let k = pick[n];
			let zoneText = findZoneName(lotZoneIds[k]);

			/* 몇 개 구역에 흩어져 있는지 세어 둡니다 */
			let already = false;

			for (let z = 0; z < zoneSeen.length; z++) {
				if (zoneSeen[z] == lotZoneIds[k]) {
					already = true;
				}
			}

			if (already == false) {
				zoneSeen[zoneSeen.length] = lotZoneIds[k];
				zoneCount = zoneCount + 1;
			}

			/* 유통기한이 7일 이내로 남았으면 눈에 띄게 표시합니다 */
			let expiry = "-";

			if (lotExpiries[k] != null) {

				expiry = lotExpiries[k];

				if (isNearExpiry(expiry) == true) {

					let left = getLeftDays(expiry);
					let word = "D-" + left;

					if (left < 0) {
						word = "기한 지남";
					}

					expiry = "<span class='near-expiry'>" + expiry + " (" + word + ")</span>";
				}
			}

			html = html + "<tr>";
			html = html + "<td>LOT-" + lotIds[k] + "</td>";
			html = html + "<td>" + zoneText + "</td>";
			html = html + "<td>" + addComma(lotQtys[k]) + " " + itemUnits[i] + "</td>";
			html = html + "<td>" + lotInDates[k] + "</td>";
			html = html + "<td>" + expiry + "</td>";
			html = html + "</tr>";
		}

		if (html == "") {
			html = "<tr><td colspan='5'>남아 있는 재고가 없습니다.</td></tr>";
		}

		document.querySelector("#stockBody").innerHTML = html;
		document.querySelector("#stockZoneNote").innerHTML =
			"로트 " + pick.length + "개 / 구역 " + zoneCount + "곳에 나뉘어 보관 중입니다. (유통기한이 빠른 순)";

		openModal("#stockModal");
	}


	function closeStock() {
		closeModal("#stockModal");
	}


	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 */
	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   3. 등록 / 수정  (POST, PUT /api/items)

	   등록·수정·삭제는 관리자(ADMIN)만 할 수 있습니다.
	   담당자(STAFF)로 로그인하면 서버가 403으로 막고,
	   화면에는 "권한이 없습니다" 라고 뜹니다.
	   ============================================================ */

	/* index 가 -1 이면 새로 등록, 아니면 그 줄을 고칩니다 */
	function openItem(index) {

		loadMaster();
		fillCategory("#mCategory");

		if (index == -1) {

			editId = -1;
			document.querySelector("#itemTitle").innerHTML = "품목 등록";
			clearInput(["#mName", "#mMin", "#mMax", "#mShelf"]);

		} else {

			editId = itemIds[index];
			document.querySelector("#itemTitle").innerHTML = "품목 수정 (ITEM-" + editId + ")";
			document.querySelector("#mName").value = itemNames[index];
			document.querySelector("#mUnit").value = itemUnits[index];
			document.querySelector("#mMin").value = itemMins[index];
			document.querySelector("#mMax").value = itemMaxs[index];

			if (itemCategories[index] != null) {
				document.querySelector("#mCategory").value = itemCategories[index];
			}

			if (itemShelfs[index] == null) {
				document.querySelector("#mShelf").value = "";
			} else {
				document.querySelector("#mShelf").value = itemShelfs[index];
			}
		}

		openModal("#itemModal");
	}


	function closeItem() {
		closeModal("#itemModal");
		editId = -1;
	}


	function saveItem() {

		if (isBlank(["#mName", "#mMin", "#mMax"]) == true) {
			alert("품목명과 알림 기준을 채워 주세요.");
			return;
		}

		let min = document.querySelector("#mMin").value * 1;
		let max = document.querySelector("#mMax").value * 1;

		/* 부족 기준이 초과 기준보다 크면 알림이 항상 울립니다 */
		if (min >= max) {
			alert("부족 알림 기준(" + min + ")은 초과 알림 기준(" + max + ")보다 작아야 합니다.");
			return;
		}

		/* 유통기한 일수는 비워둘 수 있습니다 (없는 품목) */
		let shelf = document.querySelector("#mShelf").value;
		let shelfValue = null;

		if (shelf != "") {
			shelfValue = shelf * 1;
		}

		/* 서버로 보낼 값 */
		let body = {
			itemName: document.querySelector("#mName").value,
			category: document.querySelector("#mCategory").value,
			unit: document.querySelector("#mUnit").value,
			thresholdMin: min,
			capacityMax: max,
			shelfLifeDays: shelfValue
		};

		if (editId == -1) {
			apiSend("POST", "/api/items", body, afterSave);
		} else {
			apiSend("PUT", "/api/items/" + editId, body, afterSave);
		}
	}


	/* 저장이 끝나면 목록을 서버에서 다시 받아옵니다 */
	function afterSave(data) {
		closeItem();
		loadData();
	}


	/* ============================================================
	   4. 삭제  (DELETE /api/items/{id})

	   재고나 입출고 이력이 이 품목을 쓰고 있으면
	   서버가 409로 막고 "다른 데이터에서 참조 중이라 삭제할 수 없습니다"를 보냅니다.
	   ============================================================ */
	function doDelete(index) {

		if (confirm(itemNames[index] + " 을 삭제할까요?") == false) {
			return;
		}

		apiSend("DELETE", "/api/items/" + itemIds[index], null, afterDelete);
	}


	function afterDelete(data) {
		loadData();
	}


	/* ============================================================
	   화면이 열릴 때 실행

	   구역 이름을 보여주려면 창고·구역 정보가 먼저 있어야 하고,
	   총 재고를 보여주려면 로트가 먼저 있어야 해서 순서대로 받습니다.

	     창고·구역·품목 기준정보 → 재고 로트 → 품목 목록
	   ============================================================ */
	function startUp() {
		loadMasterFromServer(loadStock);
	}


	startUp();

</script>


<!-- 품목 등록/수정 모달 -->
<div class="modal-overlay" id="itemModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="itemTitle">품목 등록</h3>
			<button class="modal-close" onclick="closeItem()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>품목명</label>
				<input type="text" id="mName">
			</div>
			
			<div class="form-group">
				<label>카테고리</label>
				<select id="mCategory">
				</select>
			</div>
			
			<div class="form-group">
				<label>단위</label>
				<select id="mUnit">
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>부족 알림 기준</label>
				<input type="number" id="mMin" placeholder="이 수량 아래면 알림">
			</div>
			
			<div class="form-group">
				<label>초과 알림 기준</label>
				<input type="number" id="mMax" placeholder="이 수량 넘으면 알림">
			</div>
			
			<div class="form-group">
				<label>유통기한 일수</label>
				<input type="number" id="mShelf" placeholder="없으면 비워 두세요">
			</div>
		</section>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeItem()">취소</button>
			<button class="btn-primary" onclick="saveItem()">저장</button>
		</div>
	</div>
</div>


<!-- 재고 상세 모달 : 어느 창고 어느 구역에 얼마나 있는지 -->
<div class="modal-overlay" id="stockModal">
	<div class="modal-box lot-modal">
	
		<div class="modal-header">
			<h3 id="stockTitle">재고 상세</h3>
			<button class="modal-close" onclick="closeStock()"> x </button>
		</div>
		
		<div class="modal-content">
			<strong id="stockTotalText"></strong>
		</div>
		
		<div id="stockZoneNote" class="list-note"></div>
		
		<table>
			<thead>
				<tr>
					<th>로트 번호</th>
					<th>창고 / 구역</th>
					<th>수량</th>
					<th>입고일</th>
					<th>유통기한</th>
				</tr>
			</thead>
			<tbody id="stockBody">
			</tbody>
		</table>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeStock()">닫기</button>
		</div>
	</div>
</div>

</body>

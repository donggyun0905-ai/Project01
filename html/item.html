<!DOCTYPE html> <!-- 08.12 생성 품목 관리 -->
<!-- 품목관리 페이지에 맞게 일부 내용을 고쳤습니다 (명세서엔 없던 카테고리 항목 추가, 입고 일자 빠짐 등등) -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>품목 관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/item.css">
		
		<!-- 서버 통신 공통 함수 -->
		<script src="../js/api.js"></script>
		<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn active">품목 관리</button> <!--현재 화면이 품목 관리라서 -->
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button>
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<!-- 검색하는 부분 -->
		<section class="search-box">
			<label for="item-search">품목명</label>
			<div class="search-input-wrap">
				<input type="text" id="item-search" placeholder="검색" onkeyup="pressEnter(event)">
				<button type="button" class="search-btn" onclick="doSearch()"></button>
			</div>
			
			<select class="category-select" id="searchField" onchange="doSearch()">
	       	 	<option>전체</option>
	       	 	<option>품목 코드</option>
	       	 	<option>품목명</option>
	       	 	<option>카테고리</option>
	       	 	<option>단위</option>
	    		</select>
	    	
			<!-- 활성 / 비활성 골라 보기 -->
			<select class="category-select" id="activeFilter" onchange="doSearch()">
				<option value="true">사용 중</option>
				<option value="false">비활성</option>
			</select>
			
			<!-- 품목 등록 (F-01) -->
			<button class="register-btn" onclick="openItem(-1)">품목 등록</button>

			<!-- 품목 데이터 엑셀화 - report.html의 PDF 다운로드 버튼과 같은 방식(세션 쿠키가
			     그대로 따라가는 location.href 이동)으로 서버가 만든 파일을 그대로 받습니다. -->
			<button class="register-btn export-btn" onclick="exportItemsExcel()">엑셀로 내보내기</button>
		</section>
		
		<!-- 품목 목록(표)  -->
		<section class= "table-box">
			<table>
				<colgroup>
					<col style="width:8%">
					<col style="width:13%">
					<col style="width:20%">
					<col style="width:13%">
					<col style="width:9%">
					<col style="width:13%">
					<col style="width:12%">
					<col style="width:12%">
				</colgroup>
				<thead>
					<tr>
						<th>NO <span id="noSortIcon" class="sort-icon" onclick="toggleOrder()">▲</span></th>
						<th>품목 코드</th>
						<th>품목명</th>
						<th>카테고리</th>
						<th>단위</th>
						<th>유통기한</th>
						<th>총 재고</th>
						<th>관리</th>
					</tr>
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="itemBody">
					</tbody>
			</table>
		
			<!-- 쪽 번호 -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     품목 관리 화면 로직
     ------------------------------------------------------------
     품목 정보 : 품목코드 / 품목명 / 카테고리 / 단위 / 유통기한 일수

     총 재고(totalQuantity)는 서버가 품목마다 계산해서 같이 보내 줍니다.

     삭제 대신 "비활성" 을 씁니다. 품목을 실제로 지우면 그 품목을 쓰던
     입출고 기록까지 깨지기 때문입니다. 비활성이 되면 목록에서 빠지고
     입고·출고·이동·반품에서도 고를 수 없게 됩니다.
     되살리려면 위쪽에서 "비활성" 을 골라 목록을 보면 됩니다.
     ============================================================ -->
<script>

	/* 서버에서 받아온 품목 목록.
	   같은 번호끼리 한 줄이 됩니다. */
	let itemIds = [];
	let itemNames = [];
	let itemCategories = [];
	let itemUnits = [];
	let itemMins = [];       // 부족 알림 기준
	let itemMaxs = [];       // 초과 알림 기준
	let itemShelfs = [];     // 유통기한 일수 (없으면 null)

	/* 지금 보고 있는 쪽과 전체 건수 */
	let nowPage = 1;
	let totalCount = 0;

	/* NO 컬럼 정렬 방향. "asc"=등록순, "desc"=최신 등록순(역순) */
	let nowOrder = "asc";

	/* 수정 중인 품목 번호. -1 이면 새로 등록하는 중입니다. */
	let editId = -1;

	/* 품목별 총 재고. 서버가 품목 목록에 같이 보내 줍니다. */
	let itemStocks = [];

	/* 품목이 지금 쓸 수 있는 상태인지 */
	let itemActives = [];

	/* 재고 상세(어느 구역에 있는지)는 눌렀을 때만 그 품목의 로트를 받아옵니다 */
	let lotIds = [];
	let lotZoneIds = [];
	let lotQtys = [];
	let lotInDates = [];
	let lotExpiries = [];
	let openItemIndex = -1;


	/* ============================================================
	   1. 목록 불러오기  (GET /api/items)

	   서버가 page / size 로 잘라서 보내주기 때문에
	   화면에서 따로 자르지 않고 받은 그대로 그립니다.
	   ============================================================ */
	function loadData() {

		let path = "/api/items?page=" + nowPage + "&size=" + pageSize + "&order=" + nowOrder;

		/* 사용 중 / 비활성 중 어느 쪽을 볼지 */
		path = path + "&active=" + document.querySelector("#activeFilter").value;

		/* 검색어가 있으면, 고른 컬럼에 맞는 파라미터로 보냅니다.
		   (예전엔 "품목 코드"/"단위"를 골라도 그냥 keyword(품목명)로만 보내서
		   실제로는 품목명 검색이랑 똑같이 동작하던 버그가 있었음 - 고침) */
		let word = document.querySelector("#item-search").value;
		let field = document.querySelector("#searchField").value;

		if (word != "") {
			if (field == "카테고리") {
				path = path + "&category=" + encodeURIComponent(word);
			} else if (field == "품목 코드") {
				path = path + "&itemCode=" + encodeURIComponent(word);
			} else if (field == "단위") {
				path = path + "&unit=" + encodeURIComponent(word);
			} else {
				path = path + "&keyword=" + encodeURIComponent(word);
			}
		}

		apiGet(path, putItems);
	}


	/* NO 옆 삼각형을 누르면 정렬 방향을 뒤집습니다.
	   순서 자체는 서버가 바꿔서 보내줘야(item_id ASC/DESC) 페이지가 넘어가도
	   순서가 안 어긋납니다 - 그래서 화면에서 배열만 뒤집지 않고 다시 받아옵니다. */
	function toggleOrder() {

		if (nowOrder == "asc") {
			nowOrder = "desc";
			document.querySelector("#noSortIcon").innerHTML = "▼";
		} else {
			nowOrder = "asc";
			document.querySelector("#noSortIcon").innerHTML = "▲";
		}

		nowPage = 1;
		loadData();
	}


	/* 서버 응답을 배열에 옮겨 담습니다.
	   data 안에는 items / page / size / total 이 들어 있습니다. */
	function putItems(data) {

		let list = data.items;
		totalCount = data.total;

		itemIds = [];
		itemNames = [];
		itemCategories = [];
		itemUnits = [];
		itemMins = [];
		itemMaxs = [];
		itemShelfs = [];
		itemStocks = [];
		itemActives = [];

		for (let i = 0; i < list.length; i++) {

			itemIds[i] = list[i].itemId;
			itemNames[i] = list[i].itemName;
			itemCategories[i] = list[i].category;
			itemUnits[i] = list[i].unit;
			itemMins[i] = list[i].thresholdMin;
			itemMaxs[i] = list[i].capacityMax;
			itemShelfs[i] = list[i].shelfLifeDays;

			/* 총 재고는 서버가 세어서 보내 줍니다 */
			if (list[i].totalQuantity == null) {
				itemStocks[i] = 0;
			} else {
				itemStocks[i] = list[i].totalQuantity;
			}

			/* 값이 없으면 사용 중인 것으로 봅니다 */
			if (list[i].isActive == null) {
				itemActives[i] = true;
			} else {
				itemActives[i] = list[i].isActive;
			}
		}

		drawList();
	}


	/* ============================================================
	   2. 표 그리기
	   ============================================================ */
	function drawList() {

		let html = "";

		if (itemIds.length == 0) {
			document.querySelector("#itemBody").innerHTML = "<tr><td colspan='8'>조건에 맞는 품목이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		/* 지금 쪽의 첫 번호 (2쪽이면 11번부터) */
		let startNo = (nowPage - 1) * pageSize;

		for (let i = 0; i < itemIds.length; i++) {

			/* 값이 없는 칸은 - 로 보여 줍니다 */
			let category = itemCategories[i];
			if (category == null || category == "") {
				category = "-";
			}

			let shelf = "-";
			if (itemShelfs[i] != null) {
				shelf = itemShelfs[i] + "일";
			}

			/* 정순이면 1,2,3...으로 세고, 역순이면 전체 건수에서부터 거꾸로 세어
			   내려가서(N, N-1, N-2...) 화살표를 눌렀을 때 번호도 같이 뒤집혀 보이게 합니다 */
			let no = (nowOrder == "asc") ? (startNo + i + 1) : (totalCount - startNo - i);

			html = html + "<tr onclick='openStock(" + i + ")'>";
			html = html + "<td>" + no + "</td>";
			html = html + "<td>ITEM-" + itemIds[i] + "</td>";
			html = html + "<td>" + itemNames[i] + "</td>";
			html = html + "<td>" + category + "</td>";
			html = html + "<td>" + itemUnits[i] + "</td>";
			html = html + "<td>" + shelf + "</td>";
			html = html + "<td>" + stockCell(i) + "</td>";
			html = html + "<td onclick='event.stopPropagation()'>";
			html = html + "<button class='edit-btn' onclick='openItem(" + i + ")'>수정</button>";

			/* 사용 중이면 비활성으로, 비활성이면 되살리기로 */
			if (itemActives[i] == true) {
				html = html + "<button class='delete-btn' onclick='doDisable(" + i + ")'>비활성</button>";
			} else {
				html = html + "<button class='edit-btn' onclick='doEnable(" + i + ")'>되살리기</button>";
			}

			html = html + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#itemBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	/* 쪽 번호를 눌렀을 때 - 서버에서 그 쪽을 새로 받아옵니다 */
	function goPage(p) {
		nowPage = p;
		loadData();
	}


	/* 검색 버튼 - 검색하면 항상 1쪽부터 봅니다 */
	function doSearch() {
		nowPage = 1;
		loadData();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	/* 품목 데이터 엑셀화 (GET /api/export/items/excel) */
	function exportItemsExcel() {
		location.href = makeUrl("/api/export/items/excel");
	}


	/* ============================================================
	   2-1. 총 재고 칸

	   총 재고는 서버가 품목마다 세어서 보내 줍니다(totalQuantity).
	   행을 누르면 어느 창고 어느 구역에 있는지 볼 수 있습니다(openStock, 표의 <tr> onclick).
	   ============================================================ */
	function stockCell(i) {

		let total = itemStocks[i];
		let text = addComma(total) + " " + itemUnits[i];

		/* 재고가 아예 없으면 가장 눈에 띄게(빨강) 표시합니다 */
		if (total == 0) {
			return "<span class='zone-full'>0 " + itemUnits[i] + "</span>";
		}

		/* 부족 기준 아래면 주의 표시(주황)를 합니다 */
		if (itemMins[i] != null && total <= itemMins[i]) {
			text = "<span class='zone-warn'>" + text + "</span>";
		}

		/* 초과 알림 기준을 넘으면 표시(파랑)를 합니다.
		   부족과 초과가 동시에 걸릴 일은 없어서(기준값 자체가 min < max) else if로 둡니다. */
		else if (itemMaxs[i] != null && total > itemMaxs[i]) {
			text = "<span class='zone-over'>" + text + "</span>";
		}

		return text;
	}


	/* ============================================================
	   2-2. 재고 상세 - 어느 창고 어느 구역에 있는지

	   누른 품목의 로트만 그때 받아옵니다.
	   ============================================================ */
	function openStock(i) {

		openItemIndex = i;

		document.querySelector("#stockTitle").innerHTML = itemNames[i] + " (ITEM-" + itemIds[i] + ") 재고 상세";
		document.querySelector("#stockTotalText").innerHTML =
			"총 재고 " + addComma(itemStocks[i]) + " " + itemUnits[i] + " / 부족 기준 " + itemMins[i] + " " + itemUnits[i];
		document.querySelector("#stockBody").innerHTML = "<tr><td colspan='5'>불러오는 중...</td></tr>";
		document.querySelector("#stockZoneNote").innerHTML = "";

		openModal("#stockModal");

		apiGet("/api/stock-lots?itemId=" + itemIds[i] + "&status=NORMAL&size=200", putLots);
	}


	function putLots(data) {

		let list = data.items;
		let i = openItemIndex;

		lotIds = [];
		lotZoneIds = [];
		lotQtys = [];
		lotInDates = [];
		lotExpiries = [];

		for (let k = 0; k < list.length; k++) {

			/* 남은 수량이 없는 로트는 보여줄 필요가 없습니다 */
			if (list[k].quantity <= 0) {
				continue;
			}

			let last = lotIds.length;

			lotIds[last] = list[k].lotId;
			lotZoneIds[last] = list[k].zoneId;
			lotQtys[last] = list[k].quantity;
			lotInDates[last] = list[k].inboundDate;
			lotExpiries[last] = list[k].expiryDate;
		}

		/* 유통기한이 빠른 순으로 줄을 세웁니다 (먼저 나가야 할 것이 위로) */
		for (let a = 0; a < lotIds.length; a++) {
			for (let b = a + 1; b < lotIds.length; b++) {

				let left = lotExpiries[a];
				let right = lotExpiries[b];

				/* 유통기한이 없는 것은 맨 뒤로 보냅니다 */
				if (left == null) {
					left = "9999-99-99";
				}
				if (right == null) {
					right = "9999-99-99";
				}

				if (left > right) {
					let t1 = lotIds[a];     lotIds[a] = lotIds[b];         lotIds[b] = t1;
					let t2 = lotZoneIds[a]; lotZoneIds[a] = lotZoneIds[b]; lotZoneIds[b] = t2;
					let t3 = lotQtys[a];    lotQtys[a] = lotQtys[b];       lotQtys[b] = t3;
					let t4 = lotInDates[a]; lotInDates[a] = lotInDates[b]; lotInDates[b] = t4;
					let t5 = lotExpiries[a];lotExpiries[a] = lotExpiries[b];lotExpiries[b] = t5;
				}
			}
		}

		let html = "";
		let zoneCount = 0;
		let zoneSeen = [];

		for (let k = 0; k < lotIds.length; k++) {

			/* 몇 개 구역에 흩어져 있는지 세어 둡니다 */
			let already = false;

			for (let z = 0; z < zoneSeen.length; z++) {
				if (zoneSeen[z] == lotZoneIds[k]) {
					already = true;
				}
			}

			if (already == false) {
				zoneSeen[zoneSeen.length] = lotZoneIds[k];
				zoneCount = zoneCount + 1;
			}

			/* 유통기한이 7일 이내로 남았으면 눈에 띄게 표시합니다 */
			let expiry = "-";

			if (lotExpiries[k] != null) {

				expiry = lotExpiries[k];

				if (isNearExpiry(expiry) == true) {

					let left = getLeftDays(expiry);
					let word = "D-" + left;

					if (left < 0) {
						word = "기한 지남";
					}

					expiry = "<span class='near-expiry'>" + expiry + " (" + word + ")</span>";
				}
			}

			html = html + "<tr>";
			html = html + "<td>LOT-" + lotIds[k] + "</td>";
			html = html + "<td>" + findZoneName(lotZoneIds[k]) + "</td>";
			html = html + "<td>" + addComma(lotQtys[k]) + " " + itemUnits[i] + "</td>";
			html = html + "<td>" + lotInDates[k] + "</td>";
			html = html + "<td>" + expiry + "</td>";
			html = html + "</tr>";
		}

		if (html == "") {
			html = "<tr><td colspan='5'>남아 있는 재고가 없습니다.</td></tr>";
		}

		document.querySelector("#stockBody").innerHTML = html;
		document.querySelector("#stockZoneNote").innerHTML =
			"로트 " + lotIds.length + "개 / 구역 " + zoneCount + "곳에 나뉘어 보관 중입니다. (유통기한이 빠른 순)";
	}


	function closeStock() {
		closeModal("#stockModal");
		openItemIndex = -1;
	}


	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 */
	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   3. 등록 / 수정  (POST, PUT /api/items)

	   등록·수정·삭제는 관리자(ADMIN)만 할 수 있습니다.
	   담당자(STAFF)로 로그인하면 서버가 403으로 막고,
	   화면에는 "권한이 없습니다" 라고 뜹니다.
	   ============================================================ */

	/* index 가 -1 이면 새로 등록, 아니면 그 줄을 고칩니다 */
	function openItem(index) {

		loadMaster();
		fillCategory("#mCategory");

		if (index == -1) {

			editId = -1;
			document.querySelector("#itemTitle").innerHTML = "품목 등록";
			clearInput(["#mName", "#mMin", "#mMax", "#mShelf"]);

		} else {

			editId = itemIds[index];
			document.querySelector("#itemTitle").innerHTML = "품목 수정 (ITEM-" + editId + ")";
			document.querySelector("#mName").value = itemNames[index];
			document.querySelector("#mUnit").value = itemUnits[index];
			document.querySelector("#mMin").value = itemMins[index];
			document.querySelector("#mMax").value = itemMaxs[index];

			if (itemCategories[index] != null) {
				document.querySelector("#mCategory").value = itemCategories[index];
			}

			if (itemShelfs[index] == null) {
				document.querySelector("#mShelf").value = "";
			} else {
				document.querySelector("#mShelf").value = itemShelfs[index];
			}
		}

		openModal("#itemModal");
	}


	function closeItem() {
		closeModal("#itemModal");
		editId = -1;
	}


	function saveItem() {

		if (isBlank(["#mName", "#mMin", "#mMax"]) == true) {
			alert("품목명과 알림 기준을 채워 주세요.");
			return;
		}

		let min = document.querySelector("#mMin").value * 1;
		let max = document.querySelector("#mMax").value * 1;

		/* 부족 기준이 초과 기준보다 크면 알림이 항상 울립니다 */
		if (min >= max) {
			alert("부족 알림 기준(" + min + ")은 초과 알림 기준(" + max + ")보다 작아야 합니다.");
			return;
		}

		/* 유통기한 일수는 비워둘 수 있습니다 (없는 품목) */
		let shelf = document.querySelector("#mShelf").value;
		let shelfValue = null;

		if (shelf != "") {
			shelfValue = shelf * 1;
		}

		/* 서버로 보낼 값 */
		/* 수정할 때 지금 상태를 그대로 유지합니다.
		   새로 등록하는 것은 당연히 사용 중으로 시작합니다.
		   editId 는 품목번호라, 목록에서 몇 번째인지 찾아 씁니다. */
		let active = true;

		if (editId != -1) {
			for (let i = 0; i < itemIds.length; i++) {
				if (itemIds[i] == editId) {
					active = itemActives[i];
				}
			}
		}

		let body = {
			itemName: document.querySelector("#mName").value,
			category: document.querySelector("#mCategory").value,
			unit: document.querySelector("#mUnit").value,
			thresholdMin: min,
			capacityMax: max,
			shelfLifeDays: shelfValue,
			isActive: active
		};

		if (editId == -1) {
			apiSend("POST", "/api/items", body, afterSave);
		} else {
			apiSend("PUT", "/api/items/" + editId, body, afterSave);
		}
	}


	/* 저장이 끝나면 목록을 서버에서 다시 받아옵니다 */
	function afterSave(data) {
		closeItem();
		loadData();
	}


	/* ============================================================
	   4. 비활성 / 되살리기  (PUT /api/items/{id})

	   품목을 실제로 지우지 않고 "쓰지 않음" 표시만 바꿉니다.
	   그 품목을 쓰던 입고·출고 기록이 그대로 남아야 하기 때문입니다.

	   비활성이 되면
	     - 이 목록에서 빠지고 (위쪽에서 "비활성" 을 골라야 보임)
	     - 입고·출고·이동·반품의 품목 후보에서도 빠집니다

	   재고가 남아 있으면 비활성으로 바꿀 수 없습니다.
	   남은 재고를 아무도 처리할 수 없게 되기 때문입니다.
	   ============================================================ */
	function doDisable(index) {

		/* 재고가 남아 있으면 막습니다 */
		if (itemStocks[index] > 0) {
			alert(itemNames[index] + " 은 재고가 " + addComma(itemStocks[index]) + " " + itemUnits[index] + " 남아 있어 비활성으로 바꿀 수 없습니다.\n\n출고하거나 폐기해서 재고를 0으로 만든 뒤에 다시 시도해 주세요.");
			return;
		}

		let ask = itemNames[index] + " 을 비활성으로 바꿀까요?\n\n";
		ask = ask + "목록과 입고·출고 화면에서 보이지 않게 됩니다.\n";
		ask = ask + "지난 기록은 그대로 남고, 언제든 되살릴 수 있습니다.";

		if (confirm(ask) == false) {
			return;
		}

		sendActive(index, false);
	}


	function doEnable(index) {

		if (confirm(itemNames[index] + " 을 다시 사용할까요?") == false) {
			return;
		}

		sendActive(index, true);
	}


	/* 수정과 같은 통로(PUT)로 보냅니다.
	   품목 정보는 그대로 두고 isActive 만 바꿉니다. */
	function sendActive(index, active) {

		let body = {
			itemName: itemNames[index],
			category: itemCategories[index],
			unit: itemUnits[index],
			thresholdMin: itemMins[index],
			capacityMax: itemMaxs[index],
			shelfLifeDays: itemShelfs[index],
			isActive: active
		};

		apiSend("PUT", "/api/items/" + itemIds[index], body, afterSave);
	}


	/* ============================================================
	   화면이 열릴 때 실행

	   재고 상세에서 구역 이름을 보여주려면 창고·구역 정보가 먼저 있어야 해서
	   기준정보를 받은 뒤에 품목 목록을 받습니다.

	     창고·구역 기준정보 → 품목 목록
	   ============================================================ */
	function startUp() {
		loadMasterFromServer(loadData);
	}


	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>


<!-- 품목 등록/수정 모달 -->
<div class="modal-overlay" id="itemModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="itemTitle">품목 등록</h3>
			<button class="modal-close" onclick="closeItem()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>품목명</label>
				<input type="text" id="mName">
			</div>
			
			<div class="form-group">
				<label>카테고리</label>
				<select id="mCategory">
				</select>
			</div>
			
			<div class="form-group">
				<label>단위</label>
				<select id="mUnit">
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>부족 알림 기준</label>
				<input type="number" id="mMin" placeholder="이 수량 아래면 알림">
			</div>
			
			<div class="form-group">
				<label>초과 알림 기준</label>
				<input type="number" id="mMax" placeholder="이 수량 넘으면 알림">
			</div>
			
			<div class="form-group">
				<label>유통기한 일수</label>
				<input type="number" id="mShelf" placeholder="없으면 비워 두세요">
			</div>
		</section>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeItem()">취소</button>
			<button class="btn-primary" onclick="saveItem()">저장</button>
		</div>
	</div>
</div>


<!-- 재고 상세 모달 : 어느 창고 어느 구역에 얼마나 있는지 -->
<div class="modal-overlay" id="stockModal">
	<div class="modal-box lot-modal">
	
		<div class="modal-header">
			<h3 id="stockTitle">재고 상세</h3>
			<button class="modal-close" onclick="closeStock()"> x </button>
		</div>
		
		<div class="modal-content">
			<strong id="stockTotalText"></strong>
		</div>
		
		<div id="stockZoneNote" class="list-note"></div>

		<div class="stock-table-wrap">
		<table>
			<colgroup>
				<col style="width:22%">
				<col style="width:26%">
				<col style="width:16%">
				<col style="width:18%">
				<col style="width:18%">
			</colgroup>
			<thead>
				<tr>
					<th>로트 번호</th>
					<th>창고 / 구역</th>
					<th>수량</th>
					<th>입고일</th>
					<th>유통기한</th>
				</tr>
			</thead>
			<tbody id="stockBody">
			</tbody>
		</table>
		</div>

		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeStock()">닫기</button>
		</div>
	</div>
</div>

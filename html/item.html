<!DOCTYPE html> <!-- 08.12 생성 품목 관리 -->
<!-- 품목관리 페이지에 맞게 일부 내용을 고쳤습니다 (명세서엔 없던 카테고리 항목 추가, 입고 일자 빠짐 등등) -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>품목 관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/item.css">
		
		<!-- 서버 통신 공통 함수 -->
		<script src="../js/api.js"></script>
		<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 대시보드</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn active">품목 관리</button> <!--현재 화면이 품목 관리라서 -->
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button>
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<!-- 검색하는 부분 -->
		<section class="search-box">
			<label for="item-search">품목명</label>
			<div class="search-input-wrap">
				<input type="text" id="item-search" placeholder="검색" onkeyup="pressEnter(event)">
				<button type="button" class="search-btn" onclick="doSearch()"></button>
			</div>
			
			<select class="category-select" id="searchField" onchange="doSearch()">
	       	 	<option>전체</option>
	       	 	<option>품목 코드</option>
	       	 	<option>품목명</option>
	       	 	<option>카테고리</option>
	       	 	<option>단위</option>
	       	 	<option>단가</option>
	       	 	<option>유통기한</option>
	       	 	<option>구역</option>
	        		<option>담당자</option>
	    		</select>
	    	
			<!-- 품목 등록 (F-01) -->
			<button class="register-btn" onclick="openItem(-1)">품목 등록</button>
		</section>
		
		<!-- 품목 목록(표)  -->
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>품목 코드</th>
						<th>품목명</th>
						<th>카테고리</th>
						<th>단위</th>
						<th>단가</th>
						<th>유통기한</th>
						<th>구역</th>
						<th>담당자</th>
						<th>관리</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="itemBody">
					</tbody>
			</table>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     품목 관리 화면 로직
     ------------------------------------------------------------
     서버에서 받을 수 있는 값 : 품목코드 / 품목명 / 카테고리 / 단위
     단가 : ITEM 테이블에 컬럼이 없음 (팀 확인 필요)
     유통기한 / 구역 / 담당자 : STOCK_LOT 소관, /api/stock-lots 구현 후 가능
     -> 위 4개는 "-" 로 표시합니다
     ============================================================ -->
<script>

	/* 품목 목록. 같은 번호끼리 한 줄이 됩니다. */
	let itemIds = [];
	let itemNames = [];
	let itemCategories = [];
	let itemUnits = [];
	let itemMins = [];       // 부족 알림 기준
	let itemMaxs = [];       // 초과 알림 기준
	let itemShelfs = [];     // 유통기한 일수 (없으면 빈 값)
	let itemStocks = [];     // 남은 재고 (삭제 가능한지 판단용)

	let editIndex = -1;
	let itemSeq = 300;


	/* 품목 목록을 가져옵니다.
	   나중에 : apiGet("/api/items?size=200", putItems) */
	function loadData() {

		itemIds        = [1, 2, 3, 4, 5, 201, 202];
		itemNames      = ["두부 프리미엄", "어묵 정품", "만두 프리미엄", "김치 실속형",
		                  "샐러드 프리미엄", "주방세제 대용량", "물티슈 캡형"];
		itemCategories = ["냉장식품", "냉동식품", "냉동식품", "냉장식품",
		                  "신선식품", "청소용품", "생활용품"];
		itemUnits      = ["EA", "BOX", "BOX", "BOX", "EA", "EA", "BOX"];
		itemMins       = [16, 10, 20, 3, 15, 10, 12];
		itemMaxs       = [200, 150, 180, 60, 120, 300, 250];
		itemShelfs     = [8, 180, 365, 30, 5, "", ""];
		itemStocks     = [60, 12, 88, 0, 44, 80, 0];

		drawList();
	}


	/* 검색 조건에 맞는 품목 번호만 골라냅니다 */
	function getList() {

		let keyword = document.querySelector("#item-search").value;
		let field = document.querySelector("#searchField").value;
		let result = [];

		for (let i = 0; i < itemIds.length; i++) {

			/* 검색어가 없으면 전부 보여 줍니다 */
			if (keyword == "") {
				result[result.length] = i;
				continue;
			}

			/* 어느 칸에서 찾을지에 따라 비교 대상이 달라집니다 */
			let target = itemNames[i] + " ITEM-" + itemIds[i] + " " + itemCategories[i] + " " + itemUnits[i];

			if (field == "품목명") {
				target = itemNames[i];
			} else if (field == "품목 코드") {
				target = "ITEM-" + itemIds[i];
			} else if (field == "카테고리") {
				target = itemCategories[i];
			} else if (field == "단위") {
				target = itemUnits[i];
			}

			if (target.indexOf(keyword) >= 0) {
				result[result.length] = i;
			}
		}

		return result;
	}


	function drawList() {

		let list = getList();
		let html = "";

		if (list.length == 0) {
			document.querySelector("#itemBody").innerHTML = "<tr><td colspan='10'>조건에 맞는 품목이 없습니다.</td></tr>";
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];

			/* 유통기한 일수가 없는 품목도 있습니다 */
			let shelf = "-";
			if (itemShelfs[i] != "") {
				shelf = itemShelfs[i] + "일";
			}

			html = html + "<tr>";
			html = html + "<td>" + (n + 1) + "</td>";
			html = html + "<td>ITEM-" + itemIds[i] + "</td>";
			html = html + "<td>" + itemNames[i] + "</td>";
			html = html + "<td>" + itemCategories[i] + "</td>";
			html = html + "<td>" + itemUnits[i] + "</td>";
			html = html + "<td>-</td>";       /* 단가 : ITEM 표에 컬럼이 없음 (팀 확인 필요) */
			html = html + "<td>" + shelf + "</td>";
			html = html + "<td>-</td>";       /* 구역 : STOCK_LOT 소관 */
			html = html + "<td>-</td>";       /* 담당자 : STOCK_LOT 소관 */
			html = html + "<td>";
			html = html + "<button class='edit-btn' onclick='openItem(" + i + ")'>수정</button>";
			html = html + "<button class='delete-btn' onclick='doDelete(" + i + ")'>삭제</button>";
			html = html + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#itemBody").innerHTML = html;
	}


	/* 검색 버튼 */
	function doSearch() {
		drawList();
	}


	/* 검색창에서 엔터를 눌렀을 때 */
	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	/* ---------- 품목 등록 / 수정 (F-01) ---------- */

	/* index 가 -1 이면 새로 등록, 아니면 그 줄을 고칩니다 */
	function openItem(index) {

		editIndex = index;

		loadMaster();
		fillCategory("#mCategory");

		if (index == -1) {
			document.querySelector("#itemTitle").innerHTML = "품목 등록";
			clearInput(["#mName", "#mMin", "#mMax", "#mShelf"]);
		} else {
			document.querySelector("#itemTitle").innerHTML = "품목 수정";
			document.querySelector("#mName").value = itemNames[index];
			document.querySelector("#mCategory").value = itemCategories[index];
			document.querySelector("#mUnit").value = itemUnits[index];
			document.querySelector("#mMin").value = itemMins[index];
			document.querySelector("#mMax").value = itemMaxs[index];
			document.querySelector("#mShelf").value = itemShelfs[index];
		}

		openModal("#itemModal");
	}


	function closeItem() {
		closeModal("#itemModal");
		editIndex = -1;
	}


	function saveItem() {

		if (isBlank(["#mName", "#mMin", "#mMax"]) == true) {
			alert("품목명과 알림 기준을 채워 주세요.");
			return;
		}

		let name = document.querySelector("#mName").value;
		let min = document.querySelector("#mMin").value * 1;
		let max = document.querySelector("#mMax").value * 1;
		let shelf = document.querySelector("#mShelf").value;

		/* 부족 기준이 초과 기준보다 크면 알림이 항상 울립니다 */
		if (min >= max) {
			alert("부족 알림 기준(" + min + ")은 초과 알림 기준(" + max + ")보다 작아야 합니다.");
			return;
		}

		/* 같은 이름의 품목이 이미 있으면 안 됩니다 */
		for (let i = 0; i < itemIds.length; i++) {
			if (i != editIndex && itemNames[i] == name) {
				alert("이미 등록된 품목명입니다.");
				return;
			}
		}

		if (editIndex == -1) {

			let last = itemIds.length;

			itemIds[last]        = itemSeq;
			itemNames[last]      = name;
			itemCategories[last] = document.querySelector("#mCategory").value;
			itemUnits[last]      = document.querySelector("#mUnit").value;
			itemMins[last]       = min;
			itemMaxs[last]       = max;
			itemShelfs[last]     = shelf;
			itemStocks[last]     = 0;

			itemSeq = itemSeq + 1;

		} else {

			itemNames[editIndex]      = name;
			itemCategories[editIndex] = document.querySelector("#mCategory").value;
			itemUnits[editIndex]      = document.querySelector("#mUnit").value;
			itemMins[editIndex]       = min;
			itemMaxs[editIndex]       = max;
			itemShelfs[editIndex]     = shelf;
		}

		drawList();
		closeItem();
	}


	/* 품목 삭제.
	   재고가 남아 있으면 지울 수 없습니다 (명세서 F-01).
	   실제로는 행을 지우지 않고 "삭제됨" 표시만 하는 논리 삭제입니다.
	   지난 입출고 기록이 이 품목을 참조하고 있기 때문입니다. */
	function doDelete(index) {

		if (itemStocks[index] > 0) {
			alert(itemNames[index] + " 은 재고가 " + itemStocks[index] + "개 남아 있어 삭제할 수 없습니다.\n재고를 모두 처리한 뒤에 지워 주세요.");
			return;
		}

		if (confirm(itemNames[index] + " 을 삭제할까요?") == false) {
			return;
		}

		removeAt([itemIds, itemNames, itemCategories, itemUnits,
		          itemMins, itemMaxs, itemShelfs, itemStocks], index);

		drawList();
	}


	/* 화면이 열릴 때 실행 */
	loadData();

</script>


<!-- 품목 등록/수정 모달 -->
<div class="modal-overlay" id="itemModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="itemTitle">품목 등록</h3>
			<button class="modal-close" onclick="closeItem()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>품목명</label>
				<input type="text" id="mName">
			</div>
			
			<div class="form-group">
				<label>카테고리</label>
				<select id="mCategory">
				</select>
			</div>
			
			<div class="form-group">
				<label>단위</label>
				<select id="mUnit">
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>부족 알림 기준</label>
				<input type="number" id="mMin" placeholder="이 수량 아래면 알림">
			</div>
			
			<div class="form-group">
				<label>초과 알림 기준</label>
				<input type="number" id="mMax" placeholder="이 수량 넘으면 알림">
			</div>
			
			<div class="form-group">
				<label>유통기한 일수</label>
				<input type="number" id="mShelf" placeholder="없으면 비워 두세요">
			</div>
		</section>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeItem()">취소</button>
			<button class="btn-primary" onclick="saveItem()">저장</button>
		</div>
	</div>
</div>

</body>



</html>

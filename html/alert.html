<!DOCTYPE html> <!-- 알림 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>알림</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--alert css -->
	<link rel="stylesheet" href="../css/alert.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a class="active" href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>

	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<!-- 위에 있는데 -->
		<section class="search-box">
				<div class="form-group expiration-group">
					<div class="date-range">
						<input type="date" id="fromDate" onchange="changeFilter()">
						<span>~</span>
						<input type="date" id="toDate" onchange="changeFilter()">
					</div>
				</div>
				
				<select class="category-select" id="typeSelect" onchange="changeFilter()">
					<option>전체</option>
					<option>재고부족</option>
					<option>재고초과</option>
					<option>이상출고</option>
					<option>예측알림</option>
					<option>창고정리추천</option>
				</select>
				
				<select class="category-select" id="stateSelect" onchange="changeFilter()">
					<option>미해결만</option>
					<option>전체</option>
				</select>

				<button class="btn-primary" onclick="doScanConsolidation()">창고 정리</button>
			</section>

		<!-- 알림창 -->
		<section class="alert-box">
				<div class="mini-box" id="card0" onclick="pickType('재고부족')">
					<label>재고 부족</label>
					<h2 id="cnt0">0</h2>
				</div>
				
				<div class="mini-box" id="card1" onclick="pickType('재고초과')">
					<label>재고 초과</label>
					<h2 id="cnt1">0</h2>
				</div>
				
				<div class="mini-box" id="card2" onclick="pickType('이상출고')">
					<label>이상 출고</label>
					<h2 id="cnt2">0</h2>
				</div>
				
				<div class="mini-box" id="card3" onclick="pickType('예측알림')">
					<label>소진 예측</label>
					<h2 id="cnt3">-</h2>
				</div>
			</section>
		
		<!-- 표  -->
		<div class="bulk-bar">
			<button class="btn-primary" onclick="doResolveChecked()">선택한 알림 해결 처리</button>
			<span id="checkCount" class="page-info"></span>
		</div>
		
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th><input type="checkbox" id="checkAll" onclick="toggleAll()"></th>
						<th>구분</th>
						<th>알림 제목</th> 
						<th>상세 내용</th> 
						<th>카테고리</th>
						<th>발생 일시</th>
						<th>상태</th>
						<th>조치</th>
					</tr>				
				</thead>
				
				<!-- 여러 건을 한 번에 해결 처리하는 줄 -->
				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="listArea">
					</tbody>
			</table>
		
				<!-- 쪽 번호 -->
				<div class="paging" id="paging"></div>
			</section>
		
	</main>
	
	</div>

<!-- 알림 상세보기 모달 -->
<div class="modal-overlay" id="detailModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="modalTitle">알림 상세보기</h3>
			<button class="modal-close" onclick="closeDetail()"> x </button>
		</div>
		
		<section class="alert-form">
			<div class="alert-form-group">
				<label>품목명</label>
				<span id="modalItem"></span>
			</div>
			
			<div class="alert-form-group">
				<label>분류</label>
				<span id="modalCategory"></span>
			</div>
			
			<div class="alert-form-group">
				<label>현재 재고</label>
				<span id="modalStock"></span>
			</div>
			
			<div class="alert-form-group">
				<label>최소 임계치</label>
				<span id="modalMin"></span>
			</div>
			
			<div class="alert-form-group full-width">
				<label>알림 내용</label>
				<div class="alert-message">
					<span id="modalMsg"></span>
				</div>
			</div>
			
			<div class="alert-form-group">
				<label>발생 일시</label>
				<span id="modalTime"></span>
			</div>
		
			<div class="alert-form-group">
				<label>상태</label>
				<span id="modalState"></span>
			</div>

			<!-- 알림 종류에 맞는 실제 조치 버튼이 openDetail()에서 여기 채워집니다.
			     (재고부족→승인 검토로 이동 / 재고초과→출고 승인요청 만들기 / 창고정리추천→이동 실행) -->
			<div class="alert-form-group full-width" id="actionArea"></div>

		</section>
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeDetail()">취소</button>
			<button class="btn-primary" id="resolveBtn" onclick="doResolve()">해결 처리</button>
		</div>
		
	</div>
</div>

<!-- ============================================================
     알림 센터 화면 로직
     ------------------------------------------------------------
     서버 연동 시 바꿀 곳
       loadData()  -> apiGet("/api/alerts?resolved=false", putAlerts)
       doResolve() -> apiSend("PATCH", "/api/alerts/" + 번호 + "/resolve", ...)
     ============================================================ -->
<script>

	/* ============================================================
	   알림 센터 - 서버 연동

	   서버가 주는 알림 정보 : alertId / itemId / alertType /
	                          message / isResolved / createdAt
	   품목명·카테고리·임계치는 알림에 안 들어 있어서
	   품목 목록을 따로 받아 번호로 이름을 찾아 씁니다.
	   ============================================================ */

	/* 알림 자료 */
	let alertIds = [];
	let alertItemIds = [];
	let types = [];
	let messages = [];
	let times = [];
	let resolved = [];

	/* 품목 정보 (품목번호로 찾아 쓰려고 따로 보관) */
	let myItemIds = [];
	let myItemNames = [];
	let myItemCategories = [];
	let myItemMins = [];
	let myItemUnits = [];

	/* 화면 상태 */
	let nowType = "전체";
	let onlyNo = true;
	let nowPage = 1;
	let openIndex = -1;


	/* ============================================================
	   1. 품목 정보 먼저 받아오기

	   품목이 250개라 서버가 한 번에 200개까지만 주기 때문에
	   두 번 나눠서 받습니다.
	   ============================================================ */
	function loadItems() {
		apiGet("/api/items?page=1&size=200", putItems1);
	}

	function putItems1(data) {

		myItemIds = [];
		myItemNames = [];
		myItemCategories = [];
		myItemMins = [];
		myItemUnits = [];

		addItems(data.items);

		/* 아직 덜 받았으면 다음 쪽도 받아옵니다 */
		if (data.total > 200) {
			apiGet("/api/items?page=2&size=200", putItems2);
		} else {
			loadData();
		}
	}

	function putItems2(data) {
		addItems(data.items);
		loadData();
	}

	function addItems(list) {

		for (let i = 0; i < list.length; i++) {
			let last = myItemIds.length;
			myItemIds[last] = list[i].itemId;
			myItemNames[last] = list[i].itemName;
			myItemCategories[last] = list[i].category;
			myItemMins[last] = list[i].thresholdMin;
			myItemUnits[last] = list[i].unit;
		}
	}


	/* 품목번호로 몇 번째 품목인지 찾습니다. 없으면 -1 */
	function findItem(itemId) {

		for (let i = 0; i < myItemIds.length; i++) {
			if (myItemIds[i] == itemId) {
				return i;
			}
		}
		return -1;
	}


	/* ============================================================
	   2. 알림 목록 받아오기  (GET /api/alerts)

	   서버는 resolved(해결여부)로만 걸러줍니다.
	   종류·기간 거르기는 서버에 없는 기능이라 화면에서 처리하고,
	   그래서 한 번에 넉넉히 받아옵니다.
	   ============================================================ */
	function loadData() {

		let path = "/api/alerts?page=1&size=200";

		if (onlyNo == true) {
			path = path + "&resolved=false";
		}

		apiGet(path, putAlerts);
	}


	function putAlerts(data) {

		let list = data.items;

		alertIds = [];
		alertItemIds = [];
		types = [];
		messages = [];
		times = [];
		resolved = [];

		for (let i = 0; i < list.length; i++) {

			alertIds[i] = list[i].alertId;
			alertItemIds[i] = list[i].itemId;
			types[i] = list[i].alertType;
			messages[i] = list[i].message;
			resolved[i] = list[i].isResolved;

			/* 서버가 주는 시각은 "2026-08-11T09:40:00" 모양이라
			   가운데 T 를 빈칸으로 바꾸고 초는 잘라냅니다 */
			let t = list[i].createdAt;

			if (t == null) {
				t = "";
			} else {
				t = t.replace("T", " ");
				if (t.length > 16) {
					t = t.substring(0, 16);
				}
			}
			times[i] = t;
		}

		drawCards();
		drawList();
	}


	/* 지금 조건에 맞는 알림 번호들을 골라냅니다 */
	function getList() {

		let from = document.querySelector("#fromDate").value;
		let to = document.querySelector("#toDate").value;
		let result = [];

		for (let i = 0; i < alertIds.length; i++) {

			if (onlyNo == true && resolved[i] == true) {
				continue;
			}

			if (nowType != "전체" && types[i] != nowType) {
				continue;
			}

			/* times[i] 는 "2026-08-11 09:40" 이라 앞 10글자가 날짜입니다 */
			let day = times[i].substring(0, 10);

			if (from != "" && day < from) {
				continue;
			}
			if (to != "" && day > to) {
				continue;
			}

			result[result.length] = i;
		}

		return result;
	}


	/* 위쪽 요약 카드 (미해결 건수만 셉니다) */
	function drawCards() {

		let cnt = [0, 0, 0];
		let names = ["재고부족", "재고초과", "이상출고", "예측알림"];

		for (let i = 0; i < alertIds.length; i++) {
			if (resolved[i] == true) {
				continue;
			}
			for (let k = 0; k < 3; k++) {
				if (types[i] == names[k]) {
					cnt[k] = cnt[k] + 1;
				}
			}
		}

		document.querySelector("#cnt0").innerHTML = cnt[0];
		document.querySelector("#cnt1").innerHTML = cnt[1];
		document.querySelector("#cnt2").innerHTML = cnt[2];
		/* 예측알림은 서버에서 아직 만들지 않아 "-" 로 둡니다 */

		for (let i = 0; i < 4; i++) {
			if (names[i] == nowType) {
				document.querySelector("#card" + i).className = "mini-box active";
			} else {
				document.querySelector("#card" + i).className = "mini-box";
			}
		}
	}


	function drawList() {

		let all = getList();
		let list = cutPage(all, nowPage);
		let html = "";

		if (all.length == 0) {
			document.querySelector("#listArea").innerHTML = "<tr><td colspan='8'>조건에 맞는 알림이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];
			let k = findItem(alertItemIds[i]);

			let name = "품목 " + alertItemIds[i];
			let category = "-";

			if (k != -1) {
				name = myItemNames[k];
				category = myItemCategories[k];
				if (category == null) {
					category = "-";
				}
			}

			let stateText = "미해결";
			if (resolved[i] == true) {
				stateText = "해결됨";
			}

			/* 이미 해결된 건은 고를 수 없게 합니다 */
			let checkBox = "-";

			if (resolved[i] == false) {
				checkBox = "<input type='checkbox' class='row-check' value='" + i + "' onclick='countChecked()'>";
			}

			html = html + "<tr>";
			html = html + "<td>" + checkBox + "</td>";
			html = html + "<td>" + types[i] + "</td>";
			html = html + "<td>" + name + " " + types[i] + "</td>";
			html = html + "<td>" + plainText(messages[i]) + "</td>";
			html = html + "<td>" + category + "</td>";
			html = html + "<td>" + times[i] + "</td>";
			html = html + "<td>" + stateText + "</td>";
			html = html + "<td><button class='edit-btn' onclick='openDetail(" + i + ")'>상세보기</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#listArea").innerHTML = html;
		drawPaging("#paging", all.length, nowPage, "goPage");

		/* 표를 새로 그렸으니 전체선택 표시도 풀어 줍니다 */
		document.querySelector("#checkAll").checked = false;
		countChecked();
	}


	function goPage(p) {
		nowPage = p;
		drawList();
	}


	/* 위쪽 요약 카드를 눌렀을 때 (같은 걸 또 누르면 전체로) */
	function pickType(type) {

		if (nowType == type) {
			nowType = "전체";
		} else {
			nowType = type;
		}

		document.querySelector("#typeSelect").value = nowType;
		nowPage = 1;
		drawCards();
		drawList();
	}


	/* 드롭다운이나 날짜를 바꿨을 때 */
	function changeFilter() {

		nowType = document.querySelector("#typeSelect").value;
		nowPage = 1;

		let before = onlyNo;

		if (document.querySelector("#stateSelect").value == "미해결만") {
			onlyNo = true;
		} else {
			onlyNo = false;
		}

		/* 해결여부는 서버가 걸러주는 조건이라 바뀌면 다시 받아옵니다 */
		if (before != onlyNo) {
			loadData();
			return;
		}

		drawCards();
		drawList();
	}


	/* ============================================================
	   3. 상세보기
	   ============================================================ */
	function openDetail(i) {

		openIndex = i;

		let k = findItem(alertItemIds[i]);
		let name = "품목 " + alertItemIds[i];
		let category = "-";
		let min = "-";

		if (k != -1) {
			name = myItemNames[k];
			if (myItemCategories[k] != null) {
				category = myItemCategories[k];
			}
			if (myItemMins[k] != null) {
				min = myItemMins[k] + " " + myItemUnits[k];
			}
		}

		document.querySelector("#modalTitle").innerHTML = "[" + types[i] + "] 알림 상세";
		document.querySelector("#modalItem").innerHTML = name;
		document.querySelector("#modalCategory").innerHTML = category;
		document.querySelector("#modalMin").innerHTML = min;
		document.querySelector("#modalTime").innerHTML = times[i];
		document.querySelector("#modalMsg").innerHTML = plainText(messages[i]);

		/* 현재 재고는 알림에 없는 값이라 재고 목록에서 따로 받아 더합니다 */
		document.querySelector("#modalStock").innerHTML = "불러오는 중...";
		apiGet("/api/stock-lots?itemId=" + alertItemIds[i] + "&size=200", putStock);

		if (resolved[i] == true) {
			document.querySelector("#modalState").innerHTML = "해결됨";
			document.querySelector("#resolveBtn").innerHTML = "이미 해결됨";
			document.querySelector("#resolveBtn").disabled = true;
		} else {
			document.querySelector("#modalState").innerHTML = "미해결";
			document.querySelector("#resolveBtn").innerHTML = "해결 처리";
			document.querySelector("#resolveBtn").disabled = false;
		}

		/* 알림 종류마다 실제로 해야 할 조치가 달라서, 그에 맞는 버튼을 여기서 채웁니다.
		   (재고부족/재고초과/창고정리추천은 "해결 처리" 버튼을 숨기고 실제 조치 버튼으로 대신합니다 -
		    문제가 실제로 풀려야(승인 실행/이동 실행) 알림이 없어지게 하려는 것입니다) */
		drawActionArea(i);

		openModal("#detailModal");
	}


	/* ============================================================
	   6. 알림 종류별 실제 조치
	   ------------------------------------------------------------
	   버튼을 따로 두지 않고, "해결 처리" 버튼 자체가 그 알림에 맞는
	   진짜 조치를 하도록 라벨과 동작을 종류마다 바꿔치기합니다.
	   (버튼이 두 개면 헷갈리고, 하나만 누르고 다른 하나를 안 눌러서
	    조치 없이 알림만 꺼지는 일이 생길 수 있어서 하나로 합쳤습니다)

	   재고부족   : 이미 자동으로 만들어진 "발주 승인요청"이 있으므로 승인 관리 화면으로 이동
	   재고초과   : 거래처/수량을 고르면, 그 값으로 출고 승인요청을 생성
	   이상출고   : 사람이 보고 판단만 하면 되므로 그대로 "해결 처리"(원래 동작)
	   창고정리추천 : 알림 메시지 안의 구역/수량을 읽어서, 그 이동을 바로 실행
	   ============================================================ */
	function drawActionArea(i) {

		let area = document.querySelector("#actionArea");
		let type = types[i];
		let already = resolved[i];
		let btn = document.querySelector("#resolveBtn");

		/* 이전에 열어본 다른 알림의 조치 화면(폼 등)이 남아있지 않게 매번 비우고 시작합니다 */
		area.innerHTML = "";

		if (already == true) {
			return;
		}

		if (type == "재고부족") {
			area.innerHTML =
				"<p class='list-note'>이 알림이 뜨는 순간 시스템이 자동으로 <b>발주 승인요청</b>을 만들어 뒀습니다. " +
				"아래 버튼을 누르면 승인 관리 화면으로 이동합니다. 거기서 승인하면 그 즉시 입고 처리까지 자동으로 됩니다.</p>";

			btn.innerHTML = "승인 관리로 이동";
			btn.onclick = function () { location.href = "approval.html"; };
			return;
		}

		if (type == "재고초과") {
			area.innerHTML =
				"<p class='list-note'>초과된 만큼 어느 거래처로 출고할지 고르고 아래 버튼을 누르면 " +
				"출고 승인요청이 만들어집니다. 관리자가 승인하면 그 즉시 출고 처리까지 자동으로 됩니다.</p>" +
				"<div class='form-group'><label>거래처</label><select id='excessPartner'></select></div>" +
				"<div class='form-group'><label>출고 수량</label><input type='number' id='excessQty'></div>";

			fillPartner("#excessPartner", "CUSTOMER");

			btn.innerHTML = "출고 승인요청 만들기";
			btn.onclick = doCreateOutboundApproval;
			return;
		}

		if (type == "창고정리추천") {
			let move = parseConsolidationMessage(messages[i]);

			if (move == null) {
				area.innerHTML = "<p class='list-note'>이동할 구역 정보를 읽지 못했습니다. 창고 간 재고 이동 화면에서 직접 처리해 주세요.</p>";
				btn.innerHTML = "해결 처리";
				btn.onclick = doResolve;
				return;
			}

			area.innerHTML =
				"<p class='list-note'>" + zoneLabel(move.fromZoneId) + " → " + zoneLabel(move.toZoneId) +
				"로 " + addComma(move.quantity) + "개를 지금 바로 옮깁니다.</p>";

			btn.innerHTML = "지금 이 이동 실행하기";
			btn.onclick = function () { doExecuteConsolidation(i); };
			return;
		}

		/* 이상출고 등 나머지는 원래대로 "해결 처리"만 씁니다 */
		btn.innerHTML = "해결 처리";
		btn.onclick = doResolve;
	}


	/* ============================================================
	   7. 조치에 필요한 거래처/창고/구역 정보 받아오기

	   품목 목록과는 별도로, 여기서만 쓰는 정보라 따로 받습니다.
	   fillPartner()/zoneLabel()은 common.js가 쓰는 것과 같은
	   전역 배열(customerIds, warehouseIds, zoneIds 등)을 그대로 채웁니다.
	   ============================================================ */
	function loadExtras() {
		apiGet("/api/partners?type=CUSTOMER&size=200", putCustomersForAlert);
	}

	function putCustomersForAlert(data) {
		customerIds = [];
		customerNames = [];
		for (let i = 0; i < data.items.length; i++) {
			customerIds[i] = data.items[i].partnerId;
			customerNames[i] = data.items[i].name;
		}
		apiGet("/api/warehouses?size=200", putWarehousesForAlert);
	}

	function putWarehousesForAlert(data) {
		warehouseIds = [];
		warehouseNames = [];
		for (let i = 0; i < data.items.length; i++) {
			warehouseIds[i] = data.items[i].warehouseId;
			warehouseNames[i] = data.items[i].name + "(" + data.items[i].location + ")";
		}
		apiGet("/api/zones?size=200", putZonesForAlert);
	}

	function putZonesForAlert(data) {
		zoneIds = [];
		zoneWarehouseIds = [];
		zoneNames = [];
		for (let i = 0; i < data.items.length; i++) {
			zoneIds[i] = data.items[i].zoneId;
			zoneWarehouseIds[i] = data.items[i].warehouseId;
			zoneNames[i] = data.items[i].zoneName;
		}
	}

	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 (item.html의 findZoneName과 같은 방식) */
	function zoneLabel(zoneId) {
		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {
				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}

	/* 창고정리추천 알림 메시지 안의 "zoneId=3(수량 12, 점유율 40%)를 zoneId=7로" 부분을 읽어냅니다.
	   WarehouseConsolidationService가 만드는 메시지 형식이 고정돼 있어서 이 방식이 안전합니다. */
	function parseConsolidationMessage(msg) {
		if (msg == null) {
			return null;
		}
		let m = msg.match(/zoneId=(\d+)\(수량 (\d+), 점유율 \d+%\)를 zoneId=(\d+)로/);
		if (m == null) {
			return null;
		}
		return { fromZoneId: m[1] * 1, quantity: m[2] * 1, toZoneId: m[3] * 1 };
	}


	/* ============================================================
	   7-1. 창고 정리 지금 다시 찾아보기 (POST /api/warehouse-consolidation/scan)

	   원래 창고정리추천은 서버 켤 때 한 번만 찾아보는데, 그새 재고가 바뀌었으면
	   지금 다시 찾아보고 싶을 때 누르는 버튼입니다. 같은 품목에 처리 안 된
	   추천이 이미 있으면 서버가 또 안 만들어서 여러 번 눌러도 안전합니다.
	   ============================================================ */
	function doScanConsolidation() {
		apiSend("POST", "/api/warehouse-consolidation/scan", null, afterScanConsolidation);
	}

	function afterScanConsolidation(data) {
		loadData();
		if (data.createdCount == 0) {
			alert("지금 합칠 수 있는 재고가 없습니다.");
		} else {
			alert("창고 정리 추천 " + data.createdCount + "건을 새로 찾았습니다.");
		}
	}


	/* ============================================================
	   8. 재고초과 - 출고 승인요청 만들기 (POST /api/approvals)

	   여기서 바로 출고를 실행하지 않고 "승인요청"만 만듭니다.
	   관리자가 승인 관리 화면에서 승인해야 실제 출고가 자동 실행됩니다
	   (거래처/수량이 맞는지 한 번 더 확인하는 절차입니다).
	   ============================================================ */
	function doCreateOutboundApproval() {

		let i = openIndex;
		let partnerId = document.querySelector("#excessPartner").value;
		let qty = document.querySelector("#excessQty").value;

		if (partnerId == "" || qty == "" || qty * 1 <= 0) {
			alert("거래처와 수량을 채워 주세요.");
			return;
		}

		let body = {
			itemId: alertItemIds[i],
			requestType: "출고",
			requestedQty: qty * 1,
			partnerId: partnerId * 1
		};

		apiSend("POST", "/api/approvals", body, afterCreateApproval);
	}

	function afterCreateApproval(data) {
		closeDetail();
		loadData();
		alert("출고 승인요청을 만들었습니다. 승인 관리 화면에서 승인하면 자동으로 출고 처리됩니다.");
	}


	/* ============================================================
	   9. 창고정리추천 - 이동 실행 (POST /api/transfers)

	   추천 구역에 이 품목 로트가 여러 개 나뉘어 있을 수 있어서,
	   필요한 수량을 채울 때까지 로트를 하나씩 순서대로 옮깁니다
	   (5번의 "한 건씩 순서대로 보내기"와 같은 방식).
	   다 옮기고 나면 알림도 같이 해결 처리합니다.
	   ============================================================ */
	let moveLotIds = [];
	let moveLotQtys = [];
	let moveIndex = 0;
	let moveFromZoneId = null;
	let moveToZoneId = null;
	let moveAlertId = null;

	function doExecuteConsolidation(i) {

		let move = parseConsolidationMessage(messages[i]);
		if (move == null) {
			return;
		}

		let ask = zoneLabel(move.fromZoneId) + " → " + zoneLabel(move.toZoneId) + "로 "
		        + addComma(move.quantity) + "개를 지금 옮길까요?";

		if (confirm(ask) == false) {
			return;
		}

		moveFromZoneId = move.fromZoneId;
		moveToZoneId = move.toZoneId;
		moveAlertId = alertIds[i];

		apiGet("/api/stock-lots?itemId=" + alertItemIds[i] + "&zoneId=" + move.fromZoneId
		     + "&status=NORMAL&size=200", putMoveLots);
	}

	function putMoveLots(data) {

		moveLotIds = [];
		moveLotQtys = [];

		for (let k = 0; k < data.items.length; k++) {

			/* 남은 수량이 없는 로트는 옮길 게 없으니 건너뜁니다 */
			if (data.items[k].quantity <= 0) {
				continue;
			}

			moveLotIds[moveLotIds.length] = data.items[k].lotId;
			moveLotQtys[moveLotQtys.length] = data.items[k].quantity;
		}

		/* 그 사이 재고가 이미 다 빠졌으면 옮길 것 없이 알림만 정리합니다 */
		if (moveLotIds.length == 0) {
			finishConsolidation();
			return;
		}

		moveIndex = 0;
		sendOneMove();
	}

	/* 그 구역에 있는 이 품목 로트를 전부(각 로트의 지금 수량 그대로) 목적지로 옮깁니다.
	   알림에 적힌 추천 수량이 아니라 "지금 실제로 그 구역에 있는 만큼"을 기준으로 삼아야
	   구역이 완전히 비워집니다 - 추천 당시보다 수량이 늘어나 있어도 다 옮겨야 정리가 끝납니다. */
	function sendOneMove() {

		/* 로트를 다 처리했으면 마무리합니다 */
		if (moveIndex >= moveLotIds.length) {
			finishConsolidation();
			return;
		}

		let body = {
			lotId: moveLotIds[moveIndex],
			fromZoneId: moveFromZoneId,
			toZoneId: moveToZoneId,
			quantity: moveLotQtys[moveIndex],
			handlerId: sessionStorage.getItem("userId") * 1
		};

		apiSend("POST", "/api/transfers", body, afterOneMove, failOneMove);
	}

	function afterOneMove(data) {
		moveIndex = moveIndex + 1;
		sendOneMove();
	}

	/* 한 로트가 실패해도(예: 그 사이 구역이 꽉 참) 나머지는 계속 옮겨 봅니다 */
	function failOneMove(message) {
		alert("일부는 옮기지 못했습니다: " + message + "\n나머지는 창고 간 재고 이동 화면에서 직접 처리해 주세요.");
		moveIndex = moveIndex + 1;
		sendOneMove();
	}

	function finishConsolidation() {
		apiSend("PATCH", "/api/alerts/" + moveAlertId + "/resolve", null, afterConsolidationResolve);
	}

	function afterConsolidationResolve(data) {
		closeDetail();
		loadData();
		alert("창고 정리 이동을 완료했습니다.");
	}


	/* 로트마다 남은 수량이 따로 있어서 다 더해야 현재 재고가 나옵니다 */
	function putStock(data) {

		let list = data.items;
		let total = 0;

		for (let i = 0; i < list.length; i++) {
			total = total + list[i].quantity;
		}

		let unit = "";
		let k = findItem(alertItemIds[openIndex]);

		if (k != -1) {
			unit = " " + myItemUnits[k];
		}

		document.querySelector("#modalStock").innerHTML = total + unit;
	}


	function closeDetail() {
		closeModal("#detailModal");
		openIndex = -1;
	}


	/* ============================================================
	   4. 해결 처리  (PATCH /api/alerts/{id}/resolve)
	   ============================================================ */
	function doResolve() {

		if (openIndex == -1) {
			return;
		}

		apiSend("PATCH", "/api/alerts/" + alertIds[openIndex] + "/resolve", null, afterResolve);
	}


	function afterResolve(data) {
		closeDetail();
		loadData();
		alert("해결 처리 하였습니다.");
	}


	/* ============================================================
	   5. 여러 건 한 번에 해결 처리

	   서버에는 "한 건씩 해결" 만 있어서(PATCH /api/alerts/{id}/resolve),
	   고른 건들을 하나씩 순서대로 보냅니다.
	   한 건이 끝나면 다음 건을 보내는 방식입니다.
	   ============================================================ */

	/* 지금 고른 알림 번호들 */
	let checkedList = [];
	let checkIndex = 0;
	let checkDone = 0;


	/* 맨 위 체크박스를 누르면 화면에 보이는 것을 전부 고릅니다 */
	function toggleAll() {

		let on = document.querySelector("#checkAll").checked;
		let boxes = document.querySelectorAll(".row-check");

		for (let i = 0; i < boxes.length; i++) {
			boxes[i].checked = on;
		}

		countChecked();
	}


	/* 몇 개를 골랐는지 세어서 알려 줍니다 */
	function countChecked() {

		let boxes = document.querySelectorAll(".row-check");
		let count = 0;

		for (let i = 0; i < boxes.length; i++) {
			if (boxes[i].checked == true) {
				count = count + 1;
			}
		}

		let area = document.querySelector("#checkCount");

		if (area != null) {
			if (count == 0) {
				area.innerHTML = "해결할 알림을 고르세요";
			} else {
				area.innerHTML = count + "건 선택됨";
			}
		}
	}


	/* 선택한 알림들을 한 번에 해결 처리합니다 */
	function doResolveChecked() {

		let boxes = document.querySelectorAll(".row-check");

		checkedList = [];

		for (let i = 0; i < boxes.length; i++) {
			if (boxes[i].checked == true) {
				checkedList[checkedList.length] = boxes[i].value * 1;
			}
		}

		if (checkedList.length == 0) {
			alert("해결 처리할 알림을 골라 주세요.");
			return;
		}

		if (confirm("고른 알림 " + checkedList.length + "건을 해결 처리할까요?") == false) {
			return;
		}

		checkIndex = 0;
		checkDone = 0;
		sendOneResolve();
	}


	function sendOneResolve() {

		/* 다 보냈으면 마무리합니다 */
		if (checkIndex >= checkedList.length) {
			loadData();
			alert("알림 " + checkDone + "건을 해결 처리했습니다.");
			return;
		}

		let i = checkedList[checkIndex];

		apiSend("PATCH", "/api/alerts/" + alertIds[i] + "/resolve", null, afterOneResolve, failOneResolve);
	}


	function afterOneResolve(data) {
		checkDone = checkDone + 1;
		checkIndex = checkIndex + 1;
		sendOneResolve();
	}


	/* 한 건이 실패해도 나머지는 계속 보냅니다 */
	function failOneResolve(message) {
		checkIndex = checkIndex + 1;
		sendOneResolve();
	}


	/* 화면이 열릴 때 실행 - 품목을 먼저 받고, 끝나면 알림을 받습니다 */
	loadItems();

	/* 조치(승인요청 만들기/이동 실행)에 필요한 거래처·창고·구역 정보도 같이 받아 둡니다 */
	loadExtras();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   10. 새 알림 자동으로 받아오기

	   이 화면을 열어 둔 사이에 다른 곳에서 입고/출고가 일어나 새 알림이
	   떠도, 새로고침을 안 누르면 안 보였습니다. 그래서 30초마다 목록을
	   다시 받아옵니다. 상세보기 창을 보고 있는 중에는 그 내용이 갑자기
	   바뀌면 안 되니 그동안은 건너뜁니다.
	   ============================================================ */
	setInterval(function () {
		let modal = document.querySelector("#detailModal");
		if (modal.className.indexOf("active") == -1) {
			loadData();
		}
	}, 30000);

</script>

</body>
</html>

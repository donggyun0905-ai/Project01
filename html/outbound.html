<!DOCTYPE html> <!-- 08.12 출고 등록 -->
<!-- FIFO/FEFO 모달이 추가되었습니다 모달을 보려면 outbound.css에서 210번줄을 찾아가세요 -->
<!-- 모달 2개 있는데 지금은 첫번째 페이지만 뜹니다 2번째 보려면 맨 밑으로 가서 주석 해제하시면 2번째 페이지가 뜹니다 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>출고 등록</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/outbound.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">

				<a href="dashboard.html">메인 화면</a>

				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button> 
			<button class="menu-btn active" onclick="location.href='inout.html'">입출고 등록</button> <!--현재 화면이 출고 등록이라서 -->
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<h4 class= "page-title">출고 등록</h4>
		
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>출고일</label>
				<input type="date" id="outDate">
			</div>
			
			<div class="form-group">
				<label>카테고리</label>
				<select id="outCategory">
				</select>
			</div>
			
			<div class="form-group">
				<label>품목명 (치면 후보가 뜹니다)</label>
				<input type="text" id="outName" list="itemList" onchange="changeItem()" onkeyup="changeItem()" placeholder="예: 두부">
				<datalist id="itemList"></datalist>
			</div>
			
			<div class="form-group">
				<label>품목 코드</label>
				<input type="text" id="outCode" readonly placeholder="품목을 고르면 채워집니다">
			</div>
			
			<div class="form-group">
				<label>수량</label>
				<input type="number" id="outQty">
			</div>
			
			<div class="form-group">
				<label>단위</label>
				<select id="outUnit">
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
		
			<div class="form-group">
				<label>창고</label>
				<select id="outWarehouse" onchange="changeWarehouse()">
				</select>
			</div>
			
			<div class="form-group">
				<label>구역</label>
				<select id="outZone">
				</select>
			</div>
			
			<div class="form-group">
				<label>목적지</label>
				<select id="outPartner">
				</select>
			</div>
			
			<!-- 누르면 FIFO/FEFO 추천 모달이 뜹니다 -->
			<button class="register-btn" onclick="openRecommend()">자동 추천 및 확인</button>
		</section>
		
		<!-- 출고 입력(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">출고 이력</h4>
			<div id="listNote" class="list-note"></div>
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>출고 일자</th>
						<th>품목 코드</th>
						<th>로트 번호</th>
						<th>품목명</th>
						<th>수량</th>
						<th>단위</th>
						<th>구역</th>
						<th>목적지</th> <!-- 거래처랑 같습니다  -->
						<th>삭제</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="outBody">
				</tbody>
			</table>
		
			<!-- 쪽 번호 (명세서 S-04) -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>

<!-- FIFO/FEFO 추천 (모달) 페이지 -->
<div class="modal-overlay" id="recommendModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>출고 방식 자동 추천</h3>
			<button class="modal-close" onclick="closeAll()"> x </button>
		</div>
		<div class="modal-content">
			<h4>출고 방식 자동 추천 완료</h4>
			<p id="recommendText"></p>
			<div class="recommend-box">
				<span>추천 방식</span>
				<strong id="recommendWay"></strong>
			</div>
		</div>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeAll()">취소</button>
			<button class="btn-primary" onclick="openLot()">다음</button>
		</div>
	</div>
</div>

<!-- FIFO/FEFO 모달 2단계 -->
<div class="modal-overlay" id="lotModal">
	<div class="modal-box lot-modal">
	
		<div class="modal-header">
			<h3>출고 LOT 자동 선택 결과</h3>
			<button class="modal-close" onclick="closeAll()"> x </button>
		</div>
		
		<div class="modal-content">
			아래 로트에서 출고 수량이 차감됩니다.<br>
			<strong id="lotTotalText"></strong>
		</div>
		<table>
			<thead>
				<tr>
					<th>순서</th>
					<th>로트번호</th>
					<th>입고일</th>
					<th>유통기한</th>
					<th>출고 수량</th>
				</tr>
			</thead>
		<tbody id="lotBody">
		</tbody>
		</table>
		<div class="policy-info"><strong id="lotWayText"></strong></div>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeAll()">취소</button>
			<button class="btn-primary" onclick="doRegister()">출고 등록</button>
		</div>
	</div>
</div>


<!-- ============================================================
     출고 등록 화면 로직
     ------------------------------------------------------------
     흐름 : 입력 -> [자동 추천 및 확인] -> 모달1(FIFO/FEFO 판정)
            -> [다음] -> 모달2(어느 로트에서 뺄지) -> [출고 등록] -> 표에 추가

     드롭다운 값과 공통 함수는 common.js 에 있습니다.
     ============================================================ -->
<script>

	/* ============================================================
	   출고 등록 - 서버 연동

	   흐름
	     입력 → [자동 추천 및 확인]
	          → 서버에 어느 로트에서 뺄지 물어봄 (GET /api/outbound/recommend)
	          → 모달1(FIFO/FEFO 안내) → [다음] → 모달2(로트 목록)
	          → [출고 등록] → 로트마다 POST /api/outbound

	   출고는 로트 단위로 처리해서, 한 번 요청에 여러 건이 나갈 수 있습니다.
	   ============================================================ */

	/* 서버가 추천해 준 로트 */
	let pickedWay = "";
	let pickedLotIds = [];
	let pickedLotIn = [];
	let pickedLotExp = [];
	let pickedLotQtys = [];   // 그 로트에서 뺄 수량

	/* 출고 이력 표 (이번에 등록한 것만 쌓입니다) */
	let rowDates = [];
	let rowItemIds = [];
	let rowLotIds = [];
	let rowNames = [];
	let rowQtys = [];
	let rowUnits = [];
	let rowZones = [];
	let rowPartners = [];

	/* 여러 건을 순서대로 보낼 때 쓰는 값 */
	let sendIndex = 0;
	let doneCount = 0;
	let alertCount = 0;
	let approvalCount = 0;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillCategory("#outCategory");
		fillPartner("#outPartner", "CUSTOMER");   // 출고는 거래처(고객)만
		fillWarehouse("#outWarehouse");
		fillZone("#outWarehouse", "#outZone");
		fillItemList("#itemList");

		document.querySelector("#outDate").value = getToday();

		drawList();
	}


	/* 품목명을 고르면 코드·단위·카테고리가 채워지고 구역도 맞춰집니다 */
	function changeItem() {

		let i = findItemByName(document.querySelector("#outName").value);

		if (i == -1) {
			document.querySelector("#outCode").value = "";
			return;
		}

		document.querySelector("#outCode").value = itemCodes[i];
		document.querySelector("#outUnit").value = itemUnitList[i];

		if (itemCategoryList[i] != null) {
			document.querySelector("#outCategory").value = itemCategoryList[i];
		}

		pickSameZone(itemUnitList[i]);
	}


	function changeWarehouse() {
		fillZone("#outWarehouse", "#outZone");
		pickSameZone(document.querySelector("#outUnit").value);
	}


	function pickSameZone(unit) {

		let box = document.querySelector("#outZone");

		for (let i = 0; i < box.options.length; i++) {
			if (box.options[i].text == unit) {
				box.selectedIndex = i;
				return;
			}
		}
	}


	/* ============================================================
	   모달 1 - 서버에 추천을 물어봅니다
	   ============================================================ */
	function openRecommend() {

		if (isBlank(["#outDate", "#outName", "#outQty"]) == true) {
			alert("출고일, 품목명, 수량을 채워 주세요.");
			return;
		}

		let itemId = getItemId(document.querySelector("#outName").value);

		if (itemId == -1) {
			alert("등록되지 않은 품목입니다.\n후보 목록에서 골라 주세요.");
			return;
		}

		let qty = document.querySelector("#outQty").value * 1;

		if (qty <= 0) {
			alert("수량은 1개 이상이어야 합니다.");
			return;
		}

		/* 유통기한이 있는 품목이면 FEFO, 없으면 FIFO 로 물어봅니다 */
		let i = findItemByName(document.querySelector("#outName").value);
		let sortBy = "fefo";

		if (i != -1 && itemShelfEmpty(i) == true) {
			sortBy = "fifo";
		}

		apiGet("/api/outbound/recommend?itemId=" + itemId + "&quantity=" + qty + "&sortBy=" + sortBy, putRecommend);
	}


	/* 그 품목이 유통기한을 관리하지 않는 품목인지 확인합니다.
	   ITEM.shelf_life_days 가 비어 있으면 유통기한 없는 품목입니다. */
	function itemShelfEmpty(i) {

		if (itemShelfList[i] == null) {
			return true;
		}
		return false;
	}


	/* 서버가 준 추천 결과를 받아 모달을 엽니다 */
	function putRecommend(data) {

		pickedWay = data.sortBy.toUpperCase();
		pickedLotIds = [];
		pickedLotIn = [];
		pickedLotExp = [];
		pickedLotQtys = [];

		/* 서버는 후보 로트를 통째로 주기 때문에
		   각 로트에서 얼마씩 뺄지는 여기서 계산합니다. */
		let rest = data.requestedQuantity;

		for (let i = 0; i < data.lots.length; i++) {

			if (rest <= 0) {
				break;
			}

			let take = data.lots[i].quantity;

			if (take > rest) {
				take = rest;
			}

			pickedLotIds[pickedLotIds.length] = data.lots[i].lotId;
			pickedLotIn[pickedLotIn.length] = data.lots[i].inboundDate;

			if (data.lots[i].expiryDate == null) {
				pickedLotExp[pickedLotExp.length] = "";
			} else {
				pickedLotExp[pickedLotExp.length] = data.lots[i].expiryDate;
			}

			pickedLotQtys[pickedLotQtys.length] = take;
			rest = rest - take;
		}

		/* 재고가 모자라면 서버가 sufficient=false 로 알려 줍니다 */
		if (data.sufficient == false) {

			let have = 0;

			for (let i = 0; i < pickedLotQtys.length; i++) {
				have = have + pickedLotQtys[i];
			}

			alert("재고가 부족합니다.\n요청 " + data.requestedQuantity + "개 중 " + have + "개만 출고할 수 있습니다.");
			return;
		}

		let text = "";

		if (pickedWay == "FEFO") {
			text = "해당 품목은 유통기한 관리 대상입니다.<br>따라서 <strong>FEFO(유통기한 기준)</strong> 방식이 자동 추천되었습니다.";
			document.querySelector("#recommendWay").innerHTML = "FEFO(선유통기한선출)";
		} else {
			text = "해당 품목은 유통기한 관리 대상이 아닙니다.<br>따라서 <strong>FIFO(입고일 기준)</strong> 방식이 자동 추천되었습니다.";
			document.querySelector("#recommendWay").innerHTML = "FIFO(선입선출)";
		}

		document.querySelector("#recommendText").innerHTML = text;
		openModal("#recommendModal");
	}


	/* ============================================================
	   모달 2 - 어느 로트에서 얼마씩 뺄지
	   ============================================================ */
	function openLot() {

		let html = "";
		let total = 0;
		let nearCount = 0;

		for (let i = 0; i < pickedLotIds.length; i++) {

			let expiry = pickedLotExp[i];
			let cell = "-";

			if (expiry != "") {

				/* 유통기한이 7일 이내면 눈에 띄게 표시합니다 (명세서 F-05) */
				if (isNearExpiry(expiry) == true) {

					let left = getLeftDays(expiry);
					let word = "D-" + left;

					if (left < 0) {
						word = "기한 지남";
					}

					cell = "<span class='near-expiry'>" + expiry + " (" + word + ")</span>";
					nearCount = nearCount + 1;

				} else {
					cell = expiry;
				}
			}

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>LOT-" + pickedLotIds[i] + "</td>";
			html = html + "<td>" + pickedLotIn[i] + "</td>";
			html = html + "<td>" + cell + "</td>";
			html = html + "<td>" + pickedLotQtys[i] + "</td>";
			html = html + "</tr>";

			total = total + pickedLotQtys[i];
		}

		document.querySelector("#lotBody").innerHTML = html;
		document.querySelector("#lotTotalText").innerHTML = "총 출고 수량: " + total + " " + document.querySelector("#outUnit").value;

		let wayText = "추천 방식: " + pickedWay;

		if (nearCount > 0) {
			wayText = wayText + " / 유통기한 임박 로트 " + nearCount + "건이 포함되어 있습니다";
		}

		document.querySelector("#lotWayText").innerHTML = wayText;

		closeModal("#recommendModal");
		openModal("#lotModal");
	}


	/* ============================================================
	   출고 등록  (POST /api/outbound)

	   로트가 여러 개면 서버에 여러 번 나눠 보내야 합니다.
	   한 건이 끝나면 다음 건을 보내는 방식으로 순서대로 처리합니다.
	   ============================================================ */
	function doRegister() {

		sendIndex = 0;
		doneCount = 0;
		alertCount = 0;
		approvalCount = 0;

		closeAll();
		sendOne();
	}


	function sendOne() {

		/* 다 보냈으면 마무리합니다 */
		if (sendIndex >= pickedLotIds.length) {
			finishSend();
			return;
		}

		let body = {
			lotId: pickedLotIds[sendIndex],
			partnerId: getSelectValue("#outPartner") * 1,
			quantity: pickedLotQtys[sendIndex],
			outboundDate: document.querySelector("#outDate").value
		};

		apiSend("POST", "/api/outbound", body, afterOne, failOne);
	}


	function afterOne(data) {

		/* 표에 한 줄 추가 */
		let last = rowDates.length;

		rowDates[last] = document.querySelector("#outDate").value;
		rowItemIds[last] = document.querySelector("#outCode").value;
		rowLotIds[last] = pickedLotIds[sendIndex];
		rowNames[last] = document.querySelector("#outName").value;
		rowQtys[last] = pickedLotQtys[sendIndex];
		rowUnits[last] = document.querySelector("#outUnit").value;
		rowZones[last] = getSelectText("#outWarehouse") + " " + getSelectText("#outZone");
		rowPartners[last] = getSelectText("#outPartner");

		doneCount = doneCount + 1;

		if (data.alertCreated == true) {
			alertCount = alertCount + 1;
		}
		if (data.approvalId != null) {
			approvalCount = approvalCount + 1;
		}

		sendIndex = sendIndex + 1;
		sendOne();
	}


	/* 한 건이 실패해도 나머지는 계속 보냅니다 */
	function failOne(message) {

		alert("LOT-" + pickedLotIds[sendIndex] + " 출고 실패\n" + message);

		sendIndex = sendIndex + 1;
		sendOne();
	}


	function finishSend() {

		drawList();
		clearInput(["#outQty"]);

		let msg = "출고가 등록되었습니다. (로트 " + doneCount + "건)";

		if (alertCount > 0) {
			msg = msg + "\n재고부족 알림이 " + alertCount + "건 생성되었습니다.";
		}
		if (approvalCount > 0) {
			msg = msg + "\n발주 승인 요청이 " + approvalCount + "건 자동 생성되었습니다.";
		}

		alert(msg);
	}


	/* ============================================================
	   출고 이력 표

	   서버에 출고 목록을 조회하는 API가 아직 없어서,
	   이 화면에서 등록한 건만 보여 줍니다.
	   (GET /api/outbound 가 생기면 여기서 받아오면 됩니다)
	   ============================================================ */
	function drawList() {

		let note = document.querySelector("#listNote");

		if (note != null) {
			note.innerHTML = "출고 목록 조회 기능이 서버에 아직 없어, 이 화면에서 등록한 건만 표시됩니다.";
		}

		let html = "";

		if (rowDates.length == 0) {
			document.querySelector("#outBody").innerHTML = "<tr><td colspan='10'>이 화면에서 등록한 출고 내역이 없습니다.</td></tr>";
			return;
		}

		for (let i = 0; i < rowDates.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>" + rowDates[i] + "</td>";
			html = html + "<td>" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLotIds[i] + "</td>";
			html = html + "<td>" + rowNames[i] + "</td>";
			html = html + "<td>" + rowQtys[i] + "</td>";
			html = html + "<td>" + rowUnits[i] + "</td>";
			html = html + "<td>" + rowZones[i] + "</td>";
			html = html + "<td>" + rowPartners[i] + "</td>";
			html = html + "<td><button class='delete-btn' onclick='doDelete(" + i + ")'>지우기</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#outBody").innerHTML = html;
	}


	/* 표에서만 지웁니다. 서버에 출고 취소 기능이 없어서
	   실제 재고는 되돌아가지 않습니다. */
	function doDelete(index) {

		if (confirm("이 줄을 목록에서 지울까요?\n(실제 출고는 취소되지 않습니다)") == false) {
			return;
		}

		removeAt([rowDates, rowItemIds, rowLotIds, rowNames,
		          rowQtys, rowUnits, rowZones, rowPartners], index);

		drawList();
	}


	function closeAll() {
		closeModal("#recommendModal");
		closeModal("#lotModal");
	}


	/* 화면이 열릴 때 실행 */
	startUp();

</script>

</body>

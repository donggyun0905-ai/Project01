		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button>

					<option>BOX</option>

				</select>
				<span class="hint-text" id="outAvailText"></span>

				<label>목적지</label>

				</select>
			</div>
			
			<!-- 누르면 FIFO/FEFO 추천 모달이 뜹니다 -->

		</section>
		
		<!-- 검색 - "출고 이력" 탭에서만 씁니다(품목명으로 검색), 탭 바뀌면 감춥니다 -->

		     요청도 여기 다 뜸)을 눌러서 바꿔 보는 탭입니다. switchTab()이 표/버튼을 같이 바꿉니다. -->
		<div class="table-tabs">

					<col style="width:17%">
				</colgroup>
				<thead>
					<tr>
						<th>NO</th>

						<th>구역</th>

				<!-- 표 내용은 drawList()가 채웁니다 -->

				</tbody>

			<table id="requestTable" style="display:none;">
				<colgroup>

					<col style="width:13%">

					<col style="width:9%">
					<col style="width:9%">

					<col style="width:12%">
				</colgroup>
				<thead>

						<th>NO</th>

						<th>품목명</th>
						<th>요청 수량</th>
						<th>목적지</th>
						<th>상태</th>

						<th>처리수량</th>

				<!-- 표 내용은 drawRequestList()가 채웁니다 -->

	</div>

<!-- FIFO/FEFO 추천 + LOT 자동 선택 결과 (모달 - 한 번에 다 보여줍니다) -->
<div class="modal-overlay" id="lotModal">
	<div class="modal-box lot-modal">

		<div class="modal-header">
			<h3>출고 방식 자동 추천 및 LOT 선택 결과</h3>

		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeAll()">취소</button>

</div>


<!-- ============================================================
     출고 등록 화면 로직
     ------------------------------------------------------------
     흐름 : 입력 -> [자동 추천 및 확인] -> 모달(FIFO/FEFO 안내 + 로트 목록이 한 번에 표시)
            -> [출고 등록] -> 표에 추가

     원래는 안내 모달에서 [다음]을 한 번 더 눌러야 로트 표가 나왔는데,
     한 번에 다 보이는 게 헷갈리지 않는다는 판단으로 모달 하나로 합쳤습니다.

     드롭다운 값과 공통 함수는 common.js 에 있습니다.
     ============================================================ -->
<script>

	/* ============================================================
	   출고 등록 - 서버 연동

	   흐름
	     입력 → [자동 추천 및 확인]
	          → 이 품목의 로트를 FIFO/FEFO 순으로 정렬해서 보여줌 (GET /api/stock-lots)
	          → 모달에서 로트별로 뺄 수량을 직접 입력(전부 0에서 시작)
	          → [출고 등록] → 로트마다 POST /api/outbound

	   (예전엔 미리 "몇 개 뺄지"를 입력받아 GET /api/outbound/recommend로 로트별 기본
	    수량을 추천받았는데, 결국 이 모달에서 로트별로 다시 정하게 되어 있어 그 입력이
	    중복이라 없앴습니다. 정렬 방식만 자동으로 정해 주고, 수량은 여기서 바로 입력합니다.)

	   출고는 로트 단위로 처리해서, 한 번 요청에 여러 건이 나갈 수 있습니다.
	   ============================================================ */

	/* 서버가 추천해 준 로트 */
	let pickedWay = "";
	let pickedLotIds = [];
	let pickedLotIn = [];
	let pickedLotExp = [];
	let pickedLotQtys = [];   // 그 로트에서 뺄 수량 (모달에서 직접 조정 가능)
	let pickedLotAvail = [];  // 그 로트에 실제로 남아있는 수량 (조정 시 이 값까지만 허용)
	let pickedLotZone = [];   // 그 로트가 있는 구역(zoneId) - 표에 창고/구역 이름으로 보여줍니다
	let outItemId = -1;       // 지금 추천/조회 대상 품목 - 전체 로트를 다시 조회할 때 씁니다

	/* 출고 이력 표 (서버에서 받아옴, GET /api/outbound) */
	let rowIds = [];
	let rowDates = [];
	let rowItemIds = [];
	let rowLotIds = [];
	let rowQtys = [];
	let rowZoneIds = [];
	let rowPartnerIds = [];

	/* 출고 요청 표 (서버에서 받아옴, GET /api/approvals?requestType=출고) */
	let reqIds = [];
	let reqTimes = [];
	let reqItemIds = [];
	let reqQtys = [];
	let reqPartnerIds = [];
	let reqStatuses = [];
	let reqApprovedTimes = [];
	let reqApprovedBys = [];
	let reqFulfilledQtys = [];

	/* "history"(출고 이력) / "request"(출고 요청) - switchTab()이 바꿉니다 */
	let nowTab = "history";

	/* 처리자 이름을 보여주려고 미리 받아 둡니다 (GET /api/users) */
	let userIds = [];
	let userNames = [];

	let nowPage = 1;
	let totalCount = 0;

	/* 여러 건을 순서대로 보낼 때 쓰는 값 */
	let sendIndex = 0;
	let doneCount = 0;
	let alertCount = 0;
	let approvalCount = 0;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillCategory("#outCategory");
		fillPartner("#outPartner", "CUSTOMER");   // 출고는 거래처(고객)만
		fillItemList("#itemList");

		document.querySelector("#outDate").value = getToday();

		apiGet("/api/users?active=true&size=200", putUsersActive);
	}


	function putUsersActive(data) {
		addUsers(data.items);
		apiGet("/api/users?active=false&size=200", putUsersInactive);
	}


	function putUsersInactive(data) {
		addUsers(data.items);
		loadHistory();
	}


	function addUsers(list) {
		for (let i = 0; i < list.length; i++) {
			userIds[userIds.length] = list[i].userId;
			userNames[userNames.length] = list[i].name;
		}
	}


	/* 처리자(승인/반려한 사람) 번호로 이름을 찾습니다 */
	function findUserName(userId) {

		if (userId == null) {
			return "-";
		}

		for (let i = 0; i < userIds.length; i++) {
			if (userIds[i] == userId) {
				return userNames[i];
			}
		}
		return "사용자 " + userId;
	}


	/* 품목명을 고르면 코드·단위·카테고리가 채워집니다.
	   (창고/구역은 로트마다 이미 정해져 있고 추천 모달에서 로트별로 보여주므로,
	   이 등록 폼에서는 더 이상 고를 필요가 없어 뺐습니다) */
	function changeItem() {

		let i = findItemByName(document.querySelector("#outName").value);

		if (i == -1) {
			document.querySelector("#outCode").value = "";
			document.querySelector("#outAvailText").innerHTML = "";
			return;
		}

		document.querySelector("#outCode").value = itemCodes[i];
		document.querySelector("#outUnit").value = itemUnitList[i];

		if (itemCategoryList[i] != null) {
			document.querySelector("#outCategory").value = itemCategoryList[i];
		}

		updateOutAvailable();
	}


	/* 이 품목의 전체 재고(모든 구역 합계)를 참고용으로 보여줍니다. 실제로 얼마씩 뺄지는
	   [자동 추천 및 확인]을 눌러서 뜨는 모달에서 로트별로 직접 정하므로, 여기선 그냥
	   안내 문구일 뿐 입력을 막는 용도는 아닙니다. */
	function updateOutAvailable() {

		let itemId = getItemId(document.querySelector("#outName").value);

		if (itemId == -1) {
			document.querySelector("#outAvailText").innerHTML = "";
			return;
		}

		apiGet("/api/items/" + itemId, putOutAvailable);
	}


	function putOutAvailable(data) {
		document.querySelector("#outAvailText").innerHTML = "전체 재고: " + addComma(data.totalQuantity) + "개";
	}


	/* ============================================================
	   모달 1 - 이 품목의 로트를 정렬 방식(FIFO/FEFO)에 맞춰 보여줍니다

	   예전엔 여기서 "몇 개 뺄지"를 먼저 입력받아 서버(recommend API)에
	   물어보고, 그 결과로 로트별 기본 수량을 미리 채워 줬습니다. 그런데
	   실제로 얼마씩 뺄지는 결국 이 모달에서 로트별로 다시 정하게 되어 있어서
	   미리 입력받는 수량이 그저 한 번 더 거치는 단계였습니다. 그래서 그 값은
	   없애고, 로트 목록만 정렬해서 보여준 뒤 전부 0에서 시작해 로트별로
	   직접 입력하도록 했습니다.
	   ============================================================ */
	function openRecommend() {

		if (isBlank(["#outDate", "#outName"]) == true) {
			alert("출고일, 품목명을 채워 주세요.");
			return;
		}

		let itemId = getItemId(document.querySelector("#outName").value);

		if (itemId == -1) {
			alert("등록되지 않은 품목입니다.\n후보 목록에서 골라 주세요.");
			return;
		}

		/* 유통기한이 있는 품목이면 FEFO, 없으면 FIFO 순으로 보여줍니다 */
		let i = findItemByName(document.querySelector("#outName").value);
		pickedWay = (i != -1 && itemShelfEmpty(i) == true) ? "FIFO" : "FEFO";

		if (pickedWay == "FEFO") {
			document.querySelector("#recommendText").innerHTML =
				"해당 품목은 유통기한 관리 대상입니다.<br>따라서 <strong>FEFO(유통기한 기준)</strong> 순으로 로트를 보여줍니다.";
		} else {
			document.querySelector("#recommendText").innerHTML =
				"해당 품목은 유통기한 관리 대상이 아닙니다.<br>따라서 <strong>FIFO(입고일 기준)</strong> 순으로 로트를 보여줍니다.";
		}
		document.querySelector("#recommendWay").innerHTML = pickedWay;

		outItemId = itemId;
		apiGet("/api/stock-lots?itemId=" + itemId + "&status=NORMAL&size=200", putAllLots);
	}


	/* 그 품목이 유통기한을 관리하지 않는 품목인지 확인합니다.
	   ITEM.shelf_life_days 가 비어 있으면 유통기한 없는 품목입니다. */
	function itemShelfEmpty(i) {

		if (itemShelfList[i] == null) {
			return true;
		}
		return false;
	}


	/* 이 품목의 전체 로트를 받아 모달에 보여줄 목록을 만듭니다.
	   정렬 방식(FEFO=유통기한 빠른 순, FIFO=입고일 빠른 순)으로 정렬만 해서 보여주고,
	   로트별 수량은 전부 0에서 시작합니다 - 얼마씩 뺄지는 아래에서 직접 입력합니다. */
	function putAllLots(data) {

		let list = data.items;

		list.sort(function (a, b) {
			if (pickedWay == "FEFO") {
				let ea = a.expiryDate == null ? "9999-99-99" : a.expiryDate;
				let eb = b.expiryDate == null ? "9999-99-99" : b.expiryDate;
				if (ea < eb) return -1;
				if (ea > eb) return 1;
				return 0;
			}
			if (a.inboundDate < b.inboundDate) return -1;
			if (a.inboundDate > b.inboundDate) return 1;
			return 0;
		});

		pickedLotIds = [];
		pickedLotIn = [];
		pickedLotExp = [];
		pickedLotQtys = [];
		pickedLotAvail = [];
		pickedLotZone = [];

		for (let i = 0; i < list.length; i++) {

			if (list[i].quantity <= 0) {
				continue; // 남은 수량이 없는 로트는 뺄 것도 없으니 목록에서 뺍니다
			}

			pickedLotIds[pickedLotIds.length] = list[i].lotId;
			pickedLotIn[pickedLotIn.length] = list[i].inboundDate;
			pickedLotExp[pickedLotExp.length] = list[i].expiryDate == null ? "" : list[i].expiryDate;
			pickedLotAvail[pickedLotAvail.length] = list[i].quantity;
			pickedLotZone[pickedLotZone.length] = list[i].zoneId;
			pickedLotQtys[pickedLotQtys.length] = 0;
		}

		openLot();
	}


	/* ============================================================
	   추천 방식 안내 + 어느 로트에서 얼마씩 뺄지 (모달 하나에 같이 표시)
	   ============================================================ */
	function openLot() {

		let html = "";
		let total = 0;
		let nearCount = 0;

		for (let i = 0; i < pickedLotIds.length; i++) {

			let expiry = pickedLotExp[i];
			let cell = "-";

			if (expiry != "") {

				/* 유통기한이 7일 이내면 눈에 띄게 표시합니다 (명세서 F-05) */
				if (isNearExpiry(expiry) == true) {

					let left = getLeftDays(expiry);
					let word = "D-" + left;

					if (left < 0) {
						word = "기한 지남";
					}

					cell = "<span class='near-expiry'>" + expiry + " (" + word + ")</span>";
					nearCount = nearCount + 1;

				} else {
					cell = expiry;
				}
			}

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>LOT-" + pickedLotIds[i] + "</td>";
			html = html + "<td>" + findZoneName(pickedLotZone[i]) + "</td>";
			html = html + "<td>" + pickedLotIn[i] + "</td>";
			html = html + "<td>" + cell + "</td>";
			html = html + "<td><input type='number' class='lot-qty-input' id='lotQty" + i + "' "
				+ "min='0' max='" + pickedLotAvail[i] + "' value='" + pickedLotQtys[i] + "' "
				+ "onchange='onLotQtyChange(" + i + ")'> / " + pickedLotAvail[i] + "</td>";
			html = html + "</tr>";

			total = total + pickedLotQtys[i];
		}

		document.querySelector("#lotBody").innerHTML = html;
		updateLotTotalText();

		let wayText = "정렬 방식: " + pickedWay;

		if (nearCount > 0) {
			wayText = wayText + " / 유통기한 임박 로트 " + nearCount + "건이 포함되어 있습니다";
		}
		wayText = wayText + " / 로트별 수량 칸에 뺄 수량을 직접 입력하세요";

		document.querySelector("#lotWayText").innerHTML = wayText;

		openModal("#lotModal");
	}


	/* 담당자가 모달에서 로트별 수량을 직접 조정했을 때 - 그 로트에 실제로
	   남아있는 수량(pickedLotAvail)을 넘길 수는 없게 막고, 합계 표시를 갱신합니다. */
	function onLotQtyChange(i) {

		let input = document.querySelector("#lotQty" + i);
		let value = input.value * 1;

		if (isNaN(value) || value < 0) {
			value = 0;
		}
		if (value > pickedLotAvail[i]) {
			value = pickedLotAvail[i];
			alert("이 로트에는 " + pickedLotAvail[i] + "개까지만 있습니다.");
		}

		value = Math.floor(value);
		input.value = value;
		pickedLotQtys[i] = value;

		updateLotTotalText();
	}


	/* 로트별 수량을 조정할 때마다 총 출고 수량 표시를 다시 계산합니다 */
	function updateLotTotalText() {

		let total = 0;

		for (let i = 0; i < pickedLotQtys.length; i++) {
			total = total + pickedLotQtys[i];
		}

		document.querySelector("#totalQtyInput").value = total;
		document.querySelector("#lotTotalUnit").innerHTML = document.querySelector("#outUnit").value;
	}


	/* "총 출고 수량"에 직접 숫자를 입력하면, 정렬된 순서(FEFO/FIFO) 그대로 앞에서부터
	   로트별 수량을 자동으로 채워 줍니다. 로트별 수량 칸을 하나씩 채우기 번거로울 때
	   한 번에 채우는 용도이고, 채운 뒤에도 로트별로 다시 직접 조정할 수 있습니다. */
	function onTotalQtyChange() {

		let input = document.querySelector("#totalQtyInput");
		let requested = input.value * 1;

		if (isNaN(requested) || requested < 0) {
			requested = 0;
		}

		let totalAvail = 0;
		for (let i = 0; i < pickedLotAvail.length; i++) {
			totalAvail = totalAvail + pickedLotAvail[i];
		}

		if (requested > totalAvail) {
			requested = totalAvail;
			alert("이 품목의 남은 재고가 " + addComma(totalAvail) + "개뿐이라, 그만큼만 채웠습니다.");
		}

		let rest = requested;

		for (let i = 0; i < pickedLotIds.length; i++) {
			let take = Math.min(rest, pickedLotAvail[i]);
			pickedLotQtys[i] = take;
			rest = rest - take;
		}

		openLot();
	}


	/* ============================================================
	   출고 등록  (POST /api/outbound)

	   로트가 여러 개면 서버에 여러 번 나눠 보내야 합니다.
	   한 건이 끝나면 다음 건을 보내는 방식으로 순서대로 처리합니다.
	   ============================================================ */
	function doRegister() {

		let total = 0;
		for (let i = 0; i < pickedLotQtys.length; i++) {
			total = total + pickedLotQtys[i];
		}
		if (total <= 0) {
			alert("출고할 수량이 없습니다. 로트별 수량을 확인해 주세요.");
			return;
		}

		sendIndex = 0;
		doneCount = 0;
		alertCount = 0;
		approvalCount = 0;

		closeAll();
		sendOne();
	}


	function sendOne() {

		/* 다 보냈으면 마무리합니다 */
		if (sendIndex >= pickedLotIds.length) {
			finishSend();
			return;
		}

		/* 담당자가 이 로트 수량을 0으로 조정했으면(=이 로트는 안 쓰기로 함) 건너뜁니다 */
		if (pickedLotQtys[sendIndex] <= 0) {
			sendIndex = sendIndex + 1;
			sendOne();
			return;
		}

		let body = {
			lotId: pickedLotIds[sendIndex],
			partnerId: getSelectValue("#outPartner") * 1,
			quantity: pickedLotQtys[sendIndex],
			outboundDate: document.querySelector("#outDate").value
		};

		apiSend("POST", "/api/outbound", body, afterOne, failOne);
	}


	function afterOne(data) {

		doneCount = doneCount + 1;

		if (data.alertCreated == true) {
			alertCount = alertCount + 1;
		}
		if (data.approvalId != null) {
			approvalCount = approvalCount + 1;
		}

		sendIndex = sendIndex + 1;
		sendOne();
	}


	/* 한 건이 실패해도 나머지는 계속 보냅니다 */
	function failOne(message) {

		alert("LOT-" + pickedLotIds[sendIndex] + " 출고 실패\n" + message);

		sendIndex = sendIndex + 1;
		sendOne();
	}


	function finishSend() {

		clearInput(["#outName", "#outCode"]);
		document.querySelector("#outAvailText").innerHTML = "";

		let msg = "출고가 등록되었습니다. (로트 " + doneCount + "건)";

		if (alertCount > 0) {
			msg = msg + "\n재고부족 알림이 " + alertCount + "건 생성되었습니다.";
		}
		if (approvalCount > 0) {
			msg = msg + "\n발주 승인 요청이 " + approvalCount + "건 자동 생성되었습니다.";
		}

		/* 방금 등록한 출고가 바로 보이게 다시 받아옵니다 */
		nowPage = 1;
		loadHistory();

		alert(msg);
	}


	/* ============================================================
	   "출고 이력" / "출고 요청" 탭 전환

	   같은 표 영역에서 버튼 두 개로 보여줄 표만 바꿉니다. 페이지 번호는
	   탭이 다르면 서로 의미가 달라서(이력 총 건수 vs 요청 총 건수),
	   탭을 바꾸면 1쪽부터 다시 봅니다.
	   ============================================================ */
	function switchTab(tab) {

		nowTab = tab;
		nowPage = 1;

		document.querySelector("#tabHistoryBtn").className = (tab == "history") ? "tab-btn active" : "tab-btn";
		document.querySelector("#tabRequestBtn").className = (tab == "request") ? "tab-btn active" : "tab-btn";
		document.querySelector("#historyTable").style.display = (tab == "history") ? "" : "none";
		document.querySelector("#requestTable").style.display = (tab == "request") ? "" : "none";
		document.querySelector("#outSearchBox").style.display = (tab == "history") ? "" : "none";

		if (tab == "history") {
			loadHistory();
		} else {
			loadRequests();
		}
	}


	/* ============================================================
	   출고 이력 표  (GET /api/outbound)
	   ============================================================ */
	function loadHistory() {

		let path = "/api/outbound?page=" + nowPage + "&size=" + pageSize;

		let word = document.querySelector("#out-search").value;
		if (word != "") {
			path = path + "&keyword=" + encodeURIComponent(word);
		}

		apiGet(path, putHistory);
	}


	/* 검색창 - 검색하면 1쪽부터 다시 봅니다 (출고 이력 탭에서만 씀) */
	function doSearch() {
		nowPage = 1;
		loadHistory();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	function putHistory(data) {

		let list = data.items;
		totalCount = data.total;

		rowIds = [];
		rowDates = [];
		rowItemIds = [];
		rowLotIds = [];
		rowQtys = [];
		rowZoneIds = [];
		rowPartnerIds = [];

		for (let i = 0; i < list.length; i++) {
			rowIds[i] = list[i].outboundId;
			rowDates[i] = list[i].outboundDate;
			rowItemIds[i] = list[i].itemId;
			rowLotIds[i] = list[i].lotId;
			rowQtys[i] = list[i].quantity;
			rowZoneIds[i] = list[i].zoneId;
			rowPartnerIds[i] = list[i].partnerId;
		}

		drawList();
	}


	/* 품목/거래처 번호로 이름을 찾습니다 (common.js가 받아 둔 목록에서) */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}

	function findItemUnit(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemUnitList[i];
			}
		}
		return "";
	}

	function findPartnerName(partnerId) {

		for (let i = 0; i < customerIds.length; i++) {
			if (customerIds[i] == partnerId) {
				return customerNames[i];
			}
		}
		return "거래처 " + partnerId;
	}


	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 */
	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	function drawList() {

		let html = "";

		if (rowDates.length == 0) {
			document.querySelector("#outBody").innerHTML = "<tr><td colspan='9'>출고 이력이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let i = 0; i < rowDates.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>" + rowDates[i] + "</td>";
			html = html + "<td>ITEM-" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLotIds[i] + "</td>";
			html = html + "<td>" + findItemName(rowItemIds[i]) + "</td>";
			html = html + "<td>" + addComma(rowQtys[i]) + "</td>";
			html = html + "<td>" + findItemUnit(rowItemIds[i]) + "</td>";
			html = html + "<td>" + findZoneName(rowZoneIds[i]) + "</td>";
			html = html + "<td>" + findPartnerName(rowPartnerIds[i]) + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#outBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	/* ============================================================
	   출고 요청 표  (GET /api/approvals?requestType=출고)

	   실제로 나간 게 아니라 "이만큼 출고해 달라"는 승인요청 자체를 보여줍니다.
	   재고보다 많이 요청된 것도 여기 다 뜨고(이상출고로 이어짐), 대기/승인/반려
	   상태가 그대로 보입니다.
	   ============================================================ */
	function loadRequests() {
		apiGet("/api/approvals?requestType=" + encodeURIComponent("출고") + "&page=" + nowPage + "&size=" + pageSize, putRequests);
	}


	function putRequests(data) {

		let list = data.items;
		totalCount = data.total;

		reqIds = [];
		reqTimes = [];
		reqItemIds = [];
		reqQtys = [];
		reqPartnerIds = [];
		reqStatuses = [];
		reqApprovedTimes = [];
		reqApprovedBys = [];
		reqFulfilledQtys = [];

		for (let i = 0; i < list.length; i++) {
			reqIds[i] = list[i].approvalId;
			reqItemIds[i] = list[i].itemId;
			reqQtys[i] = list[i].requestedQty;
			reqPartnerIds[i] = list[i].partnerId;
			reqStatuses[i] = list[i].status;
			reqTimes[i] = formatReqTime(list[i].requestedAt);
			reqApprovedTimes[i] = formatReqTime(list[i].approvedAt);
			reqApprovedBys[i] = list[i].approvedBy;
			reqFulfilledQtys[i] = list[i].fulfilledQty;
		}

		drawRequestList();
	}


	/* 서버가 주는 시각("2026-08-25T14:07:32")을 "2026-08-25 14:07"로 다듬습니다. 없으면 "-" */
	function formatReqTime(t) {

		if (t == null) {
			return "-";
		}

		t = t.replace("T", " ");
		if (t.length > 16) {
			t = t.substring(0, 16);
		}
		return t;
	}


	function drawRequestList() {

		let html = "";

		if (reqIds.length == 0) {
			document.querySelector("#reqBody").innerHTML = "<tr><td colspan='10'>출고 요청 이력이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let i = 0; i < reqIds.length; i++) {

			let fulfilled = (reqFulfilledQtys[i] == null) ? "-" : addComma(reqFulfilledQtys[i]);

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>" + reqTimes[i] + "</td>";
			html = html + "<td>" + findItemName(reqItemIds[i]) + "</td>";
			html = html + "<td>" + addComma(reqQtys[i]) + "</td>";
			html = html + "<td>" + findPartnerName(reqPartnerIds[i]) + "</td>";
			html = html + "<td>" + reqStatuses[i] + "</td>";
			html = html + "<td>" + reqIds[i] + "</td>";
			html = html + "<td>" + findUserName(reqApprovedBys[i]) + "</td>";
			html = html + "<td>" + fulfilled + "</td>";
			html = html + "<td>" + reqApprovedTimes[i] + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#reqBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		if (nowTab == "history") {
			loadHistory();
		} else {
			loadRequests();
		}
	}


	function closeAll() {
		closeModal("#lotModal");
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 지금 보고 있는 탭(출고 이력/출고 요청)을 바로 다시
	   받아오고, 연결이 끊기거나 신호를 놓쳐도 5초마다 한 번씩은 따라잡도록
	   폴링도 안전망으로 같이 둡니다(alert.html과 동일한 패턴). LOT 선택 모달을
	   보고 있는 중에는 건너뜁니다.
	   ============================================================ */
	function refreshIfIdle() {
		let modal = document.querySelector("#lotModal");
		if (modal.className.indexOf("active") == -1) {
			goPage(nowPage);
		}
	}

	/* "출고 이력" 탭은 outbound 신호로, "출고 요청" 탭은 approval 신호로 바뀌니 둘 다 구독합니다. */
	connectRealtimeRefresh(refreshIfIdle, ["outbound", "approval"]);
	setInterval(refreshIfIdle, 5000);

</script>

</body>

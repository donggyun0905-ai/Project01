<!DOCTYPE html> <!-- 08.13 감사로그 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>감사로그</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--audit css -->
	<link rel="stylesheet" href="../css/audit.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 대시보드</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
	
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button> 
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button> 
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn active">감사로그</button> <!--현재 화면이 감사로그라서 -->
		</header>
		
		<h4 class= "page-title">감사로그</h4>
		
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group expiration-group">
				<label>기간</label>
				<div class="date-range">
					<input type="date" id="fFrom" onchange="drawList()">
					<span>~</span>
					<input type="date" id="fTo" onchange="drawList()">
				</div>
			</div>
			
			<div class="form-group">
				<label>변경 유형</label>
				<select id="fType" onchange="drawList()">
					<option>전체</option>
					<option>수정</option>
					<option>삭제</option>
					<option>복구</option>
				</select>
			</div>
		</section>
		<!-- 입고입력(표)  -->
		
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>변경 일시</th>
						<th>담당자</th>
						<th>변경 유형</th>
						<th>품목명</th>
						<th>품목 번호</th>
						<th>로트 번호</th>
						<th>변경 전</th>
						<th>변경 후</th>
						<th>사유</th>
						<th>되돌리기</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="lgBody">
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     감사로그 화면 로직
     ------------------------------------------------------------
     재고를 직접 고치거나 지운 기록을 보여 줍니다.
     되돌리기를 누르면 "변경 전" 값으로 재고가 돌아가고,
     그 되돌린 일 자체도 새 기록으로 남습니다 (변경 유형 = 복구).

     되돌리기는 관리자(ADMIN)만 할 수 있습니다.
     ============================================================ -->
<script>

	/* 감사로그. 같은 번호끼리 한 줄입니다. */
	let logIds = [];
	let logTimes = [];
	let logWorkers = [];
	let logTypes = [];       // 수정 / 삭제 / 복구
	let logNames = [];
	let logCodes = [];
	let logLots = [];
	let logBefore = [];      // 변경 전
	let logAfter = [];       // 변경 후
	let logReasons = [];
	let logReverted = [];    // 이미 되돌렸는지

	let logSeq = 100;


	/* 나중에 : apiGet("/api/stock-change-logs", putLogs) */
	function loadData() {

		logIds     = [1, 2, 3];
		logTimes   = ["2026-08-06 10:22", "2026-08-07 14:05", "2026-08-09 09:31"];
		logWorkers = ["이지원", "이지원", "김민준"];
		logTypes   = ["수정", "삭제", "수정"];
		logNames   = ["두부 프리미엄", "어묵 정품", "주방세제 대용량"];
		logCodes   = ["ITEM-1", "ITEM-2", "ITEM-201"];
		logLots    = ["LOT-1", "LOT-3", "LOT-5"];
		logBefore  = ["수량: 20개", "수량: 8개 / 상태: 정상", "수량: 50개"];
		logAfter   = ["수량: 40개", "삭제됨", "수량: 45개"];
		logReasons = ["오입력 수정", "중복 등록", "재고 실사 오차 보정"];
		logReverted = [false, false, false];

		drawList();
	}


	/* 거르기 조건에 맞는 줄 번호만 골라냅니다 */
	function getList() {

		let type = document.querySelector("#fType").value;
		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;
		let result = [];

		for (let i = 0; i < logIds.length; i++) {

			if (type != "전체" && logTypes[i] != type) {
				continue;
			}

			/* logTimes 는 "2026-08-06 10:22" 라서 앞 10글자만 잘라 씁니다 */
			let day = logTimes[i].substring(0, 10);

			if (from != "" && day < from) {
				continue;
			}
			if (to != "" && day > to) {
				continue;
			}

			result[result.length] = i;
		}

		return result;
	}


	function drawList() {

		let list = getList();
		let html = "";

		if (list.length == 0) {
			document.querySelector("#lgBody").innerHTML = "<tr><td colspan='11'>조건에 맞는 기록이 없습니다.</td></tr>";
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];

			/* 되돌리기 버튼은 아직 안 되돌린 수정·삭제 기록에만 붙입니다.
			   복구 기록 자체는 되돌릴 수 없습니다. */
			let btn = "-";

			if (logTypes[i] == "복구") {
				btn = "-";
			} else if (logReverted[i] == true) {
				btn = "되돌림";
			} else {
				btn = "<button class='edit-btn' onclick='doRestore(" + i + ")'>되돌리기</button>";
			}

			html = html + "<tr>";
			html = html + "<td>" + (n + 1) + "</td>";
			html = html + "<td>" + logTimes[i] + "</td>";
			html = html + "<td>" + logWorkers[i] + "</td>";
			html = html + "<td>" + logTypes[i] + "</td>";
			html = html + "<td>" + logNames[i] + "</td>";
			html = html + "<td>" + logCodes[i] + "</td>";
			html = html + "<td>" + logLots[i] + "</td>";
			html = html + "<td>" + logBefore[i] + "</td>";
			html = html + "<td>" + logAfter[i] + "</td>";
			html = html + "<td>" + logReasons[i] + "</td>";
			html = html + "<td>" + btn + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#lgBody").innerHTML = html;
	}


	/* 되돌리기 버튼
	   나중에 : apiSend("POST", "/api/stock-change-logs/" + logIds[i] + "/restore", null, loadData) */
	function doRestore(i) {

		/* 관리자만 되돌릴 수 있습니다 */
		if (sessionStorage.getItem("userRole") == "STAFF") {
			alert("되돌리기는 관리자만 할 수 있습니다.");
			return;
		}

		let ask = "로트 " + logLots[i] + " 을 아래 상태로 되돌릴까요?\n\n";
		ask = ask + "지금 : " + logAfter[i] + "\n";
		ask = ask + "되돌린 뒤 : " + logBefore[i];

		if (confirm(ask) == false) {
			return;
		}

		/* 원래 기록에 되돌렸다고 표시합니다 */
		logReverted[i] = true;

		/* 되돌린 일 자체도 새 기록으로 남깁니다 */
		let last = logIds.length;

		logIds[last]     = logSeq;
		logTimes[last]   = getToday() + " 00:00";
		logWorkers[last] = "관리자";
		logTypes[last]   = "복구";
		logNames[last]   = logNames[i];
		logCodes[last]   = logCodes[i];
		logLots[last]    = logLots[i];
		logBefore[last]  = logAfter[i];
		logAfter[last]   = logBefore[i];
		logReasons[last] = "기록 " + logIds[i] + "번 되돌리기";
		logReverted[last] = false;

		logSeq = logSeq + 1;

		drawList();
		alert("되돌렸습니다.");
	}


	/* 화면이 열릴 때 실행 */
	loadData();

</script>

</body>



</html>

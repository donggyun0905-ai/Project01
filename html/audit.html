<!DOCTYPE html> <!-- 08.13 감사로그 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>감사로그</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--audit css -->
	<link rel="stylesheet" href="../css/audit.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
	
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button> 
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button> 
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn active">감사로그</button> <!--현재 화면이 감사로그라서 -->
		</header>
		
		<h4 class= "page-title">감사로그</h4>
		
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>변경 유형</label>
				<select id="fType" onchange="doSearch()">
					<option value="">전체</option>
					<option value="UPDATE">수정</option>
					<option value="DELETE">삭제</option>
					<option value="RESTORE">복구</option>
				</select>
			</div>

			<div class="form-group">
				<label>로트 번호 (숫자만)</label>
				<input type="number" id="fLot" placeholder="예: 55" onkeyup="pressEnter(event)">
			</div>

			<div class="form-group expiration-group">
				<label>기간</label>
				<div class="date-range">
					<input type="date" id="fFrom" onchange="doSearch()">
					<span>~</span>
					<input type="date" id="fTo" onchange="doSearch()">
				</div>
			</div>
			
			<button class="register-btn" onclick="doSearch()">조회</button>
		</section>
		<!-- 입고입력(표)  -->
		
		<section class= "table-box">
			<table>
				<colgroup>
					<col style="width:4%">
					<col style="width:10%">
					<col style="width:8%">
					<col style="width:8%">
					<col style="width:11%">
					<col style="width:8%">
					<col style="width:8%">
					<col style="width:15%">
					<col style="width:15%">
					<col style="width:8%">
					<col style="width:5%">
				</colgroup>
				<thead>
					<tr>
						<th>NO</th>
						<th>변경 일시</th>
						<th>담당자</th>
						<th>변경 유형</th>
						<th>품목명</th>
						<th>품목 번호</th>
						<th>로트 번호</th>
						<th>변경 전</th>
						<th>변경 후</th>
						<th>사유</th>
						<th>되돌리기</th>
					</tr>
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="lgBody">
				</tbody>
			</table>
		
			<!-- 쪽 번호 -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     감사로그 화면 로직
     ------------------------------------------------------------
     재고를 직접 고치거나 지운 기록을 보여 줍니다.
     되돌리기를 누르면 "변경 전" 값으로 재고가 돌아가고,
     그 되돌린 일 자체도 새 기록으로 남습니다 (변경 유형 = 복구).

     되돌리기는 관리자(ADMIN)만 할 수 있습니다.
     ============================================================ -->
<script>

	/* ============================================================
	   감사로그 - 서버 연동

	   재고를 직접 고치거나 지운 기록이 쌓이는 곳입니다.
	   출고·이동·반품처럼 재고가 바뀌는 처리도 여기에 기록됩니다.

	   조회와 되돌리기 모두 관리자(ADMIN)만 할 수 있습니다.
	   ============================================================ */

	let logIds = [];
	let logLotIds = [];
	let logItemIds = [];
	let logWorkers = [];
	let logTypes = [];
	let logBefore = [];
	let logAfter = [];
	let logReasons = [];
	let logReverted = [];
	let logTimes = [];

	let nowPage = 1;
	let totalCount = 0;

	/* 담당자 이름을 보여주려고 미리 받아 둡니다 (GET /api/users) */
	let userIds = [];
	let userNames = [];


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	/* 품목명을 보여주려고 품목 목록을 먼저 받아 둔 뒤, 담당자 이름도 받아 둡니다.
	   비활성화된 계정도 예전 기록엔 이름이 나와야 하니 active=true/false 둘 다 받습니다. */
	function afterMaster() {
		apiGet("/api/users?active=true&size=200", putUsersActive);
	}


	function putUsersActive(data) {
		addUsers(data.items);
		apiGet("/api/users?active=false&size=200", putUsersInactive);
	}


	function putUsersInactive(data) {
		addUsers(data.items);
		loadData();
	}


	function addUsers(list) {
		for (let i = 0; i < list.length; i++) {
			userIds[userIds.length] = list[i].userId;
			userNames[userNames.length] = list[i].name;
		}
	}


	/* 담당자 번호로 이름을 찾습니다 */
	function findUserName(userId) {

		if (userId == null) {
			return "-";
		}

		for (let i = 0; i < userIds.length; i++) {
			if (userIds[i] == userId) {
				return userNames[i];
			}
		}
		return "사용자 " + userId;
	}


	/* ============================================================
	   목록 받아오기  (GET /api/stock-change-logs)

	   변경 유형/기간도 이제 서버가 직접 걸러줍니다 - 그래서 쪽 번호(total)도
	   필터링된 기준으로 정확히 나옵니다.
	   ============================================================ */
	function loadData() {

		let path = "/api/stock-change-logs?page=" + nowPage + "&size=" + pageSize;
		let lot = document.querySelector("#fLot").value;
		let type = document.querySelector("#fType").value;
		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;

		if (lot != "") {
			path = path + "&lotId=" + lot;
		}
		if (type != "") {
			path = path + "&changeType=" + type;
		}
		if (from != "") {
			path = path + "&from=" + from;
		}
		if (to != "") {
			path = path + "&to=" + to;
		}

		apiGet(path, putLogs);
	}


	function putLogs(data) {

		let list = data.items;
		totalCount = data.total;

		logIds = [];
		logLotIds = [];
		logItemIds = [];
		logWorkers = [];
		logTypes = [];
		logBefore = [];
		logAfter = [];
		logReasons = [];
		logReverted = [];
		logTimes = [];

		for (let i = 0; i < list.length; i++) {

			logIds[i] = list[i].logId;
			logLotIds[i] = list[i].lotId;
			logItemIds[i] = list[i].itemId;
			logReverted[i] = list[i].isReverted;

			logWorkers[i] = findUserName(list[i].changedBy);

			/* 서버는 UPDATE / DELETE / RESTORE 로 저장합니다.
			   화면에는 우리말로 바꿔서 보여 줍니다. */
			logTypes[i] = changeTypeText(list[i].changeType);

			logBefore[i] = shortValue(list[i].beforeValue);
			logAfter[i] = shortValue(list[i].afterValue);

			if (list[i].reason == null) {
				logReasons[i] = "-";
			} else {
				logReasons[i] = plainText(list[i].reason);
			}

			let t = list[i].changedAt;

			if (t == null) {
				t = "";
			} else {
				t = t.replace("T", " ");
				if (t.length > 16) {
					t = t.substring(0, 16);
				}
			}
			logTimes[i] = t;
		}

		drawList();
	}


	function changeTypeText(type) {

		if (type == "UPDATE") {
			return "수정";
		}
		if (type == "DELETE") {
			return "삭제";
		}
		if (type == "RESTORE") {
			return "복구";
		}
		return type;
	}


	/* 변경 전/후 값은 JSON 글자로 저장돼 있어서
	   수량과 상태만 뽑아 짧게 보여 줍니다. */
	function shortValue(text) {

		if (text == null || text == "") {
			return "-";
		}

		let value = null;

		try {
			value = JSON.parse(text);
		} catch (e) {
			return text;
		}

		let result = "";

		if (value.quantity != null) {
			result = "수량 " + value.quantity;
		}

		if (value.status != null) {
			if (result != "") {
				result = result + " / ";
			}
			result = result + "상태 " + value.status;
		}

		if (result == "") {
			return text;
		}

		return result;
	}


	/* 품목 번호로 이름을 찾습니다 (common.js가 받아 둔 품목 목록에서) */
	function findItemName(itemId) {

		if (itemId == null) {
			return "-";
		}

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	function drawList() {

		let html = "";

		if (logIds.length == 0) {
			document.querySelector("#lgBody").innerHTML = "<tr><td colspan='11'>조건에 맞는 기록이 없습니다.</td></tr>";
			drawPaging("#paging", totalCount, nowPage, "goPage");
			return;
		}

		let startNo = (nowPage - 1) * pageSize;

		for (let i = 0; i < logIds.length; i++) {

			/* 되돌리기는 "삭제" 기록에만 붙입니다(휴지통 개념 - 삭제된 로트는 되살리기 전까진
			   다른 실제 업무가 못 건드리니 안전하게 되돌릴 수 있음). "수정" 기록은 그 이후에
			   실제 출고/이동 등이 이미 일어났을 수 있어서 그냥 덮어쓰면 위험하므로, 되돌리기
			   대신 직접수정으로 새 보정 기록을 남기도록 유도합니다(서버도 DELETE 외엔 거절함). */
			let btn = "-";

			if (logTypes[i] == "삭제") {
				if (logReverted[i] == true) {
					btn = "되돌림";
				} else {
					btn = "<button class='edit-btn' onclick='doRestore(" + i + ")'>되돌리기</button>";
				}
			}

			html = html + "<tr>";
			html = html + "<td>" + (startNo + i + 1) + "</td>";
			html = html + "<td>" + logTimes[i] + "</td>";
			html = html + "<td>" + logWorkers[i] + "</td>";
			html = html + "<td>" + logTypes[i] + "</td>";
			html = html + "<td>" + findItemName(logItemIds[i]) + "</td>";
			html = html + "<td>" + (logItemIds[i] == null ? "-" : "ITEM-" + logItemIds[i]) + "</td>";
			html = html + "<td>LOT-" + logLotIds[i] + "</td>";
			html = html + "<td>" + logBefore[i] + "</td>";
			html = html + "<td>" + logAfter[i] + "</td>";
			html = html + "<td>" + logReasons[i] + "</td>";
			html = html + "<td>" + btn + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#lgBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadData();
	}


	/* 로트 번호로 찾을 때는 서버에 다시 물어봅니다 */
	function doSearch() {
		nowPage = 1;
		loadData();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	/* ============================================================
	   되돌리기  (POST /api/stock-change-logs/{logId}/restore)

	   변경 전 값으로 재고를 되돌립니다.
	   되돌린 일 자체도 새 기록으로 남습니다.
	   ============================================================ */
	function doRestore(i) {

		let ask = "LOT-" + logLotIds[i] + " 를 아래 상태로 되돌릴까요?\n\n";
		ask = ask + "지금 : " + logAfter[i] + "\n";
		ask = ask + "되돌린 뒤 : " + logBefore[i];

		if (confirm(ask) == false) {
			return;
		}

		apiSend("POST", "/api/stock-change-logs/" + logIds[i] + "/restore", null, afterRestore);
	}


	function afterRestore(data) {

		loadData();
		alert("되돌렸습니다.\nLOT-" + data.lotId + " 이(가) 수량 " + data.restoredQuantity
		      + ", 상태 " + data.restoredStatus + " 로 복구되었습니다.");
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 바로 다시 받아오고, 연결이 끊기거나 신호를 놓쳐도
	   5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다(alert.html과
	   동일한 패턴). 이 화면엔 모달이 없어서 별다른 guard 없이 바로 새로고침합니다.
	   감사로그(STOCK_CHANGE_LOG)는 재고 직접수정/삭제/복원(auditLog)에서만 생기므로
	   그 종류만 구독합니다.
	   ============================================================ */
	connectRealtimeRefresh(loadData, ["auditLog"]);
	setInterval(loadData, 5000);

</script>

</body>
</html>

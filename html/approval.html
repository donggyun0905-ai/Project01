<!DOCTYPE html> <!-- 자동 제안 및 승인 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>자동 제안 및 승인</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--approval css -->
	<link rel="stylesheet" href="../css/approval.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a class="active" href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='setting.html'">사용자 관리</button> 
			<button class="menu-btn active">자동 제안 및 승인</button> 
			<button class="menu-btn" onclick="location.href='roles.html'">권한 관리</button>
		</header>
		
		<!-- 거르기 -->
		<section class="form-box">
			<div class="form-group">
				<label>상태</label>
				<select id="fStatus" onchange="changeFilter()">
					<option>대기</option>
					<option>전체</option>
					<option>승인</option>
					<option>반려</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>유형</label>
				<select id="fType" onchange="changeFilter()">
					<option>전체</option>
					<option>발주</option>
					<option>출고</option>
				</select>
			</div>
			
			<button class="register-btn" onclick="openNew()">승인 요청 등록</button>
		</section>

		<!-- "승인 요청" / "창고 정리 추천"을 눌러서 바꿔 보는 탭입니다 (출고 등록 화면과 같은 방식).
		     창고정리추천은 발주/출고와 달리 대기/승인 상태가 있는 "요청"이 아니라 바로 실행하는
		     조치라서 표 구성 자체는 다르지만, switchTab()이 같은 표 영역 안에서 둘을 바꿔 보여줍니다. -->
		<section class="table-box">
		<div class="table-tabs">
			<button class="tab-btn active" id="tabRequestBtn" onclick="switchTab('request')">승인 요청</button>
			<button class="tab-btn" id="tabConsolBtn" onclick="switchTab('consol')">창고 정리 추천</button>
		</div>

			<table id="requestTable">
				<thead>
					<tr>
						<th>품목</th>
						<th>유형</th>
						<th>요청 수량</th>
						<th>요청자</th>
						<th>상태</th>
						<th>관리</th>
					</tr>
				</thead>

				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="apBody">
				</tbody>
			</table>

			<table id="consolTable" style="display:none;">
				<thead>
					<tr>
						<th>품목</th>
						<th>이동 내용</th>
						<th>조치</th>
					</tr>
				</thead>
				<tbody id="consolBody"></tbody>
			</table>

			<!-- 쪽 번호 - 창고정리추천은 페이지 나눔이 없어서 승인 요청 탭에서만 보입니다 -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>

<!-- 상세보기 모달 -->
<div class="modal-overlay" id="apModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="apTitle">승인 요청</h3>
			<button class="modal-close" onclick="closeDetail()"> x </button>
		</div>
		
		<section class="alert-form">
			<div class="alert-form-group">
				<label>품목명</label>
				<span id="apItem"></span>
			</div>
			
			<div class="alert-form-group">
				<label>요청 유형</label>
				<span id="apType"></span>
			</div>
			
			<div class="alert-form-group">
				<label>요청 수량</label>
				<span id="apQty"></span>
			</div>
			
			<div class="alert-form-group">
				<label>거래처</label>
				<span id="apPartner"></span>
			</div>
			
			<div class="alert-form-group">
				<label>요청자</label>
				<span id="apWho"></span>
			</div>
		
			<div class="alert-form-group">
				<label>상태</label>
				<span id="apStatus"></span>
			</div>
			
			<div class="alert-form-group">
				<label>승인 처리자</label>
				<span id="apBy"></span>
			</div>
			
			<div class="alert-form-group">
				<label>승인 처리일</label>
				<span id="apDate"></span>
			</div>
	
		</section>
		<div class="modal-footer">
			<button class="btn-cancel" id="rejectBtn" onclick="doDecide('반려')">반려</button>
			<button class="btn-primary" id="approveBtn" onclick="doDecide('승인')">승인</button>
		</div>
		
	</div>
</div>




<!-- 승인 요청 등록 모달 -->
<div class="modal-overlay" id="newModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>승인 요청 등록</h3>
			<button class="modal-close" onclick="closeNew()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>요청 유형</label>
				<select id="nType" onchange="changeNewType()">
					<option>발주</option>
					<option>출고</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>품목명</label>
				<input type="text" id="nName" list="itemList" placeholder="예: 두부">
				<datalist id="itemList"></datalist>
			</div>
			
			<div class="form-group">
				<label>요청 수량</label>
				<input type="number" id="nQty">
			</div>
			
			<div class="form-group">
				<label id="nPartnerLabel">거래처</label>
				<select id="nPartner">
				</select>
			</div>
		</section>
		
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeNew()">취소</button>
			<button class="btn-primary" onclick="saveNew()">요청 등록</button>
		</div>
	</div>
</div>

<script>

	/* ============================================================
	   자동 제안 및 승인 - 서버 연동

	   재고가 임계치 아래로 떨어지면 서버가 발주 요청을 자동으로 만듭니다.
	   그런 건 요청자가 비어 있어서 "자동 제안" 으로 보여 줍니다.

	   승인하면 서버가 실제로 입고나 출고를 실행합니다.
	   그래서 승인·반려는 관리자(ADMIN)만 할 수 있습니다.
	   ============================================================ */

	let apIds = [];
	let apItemIds = [];
	let apTypes = [];
	let apQtys = [];
	let apPartnerIds = [];
	let apRequesters = [];
	let apStatus = [];
	let apTimes = [];

	let nowPage = 1;
	let totalCount = 0;
	let openIndex = -1;
	let nowTab = "request";


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {
		fillItemList("#itemList");
		changeNewType();
		loadData();
		loadConsolidationAlerts();
	}


	/* ============================================================
	   목록 받아오기  (GET /api/approvals)
	   ============================================================ */
	function loadData() {

		let path = "/api/approvals?page=" + nowPage + "&size=" + pageSize;
		let status = document.querySelector("#fStatus").value;

		/* 상태는 서버가 걸러 줍니다 */
		if (status != "전체") {
			path = path + "&status=" + encodeURIComponent(status);
		}

		apiGet(path, putApprovals);
	}


	function putApprovals(data) {

		let list = data.items;
		totalCount = data.total;

		apIds = [];
		apItemIds = [];
		apTypes = [];
		apQtys = [];
		apPartnerIds = [];
		apRequesters = [];
		apStatus = [];
		apTimes = [];

		for (let i = 0; i < list.length; i++) {

			apIds[i] = list[i].approvalId;
			apItemIds[i] = list[i].itemId;
			apTypes[i] = list[i].requestType;
			apQtys[i] = list[i].requestedQty;
			apPartnerIds[i] = list[i].partnerId;
			apStatus[i] = list[i].status;

			/* 요청자가 비어 있으면 서버가 자동으로 만든 요청입니다 */
			if (list[i].requestedBy == null) {
				apRequesters[i] = "자동 제안";
			} else {
				apRequesters[i] = "사용자 " + list[i].requestedBy;
			}

			let t = list[i].requestedAt;

			if (t == null) {
				t = "";
			} else {
				t = t.replace("T", " ");
				if (t.length > 16) {
					t = t.substring(0, 16);
				}
			}
			apTimes[i] = t;
		}

		drawList();
	}


	/* 유형 거르기는 서버에 없는 조건이라 화면에서 걸러 냅니다 */
	function getList() {

		let type = document.querySelector("#fType").value;
		let result = [];

		for (let i = 0; i < apIds.length; i++) {

			if (type != "전체" && apTypes[i] != type) {
				continue;
			}

			result[result.length] = i;
		}

		return result;
	}


	function drawList() {

		let list = getList();
		let html = "";

		if (list.length == 0) {
			document.querySelector("#apBody").innerHTML = "<tr><td colspan='6'>조건에 맞는 요청이 없습니다.</td></tr>";
			drawPaging("#paging", totalCount, nowPage, "goPage");
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];

			html = html + "<tr>";
			html = html + "<td>" + findItemName(apItemIds[i]) + "</td>";
			html = html + "<td>" + apTypes[i] + "</td>";
			html = html + "<td>" + addComma(apQtys[i]) + findItemUnit(apItemIds[i]) + "</td>";
			html = html + "<td>" + apRequesters[i] + "</td>";
			html = html + "<td>" + apStatus[i] + "</td>";
			html = html + "<td><button class='approval-btn' onclick='openDetail(" + i + ")'>상세보기</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#apBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadData();
	}


	/* 거르기를 바꾸면 1쪽부터 다시 봅니다 */
	function changeFilter() {
		nowPage = 1;
		loadData();
	}


	/* ============================================================
	   "승인 요청" / "창고 정리 추천" 탭 전환 (출고 등록 화면과 같은 방식)

	   창고정리추천은 페이지 나눔이 없어서, 탭이 바뀌면 쪽 번호도 같이 보이거나
	   숨겨줍니다. 탭을 누를 때마다 그 탭 데이터를 새로 받아와서 항상 최신으로 봅니다.
	   ============================================================ */
	function switchTab(tab) {

		nowTab = tab;

		document.querySelector("#tabRequestBtn").className = (tab == "request") ? "tab-btn active" : "tab-btn";
		document.querySelector("#tabConsolBtn").className = (tab == "consol") ? "tab-btn active" : "tab-btn";
		document.querySelector("#requestTable").style.display = (tab == "request") ? "" : "none";
		document.querySelector("#consolTable").style.display = (tab == "consol") ? "" : "none";
		document.querySelector("#paging").style.display = (tab == "request") ? "" : "none";

		if (tab == "request") {
			loadData();
		} else {
			loadConsolidationAlerts();
		}
	}


	/* 번호로 이름을 찾습니다 */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	function findItemUnit(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemUnitList[i];
			}
		}
		return "";
	}


	function findPartnerName(partnerId) {

		if (partnerId == null) {
			return "-";
		}

		for (let i = 0; i < supplierIds.length; i++) {
			if (supplierIds[i] == partnerId) {
				return supplierNames[i];
			}
		}
		for (let i = 0; i < customerIds.length; i++) {
			if (customerIds[i] == partnerId) {
				return customerNames[i];
			}
		}
		return "거래처 " + partnerId;
	}


	/* ============================================================
	   상세보기
	   ============================================================ */
	function openDetail(i) {

		openIndex = i;

		document.querySelector("#apTitle").innerHTML = apTypes[i] + " 승인 요청";
		document.querySelector("#apItem").innerHTML = findItemName(apItemIds[i]);
		document.querySelector("#apType").innerHTML = apTypes[i];
		document.querySelector("#apQty").innerHTML = addComma(apQtys[i]) + findItemUnit(apItemIds[i]);
		document.querySelector("#apPartner").innerHTML = findPartnerName(apPartnerIds[i]);
		document.querySelector("#apWho").innerHTML = apRequesters[i];
		document.querySelector("#apStatus").innerHTML = apStatus[i];
		document.querySelector("#apBy").innerHTML = "-";
		document.querySelector("#apDate").innerHTML = apTimes[i];

		/* 이미 처리된 건은 버튼을 막습니다 */
		if (apStatus[i] == "대기") {
			document.querySelector("#approveBtn").disabled = false;
			document.querySelector("#rejectBtn").disabled = false;
		} else {
			document.querySelector("#approveBtn").disabled = true;
			document.querySelector("#rejectBtn").disabled = true;
		}

		openModal("#apModal");
	}


	function closeDetail() {
		closeModal("#apModal");
		openIndex = -1;
	}


	/* ============================================================
	   승인 / 반려  (PATCH /api/approvals/{id})

	   승인하면 서버가 입고나 출고를 실제로 실행합니다.
	   ============================================================ */
	function doDecide(pick) {

		if (openIndex == -1) {
			return;
		}

		let ask = "";

		if (pick == "승인") {
			ask = findItemName(apItemIds[openIndex]) + " " + addComma(apQtys[openIndex]) + findItemUnit(apItemIds[openIndex]);
			ask = ask + " 을 승인할까요?\n\n승인하면 " + apTypes[openIndex] + " 가 바로 처리됩니다.";
		} else {
			ask = "이 요청을 반려할까요?";
		}

		if (confirm(ask) == false) {
			return;
		}

		apiSend("PATCH", "/api/approvals/" + apIds[openIndex], { status: pick }, afterDecide);
	}


	/* 서버가 자동 실행 결과까지 알려 줍니다 */
	function afterDecide(data) {

		let msg = "";

		if (data.status == "반려") {

			msg = "반려했습니다.";

		} else {

			msg = "승인했습니다.";

			if (data.executionFailed == true) {

				/* 승인은 됐는데 자동 실행이 안 된 경우입니다 */
				msg = msg + "\n\n다만 자동 실행에 실패했습니다.\n" + data.executionError;

			} else if (data.executedService == "inbound") {

				msg = msg + "\n입고가 자동으로 처리되었습니다.";

				if (data.resultLotIds != null) {
					msg = msg + " (로트 " + data.resultLotIds.length + "건)";
				}

			} else if (data.executedService == "outbound") {

				msg = msg + "\n출고가 자동으로 처리되었습니다.";
				msg = msg + "\n요청 " + data.requestedQty + " 중 " + data.fulfilledQty + " 처리됨";
			}

			/* 승인 시점에 재고가 부족했으면, 출고를 시도하기 전에 그 부족분을 사람 승인 없이
			   먼저 자동 입고 처리해 둡니다(그 결과는 알림 화면의 '자동입고' 알림에서 볼 수 있음).
			   data.fulfilledQty는 그 자동 입고까지 반영된 뒤 실제로 출고된 최종 값입니다. */
			if (data.shortageApprovalId != null) {
				if (data.fulfilledQty >= data.requestedQty) {
					msg = msg + "\n\n재고가 부족했던 만큼은 승인 없이 자동으로 입고 처리한 뒤 요청한 수량을 " +
						"전부 출고했습니다 (자동 발주 승인번호 " + data.shortageApprovalId + ").";
				} else {
					msg = msg + "\n\n재고가 부족해서 자동으로 입고까지는 처리했지만(자동 발주 승인번호 " +
						data.shortageApprovalId + "), 그래도 " + (data.requestedQty - data.fulfilledQty) +
						"개는 출고하지 못했습니다.";
				}
			}
		}

		closeDetail();
		loadData();
		alert(msg);
	}


	/* ============================================================
	   승인 요청 직접 등록  (POST /api/approvals)
	   ============================================================ */
	function openNew() {
		clearInput(["#nName", "#nQty"]);
		changeNewType();
		openModal("#newModal");
	}


	function closeNew() {
		closeModal("#newModal");
	}


	/* 발주는 공급처, 출고는 고객을 고릅니다 */
	function changeNewType() {

		let type = document.querySelector("#nType").value;

		if (type == "발주") {
			fillPartner("#nPartner", "SUPPLIER");
			document.querySelector("#nPartnerLabel").innerHTML = "공급처";
		} else {
			fillPartner("#nPartner", "CUSTOMER");
			document.querySelector("#nPartnerLabel").innerHTML = "목적지 거래처";
		}
	}


	function saveNew() {

		if (isBlank(["#nName", "#nQty"]) == true) {
			alert("품목명과 요청 수량을 채워 주세요.");
			return;
		}

		let itemId = getItemId(document.querySelector("#nName").value);

		if (itemId == -1) {
			alert("등록되지 않은 품목입니다.\n후보 목록에서 골라 주세요.");
			return;
		}

		let qty = document.querySelector("#nQty").value * 1;

		if (qty <= 0) {
			alert("요청 수량은 1개 이상이어야 합니다.");
			return;
		}

		let body = {
			itemId: itemId,
			requestType: document.querySelector("#nType").value,
			requestedQty: qty,
			partnerId: getSelectValue("#nPartner") * 1
		};

		apiSend("POST", "/api/approvals", body, afterNew);
	}


	function afterNew(data) {
		closeNew();
		nowPage = 1;
		loadData();
		alert("승인 요청이 등록되었습니다. (요청번호 " + data.approvalId + ")");
	}


	/* ============================================================
	   창고정리추천 - 목록 받아오기 및 이동 실행

	   창고정리추천은 발주/출고와 달리 APPROVAL 테이블에 안 들어가고
	   ALERT로만 존재합니다(승인/반려 개념이 없이 "바로 실행"만 하면
	   되는 조치라서). 그래서 GET /api/approvals가 아니라
	   GET /api/alerts에서 이 종류만 걸러서 따로 보여 줍니다.
	   ============================================================ */

	let consolAlertIds = [];
	let consolItemIds = [];
	let consolMoves = [];

	/* 미해결 알림이 200건을 넘을 수도 있어서, 다른 화면들과 같은
	   이어받기 패턴으로 1페이지를 받아본 뒤 모자라면 2페이지도 받습니다. */
	function loadConsolidationAlerts() {
		consolAlertIds = [];
		consolItemIds = [];
		consolMoves = [];
		apiGet(consolAlertPagePath(1), putConsolidationAlerts1);
	}

	function consolAlertPagePath(page) {
		return "/api/alerts?resolved=false&page=" + page + "&size=200";
	}

	function putConsolidationAlerts1(data) {

		addConsolidationAlerts(data.items);

		if (data.total > 200) {
			apiGet(consolAlertPagePath(2), putConsolidationAlerts2);
		} else {
			drawConsolidationList();
		}
	}

	function putConsolidationAlerts2(data) {
		addConsolidationAlerts(data.items);
		drawConsolidationList();
	}

	function addConsolidationAlerts(list) {

		for (let i = 0; i < list.length; i++) {

			if (list[i].alertType != "창고정리추천") {
				continue;
			}

			let move = parseConsolidationMessage(list[i].message);
			if (move == null) {
				continue;
			}

			let last = consolAlertIds.length;
			consolAlertIds[last] = list[i].alertId;
			consolItemIds[last] = list[i].itemId;
			consolMoves[last] = move;
		}
	}

	/* 알림 메시지 안의 "대형(0) EA[zoneId=3](수량 12, 점유율 40%)를 대형(1) EA[zoneId=7]로"
	   부분을 읽어냅니다. WarehouseConsolidationService가 만드는 메시지 형식이 고정돼 있어서
	   이 방식이 안전합니다. (구 형식 "zoneId=3(수량 12, 점유율 40%)를 zoneId=7로"로 만들어진
	   알림이 아직 처리 안 된 채 남아있을 수 있어 그것도 같이 읽습니다) */
	function parseConsolidationMessage(msg) {
		if (msg == null) {
			return null;
		}
		let m = msg.match(/\[zoneId=(\d+)\]\(수량 (\d+), 점유율 \d+%\).*?\[zoneId=(\d+)\]로/);
		if (m == null) {
			m = msg.match(/zoneId=(\d+)\(수량 (\d+), 점유율 \d+%\)를 zoneId=(\d+)로/);
		}
		if (m == null) {
			return null;
		}
		return { fromZoneId: m[1] * 1, quantity: m[2] * 1, toZoneId: m[3] * 1 };
	}

	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 (item.html의 findZoneName과 같은 방식) */
	function zoneLabel(zoneId) {
		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {
				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}

	function drawConsolidationList() {

		/* 탭을 아직 안 눌러도 대기 건수를 알 수 있게, 탭 버튼에 개수를 같이 보여줍니다 */
		let tabBtn = document.querySelector("#tabConsolBtn");
		if (consolAlertIds.length == 0) {
			tabBtn.innerHTML = "창고 정리 추천";
		} else {
			tabBtn.innerHTML = "창고 정리 추천 (" + consolAlertIds.length + ")";
		}

		if (consolAlertIds.length == 0) {
			document.querySelector("#consolBody").innerHTML = "<tr><td colspan='3'>정리할 항목이 없습니다.</td></tr>";
			return;
		}

		let html = "";

		for (let i = 0; i < consolAlertIds.length; i++) {

			let move = consolMoves[i];

			html = html + "<tr>";
			html = html + "<td>" + findItemName(consolItemIds[i]) + "</td>";
			html = html + "<td>" + zoneLabel(move.fromZoneId) + " → " + zoneLabel(move.toZoneId)
			            + " (" + addComma(move.quantity) + findItemUnit(consolItemIds[i]) + ")</td>";
			html = html + "<td><button class='approval-btn' onclick='doExecuteConsolidation(" + i + ")'>지금 실행</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#consolBody").innerHTML = html;
	}

	/* 그 구역에 있는 이 품목 로트를 전부(각 로트의 지금 수량 그대로) 목적지로 옮깁니다.
	   알림에 적힌 추천 수량이 아니라 "지금 실제로 그 구역에 있는 만큼"을 기준으로 삼아야
	   구역이 완전히 비워집니다. 로트가 여러 개면 한 건씩 순서대로 옮깁니다. */
	let moveLotIds = [];
	let moveLotQtys = [];
	let moveIndex = 0;
	let moveFromZoneId = null;
	let moveToZoneId = null;
	let moveAlertId = null;
	let moveItemId = null;

	function doExecuteConsolidation(i) {

		let move = consolMoves[i];

		let ask = zoneLabel(move.fromZoneId) + " → " + zoneLabel(move.toZoneId) + "로 "
		        + addComma(move.quantity) + "개를 지금 옮길까요?";

		if (confirm(ask) == false) {
			return;
		}

		moveFromZoneId = move.fromZoneId;
		moveToZoneId = move.toZoneId;
		moveAlertId = consolAlertIds[i];
		moveItemId = consolItemIds[i];

		apiGet("/api/stock-lots?itemId=" + moveItemId + "&zoneId=" + move.fromZoneId
		     + "&status=NORMAL&size=200", putMoveLots);
	}

	function putMoveLots(data) {

		moveLotIds = [];
		moveLotQtys = [];

		for (let k = 0; k < data.items.length; k++) {

			/* 남은 수량이 없는 로트는 옮길 게 없으니 건너뜁니다 */
			if (data.items[k].quantity <= 0) {
				continue;
			}

			moveLotIds[moveLotIds.length] = data.items[k].lotId;
			moveLotQtys[moveLotQtys.length] = data.items[k].quantity;
		}

		/* 그 사이 재고가 이미 다 빠졌으면 옮길 것 없이 알림만 정리합니다 */
		if (moveLotIds.length == 0) {
			finishConsolidation();
			return;
		}

		moveIndex = 0;
		sendOneMove();
	}

	function sendOneMove() {

		/* 로트를 다 처리했으면 마무리합니다 */
		if (moveIndex >= moveLotIds.length) {
			finishConsolidation();
			return;
		}

		let body = {
			lotId: moveLotIds[moveIndex],
			fromZoneId: moveFromZoneId,
			toZoneId: moveToZoneId,
			quantity: moveLotQtys[moveIndex],
			handlerId: sessionStorage.getItem("userId") * 1
		};

		apiSend("POST", "/api/transfers", body, afterOneMove, failOneMove);
	}

	function afterOneMove(data) {
		moveIndex = moveIndex + 1;
		sendOneMove();
	}

	/* 한 로트가 실패해도(예: 그 사이 구역이 꽉 참) 나머지는 계속 옮겨 봅니다 */
	function failOneMove(message) {
		alert("일부는 옮기지 못했습니다: " + message + "\n나머지는 창고 간 재고 이동 화면에서 직접 처리해 주세요.");
		moveIndex = moveIndex + 1;
		sendOneMove();
	}

	function finishConsolidation() {
		apiSend("PATCH", "/api/alerts/" + moveAlertId + "/resolve", null, afterConsolidationResolve);
	}

	function afterConsolidationResolve(data) {
		loadConsolidationAlerts();
		alert("창고 정리 이동을 완료했습니다.");
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 바로 다시 받아오고, 연결이 끊기거나 신호를 놓쳐도
	   5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다(alert.html과
	   동일한 패턴). 승인 상세/신규 요청 모달을 보고 있는 중에는 그 내용이
	   갑자기 바뀌면 안 되니 건너뜁니다.
	   ============================================================ */
	function refreshIfIdle() {
		let apModal = document.querySelector("#apModal");
		let newModal = document.querySelector("#newModal");
		let modalOpen = apModal.className.indexOf("active") != -1 || newModal.className.indexOf("active") != -1;
		if (modalOpen == false) {
			loadData();
			loadConsolidationAlerts();
		}
	}

	/* 승인 자체("approval")뿐 아니라, 승인 대기중인 발주 요청이 새로 생기는 계기인
	   출고/반품폐기("outbound"/"disposal")와, 창고정리추천을 여기서 해결 처리할 수도
	   있으니 "alert"도 같이 구독합니다. */
	connectRealtimeRefresh(refreshIfIdle, ["approval", "alert", "outbound", "disposal"]);
	setInterval(refreshIfIdle, 5000);

</script>
</body>
</html>

<!DOCTYPE html> <!-- 자동 제안 및 승인 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>자동 제안 및 승인</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--approval css -->
	<link rel="stylesheet" href="../css/approval.css">
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
			<a>입출고 관리</a>
			<a>반품 및 폐기 관리</a>
			<a>알림</a>
			<a>통계</a>
			<a class="active">설정 및 권한 관리</a>
		</nav>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn">사용자 관리</button> 
			<button class="menu-btn active">자동 제안 및 승인</button> 
			<button class="menu-btn">권한 관리</button>
		</header>
		
		<!-- (표)  -->
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>품목</th>
						<th>유형</th> 
						<th>요청 수량</th> 
						<th>요청자</th>
						<th>상태</th>
						<th>관리</th>
					</tr>				
				</thead>
				
				<tbody> 
					<tr>
						<td>품목1</td>
						<td>발주</td>
						<td>100EA</td>
						<td>자동제안</td>
						<td>대기</td>
						<td>
							<button class="approval-btn">상세보기</button>
						</td>
					</tr>
					
					<tr>
						<td>품목2</td>
						<td>출고</td>
						<td>230EA</td>
						<td>김철수</td>
						<td>승인</td>
						<td>
							<button class="approval-btn">상세보기</button>
						</td>
					</tr>
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

<!-- 상세보기 모달 -->
<div class = "modal-overlay" id="recommendModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>발주 승인 요청</h3>
			<button class = "modal-close"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>품목명</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>요청 유형</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>요청 수량</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>요청자</label>
				<input type= "text">
			</div>
		
			<div class="form-group">
				<label>상태</label>
					<select>
					<option>대기</option>
					<option>승인</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>승인 처리자</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>승인 처리일</label>
				<input type= "text">
			</div>
	
		</section>
		<div class="modal-footer">
					<button class= "btn-cancel">반려</button>
					<button class= "btn-primary">승인</button>
				</div>
		
	</div>
</div>
</body>


</html>

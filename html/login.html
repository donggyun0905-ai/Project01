<!DOCTYPE html> <!-- 로그인 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>로그인</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--login css -->
	<link rel="stylesheet" href="../css/login.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
</head>


<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	<main>
		<div class="logo">
			<img src="../images/martlogo.png" alt="DOWN MART">
		</div>
		<h1 class= "page-title">DOWN MART</h1>
		<div class="form-group"	>
			<label>아이디</label>
			<input type="text" id="loginId">
		</div>
		<div class="form-group"	>
			<label>비밀번호</label>
			<input type="password" id="loginPw" onkeyup="pressEnter(event)">
		</div>
		
		<div class="form-group">
			<div class="button-area">
				<button class="register-btn1" onclick="doLogin()">로그인</button>
			</div>
		</div>	
		
	</main>
	
	</div>


<!-- ============================================================
     로그인 화면 로직
     ------------------------------------------------------------
     /api/login 은 이미 서버에 만들어져 있습니다.
     로그인에 성공하면 세션 쿠키(JSESSIONID)가 생기고,
     다른 화면에서 서버를 부를 수 있게 됩니다.
     ============================================================ -->
<script>

	/* 로그인 버튼 */
	function doLogin() {

		let id = document.querySelector("#loginId").value;
		let pw = document.querySelector("#loginPw").value;

		if (id == "" || pw == "") {
			alert("아이디와 비밀번호를 입력해 주세요.");
			return;
		}

		apiSend("POST", "/api/login", { username: id, password: pw }, afterLogin, failLogin);
	}


	/* 로그인 성공 - 서버가 준 정보를 저장해 두고 첫 화면으로 갑니다 */
	function afterLogin(data) {

		/* 다른 화면에서 "누가 로그인했는지" 쓸 수 있게 남겨 둡니다.
		   sessionStorage 는 브라우저 탭을 닫으면 지워집니다. */
		sessionStorage.setItem("userId", data.userId);
		sessionStorage.setItem("userName", data.name);
		sessionStorage.setItem("userRole", data.role);

		location.href = "item.html";
	}


	/* 로그인 실패 - 서버가 준 안내문을 그대로 보여 줍니다 */
	function failLogin(message) {
		alert(message);
		document.querySelector("#loginPw").value = "";
	}


	/* 비밀번호 칸에서 엔터를 눌러도 로그인되게 합니다 */
	function pressEnter(e) {
		if (e.keyCode == 13) {
			doLogin();
		}
	}

</script>

</body>



</html>

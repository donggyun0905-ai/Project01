<!-- ============================================================
     창고 / 구역 관리 화면 로직
     ------------------------------------------------------------
     왼쪽 창고를 고르면 그 창고에 속한 구역만 아래에 보입니다.
     구역명은 PALLET / BOX / EA 중 하나여야 합니다.
     품목 단위와 구역 이름이 같아야 입고가 되기 때문입니다.
     ============================================================ -->
<script>

	/* ============================================================
	   창고 / 구역 관리 - 서버 연동

	   왼쪽 창고를 고르면 아래에 그 창고의 구역만 보입니다.
	   현재 사용량은 재고 로트를 세어서 계산합니다.
	   등록·수정·삭제는 관리자(ADMIN)만 할 수 있습니다.
	   ============================================================ */

	/* 창고 */
	let whIds = [];
	let whNames = [];
	let whLocations = [];

	/* 구역 */
	let znIds = [];
	let znWhIds = [];
	let znNames = [];
	let znCapacities = [];
	let znUsed = [];

	/* 지금 고른 창고, 수정 중인 줄 번호 (-1 이면 새로 등록) */
	let pickedWh = 0;
	let editWh = -1;
	let editZn = -1;


	function startUp() {
		loadData();

		/* 구역 재고 상세 모달에서 품목명을 보여주려고 미리 받아 둡니다 */
		loadItemsForZoneStock();
	}


	/* ============================================================
	   구역 재고 상세용 품목 목록 미리 받아오기

	   품목이 250개라 서버가 한 번에 200개까지만 주기 때문에
	   두 번 나눠서 받습니다 (alert.html의 loadItems와 같은 방식).
	   ============================================================ */
	function loadItemsForZoneStock() {
		apiGet("/api/items?page=1&size=200", putItemsForZoneStock1);
	}

	function putItemsForZoneStock1(data) {

		itemCodes = [];
		itemNameList = [];

		addItemsForZoneStock(data.items);

		if (data.total > 200) {
			apiGet("/api/items?page=2&size=200", putItemsForZoneStock2);
		}
	}

	function putItemsForZoneStock2(data) {
		addItemsForZoneStock(data.items);
	}

	function addItemsForZoneStock(list) {

		for (let i = 0; i < list.length; i++) {
			let last = itemCodes.length;
			itemCodes[last] = "ITEM-" + list[i].itemId;
			itemNameList[last] = list[i].itemName;
		}
	}

	/* 품목 번호로 이름을 찾습니다 */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	/* ============================================================
	   창고와 구역을 서버에서 받아옵니다
	   ============================================================ */
	function loadData() {
		apiGet("/api/warehouses?size=200", putWarehouses);
	}


	function putWarehouses(data) {

		whIds = [];
		whNames = [];
		whLocations = [];

		for (let i = 0; i < data.items.length; i++) {
			whIds[i] = data.items[i].warehouseId;
			whNames[i] = data.items[i].name;
			whLocations[i] = data.items[i].location;
		}

		/* 고른 창고가 없으면 첫 번째 창고를 봅니다 */
		if (pickedWh == 0 && whIds.length > 0) {
			pickedWh = whIds[0];
		}

		apiGet("/api/zones?size=200", putZones);
	}


	/* 사용량(znUsed)은 서버가 zone마다 이미 계산해서 내려주는 usedQuantity를 그대로 씁니다.
	   예전엔 /api/stock-lots를 통째로 받아 여기서 직접 더했는데, 그건 200개씩 페이지네이션
	   되다 보니 재고가 400개(2페이지)를 넘으면 뒤쪽이 조용히 빠져서 사용량이 실제보다
	   적게 나오는 문제가 있었습니다. */
	function putZones(data) {

		znIds = [];
		znWhIds = [];
		znNames = [];
		znCapacities = [];
		znUsed = [];

		for (let i = 0; i < data.items.length; i++) {
			znIds[i] = data.items[i].zoneId;
			znWhIds[i] = data.items[i].warehouseId;
			znNames[i] = data.items[i].zoneName;
			znCapacities[i] = data.items[i].capacity;
			znUsed[i] = data.items[i].usedQuantity;
		}

		drawWarehouse();
		drawZone();
	}


	/* ============================================================
	   창고 표
	   ============================================================ */
	function drawWarehouse() {

		let html = "";

		if (whIds.length == 0) {
			document.querySelector("#whBody").innerHTML = "<tr><td colspan='4'>등록된 창고가 없습니다.</td></tr>";
			return;
		}

		for (let i = 0; i < whIds.length; i++) {

			/* 지금 고른 창고는 줄 전체를 다른 색으로 표시합니다 */
			let rowClass = "";

			if (whIds[i] == pickedWh) {
				rowClass = " class='row-picked'";
			}

			/* 이 창고에 구역이 몇 개인지 함께 보여 줍니다 */
			let zoneCount = 0;

			for (let k = 0; k < znIds.length; k++) {
				if (znWhIds[k] == whIds[i]) {
					zoneCount = zoneCount + 1;
				}
			}

			html = html + "<tr" + rowClass + " onclick='pickWarehouse(" + whIds[i] + ")'>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>" + whNames[i] + "</td>";
			html = html + "<td>" + whLocations[i] + " (구역 " + zoneCount + "개)</td>";
			html = html + "<td>";
			html = html + "<button class='edit-btn' onclick='openWarehouse(" + i + ")'>수정</button>";
			html = html + "<button class='delete-btn' onclick='deleteWarehouse(" + i + ")'>삭제</button>";
			html = html + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#whBody").innerHTML = html;
	}


	function pickWarehouse(id) {
		pickedWh = id;
		drawWarehouse();
		drawZone();
	}


	/* ============================================================
	   구역 표
	   ============================================================ */
	function drawZone() {

		/* 지금 어느 창고를 보고 있는지 제목에 적어 줍니다 */
		let whName = "";

		for (let i = 0; i < whIds.length; i++) {
			if (whIds[i] == pickedWh) {
				whName = whNames[i] + " " + whLocations[i] + "번 창고";
			}
		}

		if (whName == "") {
			document.querySelector("#zoneTitle").innerHTML = "구역 목록";
		} else {
			document.querySelector("#zoneTitle").innerHTML = "구역 목록 — " + whName;
		}

		let html = "";
		let count = 0;

		for (let i = 0; i < znIds.length; i++) {

			if (znWhIds[i] != pickedWh) {
				continue;
			}

			count = count + 1;

			/* 구역 이름만으로는 무엇을 담는 곳인지 알기 어려워 설명을 붙입니다 */
			let zoneText = znNames[i];

			if (znNames[i] == "PALLET") {
				zoneText = "PALLET (팔레트)";
			} else if (znNames[i] == "BOX") {
				zoneText = "BOX (박스)";
			} else if (znNames[i] == "EA") {
				zoneText = "EA (낱개)";
			}

			/* 얼마나 찼는지 함께 보여 줍니다.
			   90%를 넘으면 곧 자리가 없다는 뜻이라 눈에 띄게 표시합니다 (명세서 F-04).
			   용량을 정해두지 않은 구역은 포화도를 계산하지 않습니다. */
			/* 개수 + 퍼센트 배지 + 작은 막대바로 한눈에 들어오게 구성합니다. */
			let usedCell;

			if (znCapacities[i] > 0) {

				let percent = Math.round(znUsed[i] / znCapacities[i] * 100);
				let level = "";
				let badgeText = percent + "%";

				if (percent >= 90) {
					level = " zone-full";
					badgeText = badgeText + " 포화";
				} else if (percent >= 70) {
					level = " zone-warn";
				}

				usedCell = "<div class='zn-usage-cell'>"
					+ "<div class='zn-usage-top'>"
					+ "<span class='zn-usage-count'>" + addComma(znUsed[i]) + "</span>"
					+ "<span class='zn-usage-badge" + level + "'>" + badgeText + "</span>"
					+ "</div>"
					+ "<div class='zn-usage-bar'><div class='zn-usage-bar-fill" + level + "' style='width:" + Math.min(percent, 100) + "%'></div></div>"
					+ "</div>";

			} else {
				usedCell = "<div class='zn-usage-cell'>"
					+ "<span class='zn-usage-count'>" + addComma(znUsed[i]) + "</span>"
					+ "<span class='zn-usage-unset'>용량 미설정</span>"
					+ "</div>";
			}

			/* 재고가 있는 구역은 줄 전체를 눌러서 상세(로트별 품목·수량)를 볼 수 있습니다.
			   안의 수정/삭제 버튼을 누를 때는 상세 모달이 같이 뜨지 않게 막습니다. */
			let rowOnclick = "";
			let rowStyle = "";

			if (znUsed[i] > 0) {
				rowOnclick = " onclick='openZoneStock(" + i + ")'";
				rowStyle = " class='row-clickable'";
			}

			html = html + "<tr" + rowStyle + rowOnclick + ">";
			html = html + "<td>" + count + "</td>";
			html = html + "<td>" + zoneText + "</td>";
			html = html + "<td>" + addComma(znCapacities[i]) + "</td>";
			html = html + "<td>" + usedCell + "</td>";
			html = html + "<td onclick='event.stopPropagation()'>";
			html = html + "<div class='action-buttons'>";
			html = html + "<button class='edit-btn' onclick='openZone(" + i + ")'>수정</button>";
			html = html + "<button class='delete-btn' onclick='deleteZone(" + i + ")'>삭제</button>";
			html = html + "</div>";
			html = html + "</td>";
			html = html + "</tr>";
		}

		if (count == 0) {
			html = "<tr><td colspan='5'>이 창고에 등록된 구역이 없습니다.</td></tr>";
		}

		document.querySelector("#znBody").innerHTML = html;

		/* 90%를 넘은 구역이 몇 개인지 표 위에 알려 줍니다 */
		let full = 0;

		for (let i = 0; i < znIds.length; i++) {
			if (znWhIds[i] == pickedWh && znCapacities[i] > 0) {
				if (znUsed[i] / znCapacities[i] * 100 >= 90) {
					full = full + 1;
				}
			}
		}

		let note = document.querySelector("#zoneNote");

		if (note != null) {
			if (full > 0) {
				note.innerHTML = "<span class='zone-full'>포화도 90%를 넘은 구역이 " + full + "곳 있습니다. 재고를 옮기거나 정리해 주세요.</span>";
			} else {
				note.innerHTML = "";
			}
		}
	}


	/* ============================================================
	   구역 재고 상세  (GET /api/stock-lots?zoneId=)

	   이 구역에 지금 어떤 로트가, 얼마나 들어있는지 보여 줍니다.
	   ============================================================ */
	let znStockIndex = -1;

	function openZoneStock(index) {

		znStockIndex = index;

		/* 창고명까지 같이 보여줘서 어느 구역인지 헷갈리지 않게 합니다 */
		let whLabel = "";

		for (let k = 0; k < whIds.length; k++) {
			if (whIds[k] == znWhIds[index]) {
				whLabel = whNames[k] + "(" + whLocations[k] + ") ";
			}
		}

		document.querySelector("#znStockTitle").innerHTML = whLabel + znNames[index] + " 구역 재고 상세";
		document.querySelector("#znStockTotalText").innerHTML =
			addComma(znUsed[index]) + " / " + addComma(znCapacities[index]);

		/* 사용률 막대바 - 90% 이상 빨강, 70% 이상 주황, 그 밑은 초록 */
		let percentText = document.querySelector("#znStockPercentText");
		let barFill = document.querySelector("#znStockBarFill");

		if (znCapacities[index] > 0) {

			let percent = Math.round(znUsed[index] / znCapacities[index] * 100);
			percentText.innerHTML = percent + "%";
			barFill.style.width = Math.min(percent, 100) + "%";

			barFill.className = "zn-stock-bar-fill";
			percentText.className = "";

			if (percent >= 90) {
				barFill.className = barFill.className + " bar-full";
				percentText.className = "zone-full";
			} else if (percent >= 70) {
				barFill.className = barFill.className + " bar-warn";
				percentText.className = "zone-warn";
			}

		} else {
			percentText.innerHTML = "용량 미설정";
			barFill.style.width = "0%";
		}

		document.querySelector("#znStockBody").innerHTML = "<tr><td colspan='3'>불러오는 중...</td></tr>";

		openModal("#znStockModal");

		apiGet("/api/stock-lots?zoneId=" + znIds[index] + "&status=NORMAL&size=200", putZoneStock);
	}

	/* 로트별로 한 줄씩 보여주면 로트가 쌓일수록 표가 한없이 길어져서,
	   같은 품목의 로트는 합쳐서 품목당 한 줄(로트 수 + 합계 수량)로 보여줍니다. */
	function putZoneStock(data) {

		let list = data.items;

		let sumItemIds = [];
		let sumLotCounts = [];
		let sumQtys = [];

		for (let i = 0; i < list.length; i++) {

			/* 남은 수량이 없는 로트는 합칠 필요가 없습니다 */
			if (list[i].quantity <= 0) {
				continue;
			}

			let k = -1;

			for (let n = 0; n < sumItemIds.length; n++) {
				if (sumItemIds[n] == list[i].itemId) {
					k = n;
				}
			}

			if (k == -1) {
				k = sumItemIds.length;
				sumItemIds[k] = list[i].itemId;
				sumLotCounts[k] = 0;
				sumQtys[k] = 0;
			}

			sumLotCounts[k] = sumLotCounts[k] + 1;
			sumQtys[k] = sumQtys[k] + list[i].quantity;
		}

		let html = "";

		for (let i = 0; i < sumItemIds.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + findItemName(sumItemIds[i]) + "</td>";
			html = html + "<td>" + sumLotCounts[i] + "개 로트</td>";
			html = html + "<td class='lot-qty'>" + addComma(sumQtys[i]) + "</td>";
			html = html + "</tr>";
		}

		if (html == "") {
			html = "<tr><td colspan='3'>남아 있는 재고가 없습니다.</td></tr>";
		}

		document.querySelector("#znStockBody").innerHTML = html;
	}

	function closeZoneStock() {
		closeModal("#znStockModal");
		znStockIndex = -1;
	}


	/* ============================================================
	   창고 등록 / 수정  (POST, PUT /api/warehouses)
	   ============================================================ */
	function openWarehouse(index) {

		editWh = index;

		if (index == -1) {
			document.querySelector("#whTitle").innerHTML = "창고 등록";
			clearInput(["#whName", "#whLocation"]);
		} else {
			document.querySelector("#whTitle").innerHTML = "창고 수정";
			document.querySelector("#whName").value = whNames[index];
			document.querySelector("#whLocation").value = whLocations[index];
		}

		openModal("#whModal");
	}


	function saveWarehouse() {

		if (isBlank(["#whName", "#whLocation"]) == true) {
			alert("창고명과 위치를 채워 주세요.");
			return;
		}

		let body = {
			name: document.querySelector("#whName").value,
			location: document.querySelector("#whLocation").value
		};

		if (editWh == -1) {
			apiSend("POST", "/api/warehouses", body, afterSave);
		} else {
			apiSend("PUT", "/api/warehouses/" + whIds[editWh], body, afterSave);
		}
	}


	function deleteWarehouse(index) {

		/* 구역이 남아 있으면 지울 수 없습니다.
		   구역이 창고를 참조하고 있어서 서버에서도 막힙니다. */
		for (let i = 0; i < znIds.length; i++) {
			if (znWhIds[i] == whIds[index]) {
				alert("이 창고에 구역이 남아 있어 삭제할 수 없습니다.\n구역을 먼저 지워 주세요.");
				return;
			}
		}

		if (confirm("창고 " + whNames[index] + "(" + whLocations[index] + ") 을 삭제할까요?") == false) {
			return;
		}

		apiSend("DELETE", "/api/warehouses/" + whIds[index], null, afterSave);
	}


	/* ============================================================
	   구역 등록 / 수정  (POST, PUT /api/zones)
	   ============================================================ */
	function openZone(index) {

		editZn = index;

		/* 창고 드롭다운을 지금 목록으로 채웁니다 */
		let html = "";

		for (let i = 0; i < whIds.length; i++) {
			html = html + "<option value='" + whIds[i] + "'>" + whNames[i] + "(" + whLocations[i] + ")</option>";
		}

		document.querySelector("#znWarehouse").innerHTML = html;

		if (index == -1) {
			document.querySelector("#znTitle").innerHTML = "구역 등록";
			document.querySelector("#znWarehouse").value = pickedWh;
			document.querySelector("#znCapacity").value = "";
			document.querySelector("#znEditUsage").style.display = "none";
		} else {
			document.querySelector("#znTitle").innerHTML = "구역 수정";
			document.querySelector("#znWarehouse").value = znWhIds[index];
			document.querySelector("#znName").value = znNames[index];
			document.querySelector("#znCapacity").value = znCapacities[index];
			showZoneEditUsage(index);
		}

		openModal("#znModal");
	}


	/* 구역 수정 모달 안에서 현재 사용량/퍼센트를 바로 보여줍니다.
	   openZoneStock()의 사용률 막대바 계산과 같은 방식(90% 빨강, 70% 주황). */
	function showZoneEditUsage(index) {

		let box = document.querySelector("#znEditUsage");
		let text = document.querySelector("#znEditUsageText");
		let barFill = document.querySelector("#znEditUsageBarFill");

		box.style.display = "block";
		barFill.className = "zn-stock-bar-fill";

		if (znCapacities[index] > 0) {

			let percent = Math.round(znUsed[index] / znCapacities[index] * 100);
			text.innerHTML = addComma(znUsed[index]) + " / " + addComma(znCapacities[index]) + " (" + percent + "%)";
			barFill.style.width = Math.min(percent, 100) + "%";

			if (percent >= 90) {
				barFill.className = barFill.className + " bar-full";
			} else if (percent >= 70) {
				barFill.className = barFill.className + " bar-warn";
			}

		} else {
			text.innerHTML = addComma(znUsed[index]) + " (용량 미설정)";
			barFill.style.width = "0%";
		}
	}


	function saveZone() {

		if (isBlank(["#znCapacity"]) == true) {
			alert("최대 수용량을 채워 주세요.");
			return;
		}

		let capacity = document.querySelector("#znCapacity").value * 1;

		if (capacity <= 0) {
			alert("최대 수용량은 1 이상이어야 합니다.");
			return;
		}

		let whId = getSelectValue("#znWarehouse") * 1;
		let name = document.querySelector("#znName").value;

		/* 같은 창고에 같은 이름의 구역이 두 개 있으면 안 됩니다 */
		for (let i = 0; i < znIds.length; i++) {
			if (i != editZn && znWhIds[i] == whId && znNames[i] == name) {
				alert("이 창고에는 이미 " + name + " 구역이 있습니다.");
				return;
			}
		}

		let body = {
			warehouseId: whId,
			zoneName: name,
			capacity: capacity
		};

		pickedWh = whId;

		if (editZn == -1) {
			apiSend("POST", "/api/zones", body, afterSave);
		} else {
			apiSend("PUT", "/api/zones/" + znIds[editZn], body, afterSave);
		}
	}


	function deleteZone(index) {

		/* 재고가 남아 있는 구역은 지울 수 없습니다 */
		if (znUsed[index] > 0) {
			alert("이 구역에 재고가 " + addComma(znUsed[index]) + "개 남아 있어 삭제할 수 없습니다.\n다른 구역으로 옮기거나 출고한 뒤에 지워 주세요.");
			return;
		}

		if (confirm("구역 " + znNames[index] + " 을 삭제할까요?") == false) {
			return;
		}

		apiSend("DELETE", "/api/zones/" + znIds[index], null, afterSave);
	}


	/* 저장·삭제가 끝나면 목록을 서버에서 다시 받아옵니다 */
	function afterSave(data) {
		closeAll();
		loadData();
	}


	function closeAll() {
		closeModal("#whModal");
		closeModal("#znModal");
		editWh = -1;
		editZn = -1;
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

</body>
</html>

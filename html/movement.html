<!DOCTYPE html> <!-- 08.13 창고 간 재고 이동 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>창고 간 재고 이동</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/movement.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button> 
			<button class="menu-btn" onclick="location.href='inout.html'">입출고 등록</button> 
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn active">창고 간 재고 이동</button> <!--현재 화면이 창고 간 재고 이동이라서 -->
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<h4 class= "page-title">재고 이동</h4>
		
		<!-- 입력폼 -->
		<section class="form-box">
				<div class="form-group">
					<label>이동 일자</label>
					<input type="date" id="mvDate">
				</div>
				
				<div class="form-group">
					<label>품목명</label>
					<input type="text" id="mvName" list="itemList" onchange="changeItem()" onkeyup="changeItem()" placeholder="예: 두부">
					<datalist id="itemList"></datalist>
				</div>
				
				<div class="form-group">
					<label>품목 코드</label>
					<input type="text" id="mvCode" readonly placeholder="품목을 고르면 채워집니다">
				</div>
				
				<div class="form-group">
					<label>로트 번호</label>
					<select id="mvLot" onchange="changeLot()">
					</select>
				</div>
				
				<div class="form-group">
					<label>출발 구역</label>
					<input type="text" id="mvFrom" readonly>
				</div>
				
				<div class="form-group">
					<label>수량 (남은 수량 이하)</label>
					<input type="number" id="mvQty">
				</div>
				
				<div class="form-group">
					<label>도착 창고</label>
					<select id="mvToWarehouse" onchange="changeWarehouse()">
					</select>
				</div>
				
				<div class="form-group">
					<label>도착 구역</label>
					<select id="mvToZone">
					</select>
				</div>
					
				<div class="form-group">
					<label>비고 (기록용 메모)</label>
					<input type="text" id="mvNote">
				</div>
				
				<button class="register-btn" onclick="doRegister()">이동 등록</button>
			</section>
		
		<!-- 이동 이력 목록(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">이동 이력 목록</h4>
		<!-- 기간으로 거르기 (명세서 S-07) -->
		<div class="list-filter">
			<label>기간</label>
			<input type="date" id="fFrom" onchange="drawList()">
			<span>~</span>
			<input type="date" id="fTo" onchange="drawList()">
		</div>
			<table>
				<thead>
					<tr>
						<th>이동 일시</th>
						<th>품목명</th>
						<th>품목 번호</th>
						<th>로트 번호</th>
						<th>수량</th>
						<th>출발 구역</th>
						<th>도착 구역</th>
					</tr>
				</thead>

				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="mvBody">
					</tbody>
			</table>
		
			<!-- 쪽 번호 (명세서 S-04) -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     재고 이동 화면 로직
     ------------------------------------------------------------
     서버(TransferService)가 검사하는 규칙을 화면에서도 미리 막습니다.
       1) 출발 구역과 도착 구역이 같으면 안 됨
       2) 품목 단위와 도착 구역 이름이 같아야 함 (EA 로트는 EA 구역으로만)
       3) 로트에 남은 수량보다 많이 옮길 수 없음

     수량이 로트 전체와 같으면 "전체 이동"(구역만 바뀜),
     적으면 "분할"(원본은 줄고 새 로트가 생김) 이 됩니다.
     ============================================================ -->
<script>

	/* ============================================================
	   재고 이동 - 서버 연동

	   보내는 값 : lotId / fromZoneId / toZoneId / quantity / handlerId

	   서버가 검사하는 규칙
	     1) 출발 구역과 도착 구역이 같으면 안 됨
	     2) 품목 단위와 도착 구역 이름이 같아야 함
	     3) 로트에 남은 수량보다 많이 옮길 수 없음
	   화면에서도 같은 검사를 해서 미리 걸러 냅니다.
	   ============================================================ */

	/* 고른 품목의 로트들 */
	let lotIds = [];
	let lotQtys = [];
	let lotZoneIds = [];
	let lotZoneTexts = [];

	/* 이동 이력 (서버에서 받아옴, GET /api/transfers) */
	let rowIds = [];
	let rowTimes = [];
	let rowItemIds = [];
	let rowLots = [];
	let rowQtys = [];
	let rowFroms = [];
	let rowTos = [];

	let nowPage = 1;
	let totalCount = 0;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillWarehouse("#mvToWarehouse");
		fillZone("#mvToWarehouse", "#mvToZone");
		fillItemList("#itemList");

		document.querySelector("#mvDate").value = getToday();

		loadHistory();
	}


	/* ============================================================
	   품목을 고르면 그 품목의 로트를 서버에서 받아옵니다
	   ============================================================ */
	function changeItem() {

		let i = findItemByName(document.querySelector("#mvName").value);

		if (i == -1) {
			document.querySelector("#mvCode").value = "";
			document.querySelector("#mvLot").innerHTML = "";
			document.querySelector("#mvFrom").value = "";
			lotIds = [];
			return;
		}

		document.querySelector("#mvCode").value = itemCodes[i];

		/* 정상 상태인 로트만 받아옵니다 */
		apiGet("/api/stock-lots?itemId=" + getItemId(itemNameList[i]) + "&status=NORMAL&size=200", putLots);
	}


	function putLots(data) {

		let list = data.items;

		lotIds = [];
		lotQtys = [];
		lotZoneIds = [];
		lotZoneTexts = [];

		let html = "";

		for (let i = 0; i < list.length; i++) {

			/* 남은 수량이 없는 로트는 옮길 게 없어서 건너뜁니다 */
			if (list[i].quantity <= 0) {
				continue;
			}

			let last = lotIds.length;

			lotIds[last] = list[i].lotId;
			lotQtys[last] = list[i].quantity;
			lotZoneIds[last] = list[i].zoneId;
			lotZoneTexts[last] = findZoneName(list[i].zoneId);

			html = html + "<option value='" + last + "'>LOT-" + list[i].lotId
			            + " (남은 " + list[i].quantity + "개, " + lotZoneTexts[last] + ")</option>";
		}

		if (html == "") {
			html = "<option value='-1'>옮길 수 있는 재고가 없습니다</option>";
		}

		document.querySelector("#mvLot").innerHTML = html;
		changeLot();
	}


	/* 로트를 고르면 출발 구역이 자동으로 채워집니다 */
	function changeLot() {

		let k = document.querySelector("#mvLot").value * 1;

		if (k < 0 || lotIds.length == 0) {
			document.querySelector("#mvFrom").value = "";
			return;
		}

		document.querySelector("#mvFrom").value = lotZoneTexts[k];
	}


	function changeWarehouse() {
		fillZone("#mvToWarehouse", "#mvToZone");
	}


	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 */
	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   이동 등록  (POST /api/transfers)
	   ============================================================ */
	function doRegister() {

		if (isBlank(["#mvDate", "#mvName", "#mvQty"]) == true) {
			alert("이동 일자, 품목명, 수량을 채워 주세요.");
			return;
		}

		let k = document.querySelector("#mvLot").value * 1;

		if (k < 0 || lotIds.length == 0) {
			alert("옮길 로트를 골라 주세요.");
			return;
		}

		let qty = document.querySelector("#mvQty").value * 1;

		if (qty <= 0) {
			alert("수량은 1개 이상이어야 합니다.");
			return;
		}

		/* 규칙 3 : 남은 수량보다 많이 옮길 수 없습니다 */
		if (qty > lotQtys[k]) {
			alert("LOT-" + lotIds[k] + " 에 남은 수량은 " + lotQtys[k] + "개입니다.\n그보다 많이 옮길 수 없습니다.");
			return;
		}

		let toZoneId = getSelectValue("#mvToZone") * 1;
		let toZoneName = getSelectText("#mvToZone");

		/* 규칙 1 : 출발과 도착이 같으면 옮길 이유가 없습니다 */
		if (lotZoneIds[k] == toZoneId) {
			alert("출발 구역과 도착 구역이 같습니다.");
			return;
		}

		/* 규칙 2 : 품목 단위와 도착 구역 이름이 같아야 합니다 */
		let i = findItemByName(document.querySelector("#mvName").value);

		if (i != -1 && itemUnitList[i] != toZoneName) {
			alert("이 품목의 단위(" + itemUnitList[i] + ")와 도착 구역(" + toZoneName + ")이 다릅니다.\n같은 이름의 구역으로만 옮길 수 있습니다.");
			return;
		}

		/* 담당자는 로그인한 사람으로 보냅니다 */
		let handlerId = sessionStorage.getItem("userId");

		if (handlerId == null) {
			alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
			return;
		}

		let body = {
			lotId: lotIds[k],
			fromZoneId: lotZoneIds[k],
			toZoneId: toZoneId,
			quantity: qty,
			handlerId: handlerId * 1
		};

		apiSend("POST", "/api/transfers", body, afterRegister);
	}


	function afterRegister(data) {

		let msg = "이동이 등록되었습니다.";

		/* 일부만 옮기면 옮겨간 만큼이 새 로트로 나뉩니다 */
		if (data.splitOccurred == true) {
			msg = msg + "\n일부만 옮겨서 새 로트 LOT-" + data.newLotId + " 가 만들어졌습니다.";
		} else {
			msg = msg + "\n로트 전체가 옮겨졌습니다.";
		}

		clearInput(["#mvQty", "#mvNote"]);

		/* 방금 등록한 이동이 이력에 바로 보이게 다시 받아옵니다 */
		nowPage = 1;
		loadHistory();

		/* 로트 수량이 바뀌었으니 목록을 다시 받아옵니다 */
		changeItem();

		alert(msg);
	}


	/* ============================================================
	   이동 이력 표  (GET /api/transfers)
	   ============================================================ */
	function loadHistory() {
		apiGet("/api/transfers?page=" + nowPage + "&size=" + pageSize, putHistory);
	}


	function putHistory(data) {

		let list = data.items;
		totalCount = data.total;

		rowIds = [];
		rowTimes = [];
		rowItemIds = [];
		rowLots = [];
		rowQtys = [];
		rowFroms = [];
		rowTos = [];

		for (let i = 0; i < list.length; i++) {

			rowIds[i] = list[i].transferId;
			rowItemIds[i] = list[i].itemId;
			rowLots[i] = list[i].lotId;
			rowQtys[i] = list[i].quantity;
			rowFroms[i] = findZoneName(list[i].fromZoneId);
			rowTos[i] = findZoneName(list[i].toZoneId);

			/* 서버가 주는 시각은 "2026-08-21T14:25:29" 모양이라 가운데 T를 빈칸으로 바꿉니다 */
			let t = list[i].movedAt;
			if (t == null) {
				t = "";
			} else {
				t = t.replace("T", " ");
				if (t.length > 16) {
					t = t.substring(0, 16);
				}
			}
			rowTimes[i] = t;
		}

		drawList();
	}


	/* 품목 번호로 이름을 찾습니다 (common.js가 받아 둔 품목 목록에서) */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	/* 기간 거르기는 서버에 없는 조건이라 화면에서 처리합니다 */
	function getList() {

		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;
		let result = [];

		for (let i = 0; i < rowTimes.length; i++) {

			let day = rowTimes[i].substring(0, 10);

			if (from != "" && day < from) {
				continue;
			}
			if (to != "" && day > to) {
				continue;
			}

			result[result.length] = i;
		}

		return result;
	}


	function drawList() {

		let list = getList();
		let html = "";

		if (list.length == 0) {
			document.querySelector("#mvBody").innerHTML = "<tr><td colspan='7'>이동 이력이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];

			html = html + "<tr>";
			html = html + "<td>" + rowTimes[i] + "</td>";
			html = html + "<td>" + findItemName(rowItemIds[i]) + "</td>";
			html = html + "<td>ITEM-" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLots[i] + "</td>";
			html = html + "<td>" + addComma(rowQtys[i]) + "</td>";
			html = html + "<td>" + rowFroms[i] + "</td>";
			html = html + "<td>" + rowTos[i] + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#mvBody").innerHTML = html;

		/* 쪽 번호는 서버가 준 전체 건수 기준입니다 (기간 거르기는 화면 안에서만 적용) */
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadHistory();
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

</body>



</html>

		<h4 class= "page-title">재고 이동</h4>
		
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>이동 일자</label>
				<input type="date">
			</div>
			
			<div class="form-group">
				<label>담당자</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>품목명</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>품목 코드</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>로트 번호</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>수량</label>
				<input type= "number">
			</div>
			
			<div class="form-group">
				<label>출발 구역</label>
					<select>
					<option>A</option>
					<option>B</option>
					<option>C</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>도착 구역</label>
					<select>
					<option>A</option>
					<option>B</option>
					<option>C</option>
				</select>
			</div>
				
			<div class="form-group"	>
				<label>비고</label>
				<input type= "text">
			</div>
			
			<button class="register-btn">이동 등록</button>
		</section>
		
		<!-- 이동 이력 목록(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">이동 이력 목록</h4>
			<table>
				<thead>
					<tr>
						<th>이동 일자</th>
						<th>담당자</th>
						<th>품목명</th>
						<th>품목 번호</th>
						<th>로트 번호</th>

						<td>2026.08.04</td>

					<tr>

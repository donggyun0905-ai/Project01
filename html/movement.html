<!-- 이동 로트 자동 추천 + 선택 결과 (모달 - 출발 구역 안의 로트를 한눈에 보여줍니다) -->

<!-- ============================================================
     재고 이동 화면 로직
     ------------------------------------------------------------
     이제 로트를 직접 고르지 않고, 출발 구역만 고르면 그 구역 안의 로트를
     유통기한/입고일 순으로 정렬해서 모달로 보여줍니다(출고 등록 화면과 같은 방식).
     예전엔 "총 이동 수량"을 먼저 입력받아 서버 추천값으로 로트별 수량을 미리
     채워 줬는데, 결국 모달에서 로트별로 다시 정하게 되어 있어 중복이라 없앴습니다
     - 정렬 순서만 자동으로 정해 주고, 수량은 로트마다 0에서 시작해 직접 입력합니다.

     서버(TransferService)가 검사하는 규칙은 화면에서도 미리 막습니다.
       1) 출발 구역과 도착 구역이 같으면 안 됨
       2) 품목 단위와 도착 구역 이름이 같아야 함 (EA 로트는 EA 구역으로만)
       3) 로트에 남은 수량보다 많이 옮길 수 없음

     수량이 로트 전체와 같으면 "전체 이동"(구역만 바뀜),
     적으면 "분할"(원본은 줄고 새 로트가 생김) 이 됩니다.
     ============================================================ -->
<script>

	/* ============================================================
	   재고 이동 - 서버 연동

	   보내는 값 : lotId / fromZoneId / toZoneId / quantity / handlerId

	   "이동일"은 화면에 보여주기만 하고 서버로는 안 보냅니다 - STOCK_TRANSFER.moved_at은
	   DB가 이동이 실제로 기록되는 순간의 시각을 자동으로 넣는 컬럼이라(감사 기록으로서
	   신뢰할 수 있어야 해서), 사용자가 임의로 바꿀 수 없게 그대로 두기로 했습니다.
	   (한 번은 직접 고를 수 있게 서버까지 고쳤었는데, 이동은 입고/출고와 달리 "옮기는
	   순간 바로 기록"하는 일이라 날짜를 따로 고를 실익이 적고, 오히려 실제 기록 시점을
	   신뢰하기 어렵게 만든다고 판단해 되돌렸습니다.)

	   서버가 검사하는 규칙
	     1) 출발 구역과 도착 구역이 같으면 안 됨
	     2) 품목 단위와 도착 구역 이름이 같아야 함
	     3) 로트에 남은 수량보다 많이 옮길 수 없음
	   화면에서도 같은 검사를 해서 미리 걸러 냅니다.
	   ============================================================ */

	/* 서버가 추천해 준, 출발 구역 안의 로트들 */
	let pickedWay = "";
	let pickedLotIds = [];
	let pickedLotIn = [];
	let pickedLotExp = [];
	let pickedLotQtys = [];   // 그 로트에서 옮길 수량 (모달에서 직접 조정 가능)
	let pickedLotAvail = [];  // 그 로트에 실제로 남아있는 수량

	/* 지금 추천 중인 이동 건의 구역/담당자 - 모달에서 실제 등록할 때 씁니다 */
	let moveFromZoneId = -1;
	let moveToZoneId = -1;
	let moveHandlerId = -1;

	/* 여러 로트를 순서대로 보낼 때 쓰는 값 */
	let sendIndex = 0;
	let doneCount = 0;
	let splitCount = 0;

	/* 이동 이력 (서버에서 받아옴, GET /api/transfers) */
	let rowIds = [];
	let rowTimes = [];
	let rowItemIds = [];
	let rowLots = [];
	let rowQtys = [];
	let rowFroms = [];
	let rowTos = [];

	let nowPage = 1;
	let totalCount = 0;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillWarehouse("#mvFromWarehouse");
		fillZone("#mvFromWarehouse", "#mvFromZone");
		fillWarehouse("#mvToWarehouse");
		fillZone("#mvToWarehouse", "#mvToZone");
		fillItemList("#itemList");
		fillCategory("#mvCategory");

		document.querySelector("#mvDate").value = getToday();

		/* 도착 구역 남은 공간은 품목을 고르기 전에도 보여 줍니다 */
		updateToZoneRoom();

		loadHistory();
	}


	/* 품목명을 고르면 코드가 채워지고, 그 품목 단위(EA/BOX/PALLET)와 같은 이름의
	   구역을 출발/도착 양쪽에서 자동으로 찾아 골라 줍니다(입고 등록 화면과 동일한 방식).
	   어느 로트에서 옮길지는 더 이상 여기서 고르지 않고, [자동 추천 및 확인] 누르면
	   출발 구역 안의 로트를 서버에서 받아와 모달로 보여줍니다. */
	function changeItem() {

		let i = findItemByName(document.querySelector("#mvName").value);

		if (i == -1) {
			document.querySelector("#mvCode").value = "";
			return;
		}

		document.querySelector("#mvCode").value = itemCodes[i];

		if (itemCategoryList[i] != null) {
			document.querySelector("#mvCategory").value = itemCategoryList[i];
		}

		pickSameZone("#mvFromZone", itemUnitList[i]);
		pickSameZone("#mvToZone", itemUnitList[i]);

		updateFromZoneAvailable();
		updateToZoneRoom();
	}


	/* 지금 고른 창고 안에서, 주어진 단위(unit)와 이름이 같은 구역을 찾아 선택합니다.
	   같은 이름의 구역이 그 창고에 없으면 그냥 그대로 둡니다. */
	function pickSameZone(zoneSelectId, unit) {

		let box = document.querySelector(zoneSelectId);

		for (let i = 0; i < box.options.length; i++) {
			if (box.options[i].text == unit) {
				box.selectedIndex = i;
				return;
			}
		}
	}


	/* 지금 입력폼에 골라져 있는 품목의 단위를 돌려줍니다 (없으면 null) */
	function currentItemUnit() {

		let i = findItemByName(document.querySelector("#mvName").value);
		return i == -1 ? null : itemUnitList[i];
	}


	/* 그 품목이 유통기한을 관리하지 않는 품목인지 확인합니다 (출고 등록 화면과 동일) */
	function itemShelfEmpty(i) {

		if (itemShelfList[i] == null) {
			return true;
		}
		return false;
	}


	function changeFromWarehouse() {

		fillZone("#mvFromWarehouse", "#mvFromZone");

		let unit = currentItemUnit();
		if (unit != null) {
			pickSameZone("#mvFromZone", unit);
		}

		updateFromZoneAvailable();
	}


	function changeFromZone() {
		updateFromZoneAvailable();
	}


	function changeToZone() {
		updateToZoneRoom();
	}


	/* 출발 구역에 지금 고른 품목이 얼마나 있는지 참고용으로 보여줍니다(입력 상한은 아님 -
	   실제로 얼마나 옮길지는 자동 추천 모달에서 로트별로 직접 정합니다).
	   품목이나 구역을 아직 안 골랐으면 안내를 지웁니다. */
	function updateFromZoneAvailable() {

		let itemId = getItemId(document.querySelector("#mvName").value);
		let zoneId = getSelectValue("#mvFromZone") * 1;

		let hint = document.querySelector("#mvFromAvailText");

		if (itemId == -1 || isNaN(zoneId) || zoneId <= 0) {
			hint.innerHTML = "";
			return;
		}

		apiGet("/api/stock-lots?itemId=" + itemId + "&zoneId=" + zoneId + "&status=NORMAL&size=200", putFromZoneAvailable);
	}


	function putFromZoneAvailable(data) {

		let list = data.items;
		let total = 0;

		for (let i = 0; i < list.length; i++) {
			total = total + list[i].quantity;
		}

		document.querySelector("#mvFromAvailText").innerHTML = "이 구역 재고: " + addComma(total) + "개";
	}


	/* 도착 구역에 지금 얼마나 더 들어갈 자리가 있는지 참고용으로 보여줍니다.
	   loadMasterFromServer가 이미 받아 둔 zoneCapacities/zoneUsed를 그대로 씁니다
	   (창고/구역 관리 화면과 같은 usedQuantity 기준이라 정확합니다).
	   용량을 정해 두지 않은 구역은 제한이 없는 걸로 봅니다. */
	function updateToZoneRoom() {

		let toZoneId = getSelectValue("#mvToZone") * 1;
		let hint = document.querySelector("#mvToRoomText");

		for (let i = 0; i < zoneIds.length; i++) {

			if (zoneIds[i] != toZoneId) {
				continue;
			}

			if (zoneCapacities[i] == null) {
				hint.innerHTML = "용량 미설정 (제한 없음)";
			} else {
				let room = zoneCapacities[i] - zoneUsed[i];
				if (room < 0) {
					room = 0;
				}
				hint.innerHTML = "남은 공간: " + addComma(room) + "개";
			}

			return;
		}

		hint.innerHTML = "";
	}


	function changeWarehouse() {

		fillZone("#mvToWarehouse", "#mvToZone");

		let unit = currentItemUnit();
		if (unit != null) {
			pickSameZone("#mvToZone", unit);
		}

		updateToZoneRoom();
	}


	/* 구역 번호로 "대형(0) EA" 같은 이름을 만듭니다 */
	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   모달 - 출발 구역 안의 로트를 서버에 물어봅니다
	   ============================================================ */
	function openMoveRecommend() {

		if (isBlank(["#mvName"]) == true) {
			alert("품목명을 채워 주세요.");
			return;
		}

		let itemId = getItemId(document.querySelector("#mvName").value);

		if (itemId == -1) {
			alert("등록되지 않은 품목입니다.\n후보 목록에서 골라 주세요.");
			return;
		}

		let fromZoneId = getSelectValue("#mvFromZone") * 1;
		let toZoneId = getSelectValue("#mvToZone") * 1;

		/* 규칙 1 : 출발과 도착이 같으면 옮길 이유가 없습니다 */
		if (fromZoneId == toZoneId) {
			alert("출발 구역과 도착 구역이 같습니다.");
			return;
		}

		/* 규칙 2 : 품목 단위와 도착 구역 이름이 같아야 합니다 */
		let toZoneName = getSelectText("#mvToZone");
		let i = findItemByName(document.querySelector("#mvName").value);

		if (i != -1 && itemUnitList[i] != toZoneName) {
			alert("이 품목의 단위(" + itemUnitList[i] + ")와 도착 구역(" + toZoneName + ")이 다릅니다.\n같은 이름의 구역으로만 옮길 수 있습니다.");
			return;
		}

		/* 담당자는 로그인한 사람으로 보냅니다 */
		let handlerId = sessionStorage.getItem("userId");

		if (handlerId == null) {
			alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
			return;
		}

		moveFromZoneId = fromZoneId;
		moveToZoneId = toZoneId;
		moveHandlerId = handlerId * 1;

		/* 유통기한이 있는 품목이면 FEFO, 없으면 FIFO */
		pickedWay = (i != -1 && itemShelfEmpty(i) == true) ? "FIFO" : "FEFO";

		apiGet("/api/stock-lots?itemId=" + itemId + "&zoneId=" + fromZoneId + "&status=NORMAL&size=200", putMoveLots);
	}


	/* 출발 구역 안의 로트를 받아, 추천 방식과 같은 기준으로 정렬한 뒤
	   요청 수량만큼 앞에서부터 자동으로 채워 넣습니다 (출고 등록과 같은 방식). */
	function putMoveLots(data) {

		let list = data.items;

		if (list.length == 0) {
			alert("이 구역에는 옮길 수 있는 재고가 없습니다.");
			return;
		}

		list.sort(function (a, b) {
			if (pickedWay == "FEFO") {
				let ea = a.expiryDate == null ? "9999-99-99" : a.expiryDate;
				let eb = b.expiryDate == null ? "9999-99-99" : b.expiryDate;
				if (ea < eb) return -1;
				if (ea > eb) return 1;
				return 0;
			}
			if (a.inboundDate < b.inboundDate) return -1;
			if (a.inboundDate > b.inboundDate) return 1;
			return 0;
		});

		pickedLotIds = [];
		pickedLotIn = [];
		pickedLotExp = [];
		pickedLotQtys = [];
		pickedLotAvail = [];

		for (let i = 0; i < list.length; i++) {

			if (list[i].quantity <= 0) {
				continue;
			}

			pickedLotIds[pickedLotIds.length] = list[i].lotId;
			pickedLotIn[pickedLotIn.length] = list[i].inboundDate;
			pickedLotExp[pickedLotExp.length] = list[i].expiryDate == null ? "" : list[i].expiryDate;
			pickedLotAvail[pickedLotAvail.length] = list[i].quantity;
			pickedLotQtys[pickedLotQtys.length] = 0;
		}

		let text = "";

		if (pickedWay == "FEFO") {
			text = "해당 품목은 유통기한 관리 대상입니다.<br>따라서 <strong>FEFO(유통기한 기준)</strong> 순으로 로트를 보여줍니다.";
		} else {
			text = "해당 품목은 유통기한 관리 대상이 아닙니다.<br>따라서 <strong>FIFO(입고일 기준)</strong> 순으로 로트를 보여줍니다.";
		}

		document.querySelector("#moveRecommendText").innerHTML = text;
		document.querySelector("#moveRecommendWay").innerHTML = pickedWay;

		openMoveLotTable();
	}


	/* ============================================================
	   모달 - 추천된 로트별로 얼마씩 옮길지 보여주고, 직접 조정할 수 있게 합니다
	   ============================================================ */
	function openMoveLotTable() {

		let html = "";
		let nearCount = 0;

		for (let i = 0; i < pickedLotIds.length; i++) {

			let expiry = pickedLotExp[i];
			let cell = "-";

			if (expiry != "") {

				if (isNearExpiry(expiry) == true) {

					let left = getLeftDays(expiry);
					let word = "D-" + left;

					if (left < 0) {
						word = "기한 지남";
					}

					cell = "<span class='near-expiry'>" + expiry + " (" + word + ")</span>";
					nearCount = nearCount + 1;

				} else {
					cell = expiry;
				}
			}

			html = html + "<tr>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>LOT-" + pickedLotIds[i] + "</td>";
			html = html + "<td>" + pickedLotIn[i] + "</td>";
			html = html + "<td>" + cell + "</td>";
			html = html + "<td><input type='number' class='move-lot-qty-input' id='moveLotQty" + i + "' "
				+ "min='0' max='" + pickedLotAvail[i] + "' value='" + pickedLotQtys[i] + "' "
				+ "onchange='onMoveLotQtyChange(" + i + ")'> / " + pickedLotAvail[i] + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#moveLotBody").innerHTML = html;
		updateMoveLotTotalText();

		let wayText = "정렬 방식: " + pickedWay + " / 출발 구역 안의 로트만 대상입니다";

		if (nearCount > 0) {
			wayText = wayText + " / 유통기한 임박 로트 " + nearCount + "건이 포함되어 있습니다";
		}
		wayText = wayText + " / 로트별 수량 칸에 옮길 수량을 직접 입력하세요";

		document.querySelector("#moveLotWayText").innerHTML = wayText;

		openModal("#moveLotModal");
	}


	/* 담당자가 모달에서 로트별 수량을 직접 조정했을 때 - 그 로트에 실제로
	   남아있는 수량(pickedLotAvail)을 넘길 수는 없게 막습니다. */
	function onMoveLotQtyChange(i) {

		let input = document.querySelector("#moveLotQty" + i);
		let value = input.value * 1;

		if (isNaN(value) || value < 0) {
			value = 0;
		}
		if (value > pickedLotAvail[i]) {
			value = pickedLotAvail[i];
			alert("이 로트에는 " + pickedLotAvail[i] + "개까지만 있습니다.");
		}

		value = Math.floor(value);
		input.value = value;
		pickedLotQtys[i] = value;

		updateMoveLotTotalText();
	}


	function updateMoveLotTotalText() {

		let total = 0;

		for (let i = 0; i < pickedLotQtys.length; i++) {
			total = total + pickedLotQtys[i];
		}

		document.querySelector("#moveTotalQtyInput").value = total;
	}


	/* "총 이동 수량"에 직접 숫자를 입력하면, 유통기한/입고일 순(정렬된 순서 그대로)으로
	   앞에서부터 로트별 수량을 자동으로 채워 줍니다. 로트별 수량 칸을 하나씩 채우기
	   번거로울 때 한 번에 채우는 용도이고, 채운 뒤에도 로트별로 다시 직접 조정할 수 있습니다. */
	function onMoveTotalQtyChange() {

		let input = document.querySelector("#moveTotalQtyInput");
		let requested = input.value * 1;

		if (isNaN(requested) || requested < 0) {
			requested = 0;
		}

		let totalAvail = 0;
		for (let i = 0; i < pickedLotAvail.length; i++) {
			totalAvail = totalAvail + pickedLotAvail[i];
		}

		if (requested > totalAvail) {
			requested = totalAvail;
			alert("이 구역에 남은 재고가 " + addComma(totalAvail) + "개뿐이라, 그만큼만 채웠습니다.");
		}

		let rest = requested;

		for (let i = 0; i < pickedLotIds.length; i++) {
			let take = Math.min(rest, pickedLotAvail[i]);
			pickedLotQtys[i] = take;
			rest = rest - take;
		}

		openMoveLotTable();
	}


	function closeMoveModal() {
		closeModal("#moveLotModal");
	}


	/* ============================================================
	   이동 등록  (POST /api/transfers)

	   로트가 여러 개면 서버에 여러 번 나눠 보내야 합니다.
	   한 건이 끝나면 다음 건을 보내는 방식으로 순서대로 처리합니다.
	   ============================================================ */
	function doRegister() {

		let total = 0;
		for (let i = 0; i < pickedLotQtys.length; i++) {
			total = total + pickedLotQtys[i];
		}
		if (total <= 0) {
			alert("이동할 수량이 없습니다. 로트별 수량을 확인해 주세요.");
			return;
		}

		sendIndex = 0;
		doneCount = 0;
		splitCount = 0;

		closeMoveModal();
		sendOneMove();
	}


	function sendOneMove() {

		if (sendIndex >= pickedLotIds.length) {
			finishMove();
			return;
		}

		/* 담당자가 이 로트 수량을 0으로 조정했으면 건너뜁니다 */
		if (pickedLotQtys[sendIndex] <= 0) {
			sendIndex = sendIndex + 1;
			sendOneMove();
			return;
		}

		let body = {
			lotId: pickedLotIds[sendIndex],
			fromZoneId: moveFromZoneId,
			toZoneId: moveToZoneId,
			quantity: pickedLotQtys[sendIndex],
			handlerId: moveHandlerId
		};

		apiSend("POST", "/api/transfers", body, afterOneMove, failOneMove);
	}


	function afterOneMove(data) {

		doneCount = doneCount + 1;

		if (data.splitOccurred == true) {
			splitCount = splitCount + 1;
		}

		sendIndex = sendIndex + 1;
		sendOneMove();
	}


	/* 한 건이 실패해도 나머지는 계속 보냅니다 */
	function failOneMove(message) {

		alert("LOT-" + pickedLotIds[sendIndex] + " 이동 실패\n" + message);

		sendIndex = sendIndex + 1;
		sendOneMove();
	}


	function finishMove() {

		clearInput(["#mvName", "#mvCode"]);
		document.querySelector("#mvFromAvailText").innerHTML = "";

		let msg = "이동이 등록되었습니다. (로트 " + doneCount + "건)";

		if (splitCount > 0) {
			msg = msg + "\n그중 " + splitCount + "건은 일부만 옮겨서 새 로트가 만들어졌습니다.";
		}

		/* 방금 등록한 이동이 이력에 바로 보이게 다시 받아옵니다 */
		nowPage = 1;
		loadHistory();

		alert(msg);
	}


	/* ============================================================
	   이동 이력 표  (GET /api/transfers)

	   기간(from/to)은 서버가 직접 걸러줍니다 - 그래서 쪽 번호(total)도
	   필터링된 기준으로 정확히 나옵니다.
	   ============================================================ */
	function loadHistory() {

		let url = "/api/transfers?page=" + nowPage + "&size=" + pageSize;

		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;

		if (from != "") {
			url = url + "&from=" + from;
		}
		if (to != "") {
			url = url + "&to=" + to;
		}

		let word = document.querySelector("#mv-search").value;
		if (word != "") {
			url = url + "&keyword=" + encodeURIComponent(word);
		}

		apiGet(url, putHistory);
	}


	/* 기간/검색어를 바꾸면 1페이지부터 다시 봅니다 (이전 필터로 보던 페이지 번호가
	   새 필터에서는 안 맞을 수 있어서) */
	function changeFilter() {
		nowPage = 1;
		loadHistory();
	}


	function doSearch() {
		nowPage = 1;
		loadHistory();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	function putHistory(data) {

		let list = data.items;
		totalCount = data.total;

		rowIds = [];
		rowTimes = [];
		rowItemIds = [];
		rowLots = [];
		rowQtys = [];
		rowFroms = [];
		rowTos = [];

		for (let i = 0; i < list.length; i++) {

			rowIds[i] = list[i].transferId;
			rowItemIds[i] = list[i].itemId;
			rowLots[i] = list[i].lotId;
			rowQtys[i] = list[i].quantity;
			rowFroms[i] = findZoneName(list[i].fromZoneId);
			rowTos[i] = findZoneName(list[i].toZoneId);

			/* 서버가 주는 시각은 "2026-08-21T14:25:29" 모양이라 가운데 T를 빈칸으로 바꿉니다 */
			let t = list[i].movedAt;
			if (t == null) {
				t = "";
			} else {
				t = t.replace("T", " ");
				if (t.length > 16) {
					t = t.substring(0, 16);
				}
			}
			rowTimes[i] = t;
		}

		drawList();
	}


	/* 품목 번호로 이름을 찾습니다 (common.js가 받아 둔 품목 목록에서) */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	function drawList() {

		let html = "";

		if (rowTimes.length == 0) {
			document.querySelector("#mvBody").innerHTML = "<tr><td colspan='7'>이동 이력이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let i = 0; i < rowTimes.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + rowTimes[i] + "</td>";
			html = html + "<td>" + findItemName(rowItemIds[i]) + "</td>";
			html = html + "<td>ITEM-" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLots[i] + "</td>";
			html = html + "<td>" + addComma(rowQtys[i]) + "</td>";
			html = html + "<td>" + rowFroms[i] + "</td>";
			html = html + "<td>" + rowTos[i] + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#mvBody").innerHTML = html;

		/* 쪽 번호는 서버가 준 전체 건수 기준입니다 (기간 필터도 서버가 이미 반영한 값) */
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadHistory();
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 바로 다시 받아오고, 연결이 끊기거나 신호를 놓쳐도
	   5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다(alert.html과
	   동일한 패턴). 로트 선택 모달을 보고 있는 중에는 건너뜁니다. 재고 이동은
	   다른 어떤 동작에서도 파생되지 않는 독립된 동작이라 "transfer"만 구독합니다.
	   ============================================================ */
	function refreshIfIdle() {
		let modal = document.querySelector("#moveLotModal");
		if (modal.className.indexOf("active") == -1) {
			loadHistory();
		}
	}

	connectRealtimeRefresh(refreshIfIdle, ["transfer"]);
	setInterval(refreshIfIdle, 5000);

</script>

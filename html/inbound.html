<!DOCTYPE html> <!-- 08.12 입고 등록 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>입고 등록</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/inbound.css">
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
			<a class="active">입출고 관리</a>
			<a>반품 및 폐기 관리</a>
			<a>알림</a>
			<a>통계</a>
			<a>설정 및 권한 관리</a>
		</nav>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn">품목 관리</button> 
			<button class="menu-btn active">입출고 등록</button> <!--현재 화면이 입고 등록이라서 -->
			<button class="menu-btn">창고 및 구역 관리</button>
			<button class="menu-btn">창고 간 재고 이동</button>
			<button class="menu-btn">감사로그</button>
		</header>
		
		<h4 class= "page-title">입고 등록</h4>
		
		<!-- 로트번호가 자동으로 생성된다고 생각하여 입력폼에 넣지 않았습니다-->
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>입고일</label>
				<input type="date">
			</div>
			
			<div class="form-group">
				<label> 카테고리</label> <!-- 임의로 넣어놨습니다 -->
				<select>
					<option>냉동식품</option>
					<option>냉장식품</option>
					<option>유제품</option>
				</select>
			</div>
				
			<div class="form-group"	>
				<label>품목 코드</label>
				<input type= "text">
			</div>
			
			<div class="form-group"	>
				<label>품목명</label>
				<input type= "text">
			</div>
			
			<div class="form-group"	>
				<label>수량</label>
				<input type= "number">
			</div>
			
			<div class="form-group"	>
				<label>단위</label>
					<select>
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
		
			<div class="form-group"	>
				<label>단가</label>
				<input type= "number">
			</div>
			
			<div class="form-group"	>
				<label>구역</label>
					<select>
					<option>A구역</option>
					<option>B구역</option>
					<option>C구역</option>
				</select>
			</div>
			
			<div class="form-group expiration-group">
				<label>유통기한</label>
				<div class= "date-range">
					<input type="date">
					<span>~</span>
					<input type="date">
				</div>
			</div>
			
				<div class="form-group"> <!--새로 추가된 부분  -->
				<label>공급처</label>
				<input type= "text">
			</div>
				
			<div class="form-group"	>
				<label>담당자</label>
				<input type= "text">
			</div>
			
			
			<button class="register-btn">입고 등록</button>
		</section>
		
		<!-- 입고입력(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">입고 이력</h4>
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>입고 일자</th>
						<th>품목 코드</th>
						<th>로트 번호</th>
						<th>품목명</th>
						<th>수량</th>
						<th>단위</th>
						<th>단가</th>
						<th>유통기한</th>
						<th>공급처</th>
						<th>구역</th>
						<th>담당자</th>
					</tr>				
				</thead>
				
				<tbody> <!--보기 좋게 표 안에 임의로 값을 넣어뒀습니다 나중에 넣어서 고치시면 될듯하옵니다-->
					<tr>
						<td>1</td>
						<td>2026-08-06</td>
						<td>ITEM-2001</td>
						<td>LOT-357</td>
						<td>두부</td>
						<td>60</td>
						<td>EA</td>
						<td>1,500</td>
						<td>2026-08-05~2026-12-28</td>
						<td>한신물산</td>
						<td>A</td>
						<td>홍길동</td>
					</tr>
					
					<tr>
						<td>2</td>
						<td>2026-08-06</td>
						<td>ITEM-2001</td>
						<td>LOT-4451</td>
						<td>간장</td>
						<td>32</td>
						<td>EA</td>
						<td>1,500</td>
						<td>2026-08-05~2026-12-28</td>
						<td>미국물산</td>
						<td>A</td>
						<td>김민지</td>
					</tr>
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

</body>



</html>

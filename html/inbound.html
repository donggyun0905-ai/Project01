<!DOCTYPE html> <!-- 08.12 입고 등록 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>입고 등록</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/inbound.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a class="active" href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='item.html'">품목 관리</button> 
			<button class="menu-btn active" onclick="location.href='inout.html'">입출고 등록</button> <!--현재 화면이 입고 등록이라서 -->
			<button class="menu-btn" onclick="location.href='warehouse.html'">창고 및 구역 관리</button>
			<button class="menu-btn" onclick="location.href='movement.html'">창고 간 재고 이동</button>
			<button class="menu-btn" onclick="location.href='audit.html'">감사로그</button>
		</header>
		
		<h4 class= "page-title">입고 등록</h4>
		
		<!-- 로트번호가 자동으로 생성된다고 생각하여 입력폼에 넣지 않았습니다-->
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>입고일</label>
				<input type="date" id="inDate">
			</div>
			
			<div class="form-group">
				<label>카테고리</label>
				<select id="inCategory">
				</select>
			</div>
			
			<div class="form-group">
				<label>품목명</label>
				<input type="text" id="inName" list="itemList" onchange="changeItem()" onkeyup="changeItem()" placeholder="예: 두부">
				<datalist id="itemList"></datalist>
			</div>
			
			<div class="form-group">
				<label>품목 코드</label>
				<input type="text" id="inCode" readonly placeholder="품목을 고르면 채워집니다">
			</div>
			
			<div class="form-group">
				<label>수량</label>
				<input type="number" id="inQty" onchange="checkInQtyMax()">
			</div>
			
			<div class="form-group">
				<label>단위</label>
				<select id="inUnit">
					<option>EA</option>
					<option>BOX</option>
					<option>PALLET</option>
				</select>
			</div>
		
			<div class="form-group">
				<label>창고</label>
				<select id="inWarehouse" onchange="changeWarehouse()">
				</select>
				<!-- 구역은 창고+단위로 자동 결정되어 따로 보여줄 필요가 없어서(항상 단위와
				     같은 이름), 여기엔 그 구역의 남은 공간만 안내합니다. -->
				<span class="hint-text" id="inZoneRoomText"></span>
			</div>
			
			<div class="form-group">
				<label>공급처</label>
				<select id="inPartner">
				</select>
			</div>
			
			<button class="register-btn" onclick="doRegister()">입고 등록</button>
		</section>
		
		<!-- 검색 (item.html과 같은 방식 - 컬럼 선택 + 그 컬럼에 맞는 입력창) -->
		<section class="search-box">
			<div class="search-input-wrap">
				<input type="text" id="in-search" placeholder="검색" onkeyup="pressEnter(event)">
				<button type="button" class="search-btn" onclick="doSearch()"></button>
			</div>

			<select class="category-select" id="inSearchField" onchange="doSearch()">
				<option>품목명</option>
				<option>공급처</option>
			</select>
		</section>

		<!-- 입고입력(표)  -->

		<section class= "table-box">
		<h4 class="table-title">입고 이력</h4>
			<table>
				<colgroup>
					<col style="width:5%">
					<col style="width:10%">
					<col style="width:10%">
					<col style="width:10%">
					<col style="width:15%">
					<col style="width:7%">
					<col style="width:6%">
					<col style="width:10%">
					<col style="width:11%">
					<col style="width:9%">
					<col style="width:7%">
				</colgroup>
				<thead>
					<tr>
						<th>NO</th>
						<th>입고 일자</th>
						<th>품목 코드</th>
						<th>로트 번호</th>
						<th>품목명</th>
						<th>수량</th>
						<th>단위</th>
						<th>유통기한</th>
						<th>공급처</th>
						<th>구역</th>
						<th>삭제</th>
					</tr>
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="inBody">
				</tbody>
			</table>
		
			<!-- 쪽 번호 (명세서 S-04) -->
			<div class="paging" id="paging"></div>
		</section>
		
	</main>
	
	</div>


<!-- ============================================================
     입고 등록 화면 로직
     ------------------------------------------------------------
     드롭다운 값과 공통 함수는 common.js 에 있습니다.
     서버가 준비되면 loadData() 안쪽과 doRegister() 의 저장 부분만
     바꾸면 됩니다.
     ============================================================ -->
<script>

	/* ============================================================
	   입고 등록 - 서버 연동

	   보내는 값 : itemId / zoneId / partnerId / quantity / inboundDate
	   담당자(createdBy)는 로그인한 사람으로 서버가 채웁니다.
	   유통기한은 품목의 유통기한 일수로 서버가 계산합니다.
	   ============================================================ */

	/* 지금 자동으로 정해진 구역 - 창고 안에 (구역명, 즉 단위) 하나뿐이라
	   품목 단위 + 창고만 알면 구역은 항상 하나로 정해집니다. 그래서 구역을
	   따로 고르게 하지 않고, 이 값을 내부적으로만 들고 있다가 등록할 때 씁니다. */
	let inZoneId = -1;

	/* 입고 이력 표 */
	let rowLotIds = [];
	let rowDates = [];
	let rowItemIds = [];
	let rowNames = [];
	let rowQtys = [];
	let rowUnits = [];
	let rowExpiries = [];
	let rowPartners = [];
	let rowZones = [];

	let nowPage = 1;
	let totalCount = 0;


	/* 화면이 열리면 기준 데이터부터 받아옵니다 */
	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	/* 거래처·창고·구역·품목을 다 받은 뒤에 실행됩니다 */
	function afterMaster() {

		fillCategory("#inCategory");
		fillPartner("#inPartner", "SUPPLIER");   // 입고는 공급처만
		fillWarehouse("#inWarehouse");
		fillItemList("#itemList");

		/* 입고일은 오늘로 미리 채워 둡니다 */
		document.querySelector("#inDate").value = getToday();

		/* 구역은 창고 + 단위로 자동 결정됩니다. 품목을 고르기 전엔 #inUnit의
		   기본값(EA) 기준으로 미리 한 번 맞춰 둡니다. */
		pickSameZone(document.querySelector("#inUnit").value);
		updateZoneRoom();

		loadData();
	}


	/* 품목명을 고르면 코드·단위·카테고리가 알아서 채워집니다 */
	function changeItem() {

		let i = findItemByName(document.querySelector("#inName").value);

		if (i == -1) {
			document.querySelector("#inCode").value = "";
			return;
		}

		document.querySelector("#inCode").value = itemCodes[i];
		document.querySelector("#inUnit").value = itemUnitList[i];

		if (itemCategoryList[i] != null) {
			document.querySelector("#inCategory").value = itemCategoryList[i];
		}

		/* 품목 단위와 같은 이름의 구역을 자동으로 찾습니다 */
		pickSameZone(itemUnitList[i]);
		updateZoneRoom();
	}


	function changeWarehouse() {
		pickSameZone(document.querySelector("#inUnit").value);
		updateZoneRoom();
	}


	/* 지금 고른 창고 안에서, 이름이 unit과 같은 구역을 찾아 inZoneId에 기억해
	   둡니다. 창고 안에는 (창고, 구역명) 조합이 유일해서 창고+단위만 알면
	   구역은 항상 하나로 정해지므로, 구역 자체는 화면에 따로 보여줄 필요가
	   없습니다(단위 칸과 항상 같은 값이라 중복). 같은 이름의 구역이 그
	   창고에 없으면 inZoneId를 -1로 두고, 그 사실은 updateZoneRoom()의
	   안내 문구에서 알려 줍니다. */
	function pickSameZone(unit) {

		let whId = getSelectValue("#inWarehouse") * 1;

		inZoneId = -1;

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneWarehouseIds[i] == whId && zoneNames[i] == unit) {
				inZoneId = zoneIds[i];
				return;
			}
		}
	}


	/* 자동으로 정해진 구역(inZoneId)에 지금 얼마나 더 들어갈 자리가 있는지
	   보여주고, 수량 입력을 그 이상 못 넣게 상한을 걸어 둡니다.
	   loadMasterFromServer가 이미 받아 둔 zoneCapacities/zoneUsed를 그대로 씁니다
	   (창고/구역 관리 화면과 같은 usedQuantity 기준이라 정확합니다).
	   용량을 정해 두지 않은 구역은 제한이 없는 걸로 봅니다. */
	function updateZoneRoom() {

		let hint = document.querySelector("#inZoneRoomText");
		let qtyInput = document.querySelector("#inQty");

		for (let i = 0; i < zoneIds.length; i++) {

			if (zoneIds[i] != inZoneId) {
				continue;
			}

			if (zoneCapacities[i] == null) {
				hint.innerHTML = "용량 미설정 (제한 없음)";
				qtyInput.removeAttribute("max");
			} else {
				let room = zoneCapacities[i] - zoneUsed[i];
				if (room < 0) {
					room = 0;
				}
				hint.innerHTML = "남은 공간: " + addComma(room) + "개";
				qtyInput.setAttribute("max", room);
			}

			checkInQtyMax();
			return;
		}

		/* 이 창고에 지금 단위와 같은 이름의 구역이 없는 경우 */
		let unit = document.querySelector("#inUnit").value;
		hint.innerHTML = "이 창고에는 '" + unit + "' 구역이 없습니다";
		qtyInput.removeAttribute("max");
	}


	/* 수량이 구역 남은 공간(#inQty의 max)을 넘으면 그 값으로 맞춰 줍니다 */
	function checkInQtyMax() {

		let input = document.querySelector("#inQty");
		let max = input.getAttribute("max");

		if (max == null || input.value == "") {
			return;
		}

		let value = input.value * 1;
		let maxVal = max * 1;

		if (value > maxVal) {
			input.value = maxVal;
			alert("이 구역에는 " + addComma(maxVal) + "개까지만 더 들어갈 수 있습니다.");
		}
	}


	/* ============================================================
	   입고 이력  (GET /api/stock-lots)

	   입고 이력은 따로 있는 게 아니라 재고 로트가 곧 입고 기록입니다.
	   수량은 남은 수량이 아니라 처음 들어온 수량을 보여 줍니다.

	   originOnly=true를 붙여서, 창고 간 이동이나 반품/폐기로 원본 로트에서
	   갈라져 나온 로트(parent_lot_id가 있는 로트)는 뺍니다 - 그건 새로 입고된
	   게 아니라 기존에 입고됐던 게 옮겨진 것뿐이라 여기 섞이면 안 됩니다.
	   ============================================================ */
	function loadData() {

		let path = "/api/stock-lots?page=" + nowPage + "&size=" + pageSize + "&originOnly=true";

		let word = document.querySelector("#in-search").value;
		let field = document.querySelector("#inSearchField").value;

		if (word != "") {
			if (field == "공급처") {
				path = path + "&partnerKeyword=" + encodeURIComponent(word);
			} else {
				path = path + "&keyword=" + encodeURIComponent(word);
			}
		}

		apiGet(path, putRows);
	}


	/* 검색창 - 검색하면 1쪽부터 다시 봅니다 */
	function doSearch() {
		nowPage = 1;
		loadData();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	function putRows(data) {

		let list = data.items;
		totalCount = data.total;

		rowLotIds = [];
		rowDates = [];
		rowItemIds = [];
		rowNames = [];
		rowQtys = [];
		rowUnits = [];
		rowExpiries = [];
		rowPartners = [];
		rowZones = [];

		for (let i = 0; i < list.length; i++) {

			rowLotIds[i] = list[i].lotId;
			rowDates[i] = list[i].inboundDate;
			rowItemIds[i] = list[i].itemId;

			/* 처음 입고된 수량이 있으면 그걸 쓰고, 없으면 남은 수량을 씁니다 */
			if (list[i].initialQuantity == null) {
				rowQtys[i] = list[i].quantity;
			} else {
				rowQtys[i] = list[i].initialQuantity;
			}

			if (list[i].expiryDate == null) {
				rowExpiries[i] = "-";
			} else {
				rowExpiries[i] = list[i].expiryDate;
			}

			rowNames[i] = findItemName(list[i].itemId);
			rowUnits[i] = findItemUnit(list[i].itemId);
			rowPartners[i] = findPartnerName(list[i].partnerId);
			rowZones[i] = findZoneName(list[i].zoneId);
		}

		drawList();
	}


	/* 번호로 이름을 찾는 함수들.
	   서버는 번호만 주기 때문에 이름은 기준 데이터에서 찾아 씁니다. */

	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}


	function findItemUnit(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemUnitList[i];
			}
		}
		return "";
	}


	function findPartnerName(partnerId) {

		for (let i = 0; i < supplierIds.length; i++) {
			if (supplierIds[i] == partnerId) {
				return supplierNames[i];
			}
		}
		for (let i = 0; i < customerIds.length; i++) {
			if (customerIds[i] == partnerId) {
				return customerNames[i];
			}
		}
		return "거래처 " + partnerId;
	}


	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	function drawList() {

		let html = "";

		if (rowLotIds.length == 0) {
			document.querySelector("#inBody").innerHTML = "<tr><td colspan='11'>입고 이력이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		let startNo = (nowPage - 1) * pageSize;

		for (let i = 0; i < rowLotIds.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + (startNo + i + 1) + "</td>";
			html = html + "<td>" + rowDates[i] + "</td>";
			html = html + "<td>ITEM-" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLotIds[i] + "</td>";
			html = html + "<td>" + rowNames[i] + "</td>";
			html = html + "<td>" + rowQtys[i] + "</td>";
			html = html + "<td>" + rowUnits[i] + "</td>";
			html = html + "<td>" + rowExpiries[i] + "</td>";
			html = html + "<td>" + rowPartners[i] + "</td>";
			html = html + "<td>" + rowZones[i] + "</td>";
			html = html + "<td><button class='delete-btn' onclick='doDelete(" + i + ")'>삭제</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#inBody").innerHTML = html;
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadData();
	}


	/* ============================================================
	   입고 등록  (POST /api/inbound)
	   ============================================================ */
	function doRegister() {

		if (isBlank(["#inDate", "#inName", "#inQty"]) == true) {
			alert("입고일, 품목명, 수량을 채워 주세요.");
			return;
		}

		let itemId = getItemId(document.querySelector("#inName").value);

		if (itemId == -1) {
			alert("등록되지 않은 품목입니다.\n후보 목록에서 골라 주세요.");
			return;
		}

		let qty = document.querySelector("#inQty").value * 1;

		if (qty <= 0) {
			alert("수량은 1개 이상이어야 합니다.");
			return;
		}

		/* 구역은 창고+단위로 자동 결정됩니다(pickSameZone). 이 창고에 그
		   단위와 같은 이름의 구역 자체가 없으면 입고할 곳이 없는 것입니다. */
		if (inZoneId == -1) {
			alert("이 창고에는 이 품목 단위(" + document.querySelector("#inUnit").value + ")와 같은 이름의 구역이 없습니다.\n다른 창고를 골라 주세요.");
			return;
		}

		let body = {
			itemId: itemId,
			zoneId: inZoneId,
			partnerId: getSelectValue("#inPartner") * 1,
			quantity: qty,
			inboundDate: document.querySelector("#inDate").value
		};

		apiSend("POST", "/api/inbound", body, afterRegister);
	}


	/* 등록이 끝나면 서버가 만든 로트번호와 유통기한을 알려 줍니다 */
	function afterRegister(data) {

		let msg = "입고가 등록되었습니다. (로트번호 LOT-" + data.lotId + ")";

		if (data.expiryDate != null) {
			msg = msg + "\n유통기한: " + data.expiryDate;
		}

		if (data.alertCreated == true) {
			msg = msg + "\n\n재고초과 알림이 생성되었습니다.";
		}

		clearInput(["#inQty"]);
		nowPage = 1;
		loadData();
		alert(msg);
	}


	/* ============================================================
	   삭제  (DELETE /api/stock-lots/{id})
	   관리자만 할 수 있고, 사유를 함께 보냅니다.
	   ============================================================ */
	function doDelete(index) {

		if (confirm("LOT-" + rowLotIds[index] + " 입고 기록을 삭제할까요?") == false) {
			return;
		}

		apiSend("DELETE", "/api/stock-lots/" + rowLotIds[index] + "?reason=" + encodeURIComponent("입고 오입력"), null, afterDelete);
	}


	function afterDelete(data) {
		loadData();
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 바로 다시 받아오고, 연결이 끊기거나 신호를 놓쳐도
	   5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다(alert.html과
	   동일한 패턴). 이 화면엔 모달이 없어서 별다른 guard 없이 바로 새로고침합니다.
	   입고("inbound")뿐 아니라 발주 승인이 자동실행되면서 새 입고가 생길 수도
	   있으니 "approval"도 같이 구독합니다.
	   ============================================================ */
	connectRealtimeRefresh(loadData, ["inbound", "approval"]);
	setInterval(loadData, 5000);

</script>

</body>



</html>

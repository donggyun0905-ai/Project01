<!DOCTYPE html> <!-- 보고서 내보내기 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>보고서 및 내보내기</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--report css -->
	<link rel="stylesheet" href="../css/report.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a class="active" href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='statistics.html'">통계 대시보드</button> 
			<button class="menu-btn active">보고서 및 내보내기</button> 
		</header>
		
		<section class="reportbox"> <!-- 일일 보고서 -->
			<h3>일일 보고서</h3>
			
			<div class="form-group">
				<label>기준일</label>
				<div class="date-range">
					<input type="date" id="reportDate">
				</div>
			</div>

			<!-- 왼쪽 : 기준일 바꾸면 같이 바뀌는 것들 (전일 대비 / TOP 출고 품목)
			     오른쪽 : 기준일이랑 상관없이 "지금" 기준으로 항상 같은 부족 품목
			     서로 성격이 달라서 얇은 선으로 나눠 구분했습니다. -->
			<div class="report-columns">

				<div class="report-col">
					<div class="form-group">
						<label>전일 대비</label>
						<div class="top-itemlist" id="sumArea"></div>
					</div>

					<div class="form-group">
						<label>TOP 출고 품목</label>
						<div class="top-itemlist" id="topArea"></div>
					</div>
				</div>

				<div class="report-col report-col-divider">
					<div class="form-group align-top">
						<label>부족 품목</label>
						<div class="top-itemlist scrollable" id="lowArea"></div>
					</div>
				</div>

			</div>
			
			<div class="btn-row">
				<button class="ghost" onclick="exportDailyPdf()">PDF로 다운로드</button>
				<button class="make" onclick="makeReport()">보고서 생성하기</button>
			</div>
		</section>
		
		<section class="report"> <!-- 데이터 내보내기 -->
			<h3>데이터 내보내기</h3>
			
			<div class="form-group">
				<label>데이터</label>
				<select id="dataType" onchange="changeDataType()">
					<option value="inout">입출고 로그</option>
					<option value="alerts">알림 이력</option>
					<option value="statistics">통계 리포트</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>기간</label>
				<div class="date-range">
					<input type="date" id="fromDate">
				</div>
				
				<div class="date-range">
					<input type="date" id="toDate">
				</div>
			</div>
			
			<!-- 통계 리포트를 골랐을 때만 나오는 칸입니다 (집계 단위 + 거래처 월별 추이 기간) -->
			<div class="form-group" id="statOptionArea" style="display:none;">
				<label>집계 단위</label>
				<select id="statUnit">
					<option value="day">일</option>
					<option value="week">주</option>
					<option value="month">월</option>
				</select>
			</div>

			<div class="form-group" id="statTrendArea" style="display:none;">
				<label>거래처 월별 추이 기간</label>
				<div class="date-range">
					<input type="month" id="trendStart">
				</div>
				<div class="date-range">
					<input type="month" id="trendEnd">
				</div>
			</div>
			
			<div class="form-group">
				<label>형식</label>
				<div class="radio-group">
					<label><input type="radio" name="format" value="CSV" checked>CSV</label>
					<label><input type="radio" name="format" value="Excel">Excel</label>
				</div>
			</div>
			
			<div id="msgArea"></div>
			
			<button class="push" onclick="doExport()">내보내기</button>
		</section>
		
		
	</main>
	
	</div>

<!-- ============================================================
     보고서 / 내보내기 화면 로직
     ------------------------------------------------------------
     addComma 는 common.js 에 있습니다.
     파일 내보내기는 서버가 실제 파일(csv/xlsx/pdf)을 만들어서 주기 때문에
     saveFile()로 직접 CSV를 짜서 만드는 게 아니라, location.href로 그
     주소를 열어서 브라우저가 다운로드하게 합니다 (세션 쿠키가 자동으로
     따라가서 별도 처리가 필요 없습니다).
     ============================================================ -->
<script>

	/* ---------- 일일 보고서 자료 ---------- */

	let inTotal = 0;      // 입고량
	let inDiff = 0;       // 전일 대비 %
	let outTotal = 0;     // 출고량
	let outDiff = 0;

	let lowNames = [];    // 부족 품목
	let lowStocks = [];
	let lowMins = [];

	let topNames = [];    // 많이 나간 품목
	let topQtys = [];


	/* 기준일의 보고서 자료를 가져옵니다 (GET /api/reports/daily) */
	function loadReportData(day) {
		apiGet("/api/reports/daily?date=" + day, putReport);
	}


	function putReport(data) {

		let comp = data.dailyComparison;

		// 그 날짜에 비교할 전일 자료가 없으면 null로 옵니다
		if (comp == null) {
			inTotal = 0;
			inDiff = 0;
			outTotal = 0;
			outDiff = 0;
		} else {
			inTotal = comp.todayInboundQty;
			outTotal = comp.todayOutboundQty;
			// 전일 수량이 0이면 증감률이 null로 옵니다 (계산 불가)
			inDiff = comp.inboundQtyChangeRate == null ? 0 : Math.round(comp.inboundQtyChangeRate * 10) / 10;
			outDiff = comp.outboundQtyChangeRate == null ? 0 : Math.round(comp.outboundQtyChangeRate * 10) / 10;
		}

		lowNames  = [];
		lowStocks = [];
		lowMins   = [];

		let low = data.lowStockItem;
		for (let i = 0; i < low.length; i++) {
			lowNames[i]  = low[i].itemName;
			lowStocks[i] = low[i].currentQty;
			lowMins[i]   = low[i].minQty;
		}

		topNames = [];
		topQtys  = [];

		let top = data.topOutboundItem;
		for (let i = 0; i < top.length; i++) {
			topNames[i] = top[i].itemName;
			topQtys[i]  = top[i].totalOutboundQty;
		}

		drawReport();
	}


	/* 보고서 생성 버튼 */
	function makeReport() {

		let day = document.querySelector("#reportDate").value;

		if (day == "") {
			alert("기준일을 골라 주세요.");
			return;
		}

		loadReportData(day);
	}


	/* 가져온 자료로 보고서를 그립니다 (단위는 서버가 EA로 통일해서 줍니다) */
	function drawReport() {

		/* ---- 전일 대비 ---- */
		let html = "";
		html = html + makeSumRow("입고량", inTotal, inDiff);
		html = html + makeSumRow("출고량", outTotal, outDiff);
		document.querySelector("#sumArea").innerHTML = html;

		/* ---- 부족 품목 ---- */
		html = "";

		if (lowNames.length == 0) {
			html = "<p>해당 없음</p>";
		} else {
			for (let i = 0; i < lowNames.length; i++) {
				html = html + '<div class="top-item">';
				html = html + "<span>" + lowNames[i] + "</span>";
				html = html + "<span>" + lowStocks[i] + "EA / 최소 " + lowMins[i] + "EA</span>";
				html = html + "</div>";
			}
		}
		document.querySelector("#lowArea").innerHTML = html;

		/* ---- 많이 나간 품목 ---- */
		html = "";

		if (topNames.length == 0) {
			html = "<p>해당 없음</p>";
		} else {
			for (let i = 0; i < topNames.length; i++) {
				html = html + '<div class="top-item">';
				html = html + "<span>" + (i + 1) + ". " + topNames[i] + "</span>";
				html = html + "<span>" + addComma(topQtys[i]) + "EA</span>";
				html = html + "</div>";
			}
		}
		document.querySelector("#topArea").innerHTML = html;
	}


	/* 전일 대비 한 줄을 만듭니다 */
	function makeSumRow(name, total, diff) {

		let html = '<div class="top-item">';
		html = html + "<span>" + name + "</span>";
		html = html + "<span>" + addComma(total) + "EA</span>";

		if (diff > 0) {
			html = html + "<span>▲ " + diff + "%</span>";
		} else if (diff < 0) {
			html = html + "<span>▼ " + (diff * -1) + "%</span>";
		} else {
			html = html + "<span>-</span>";
		}

		html = html + "</div>";
		return html;
	}


	/* 일일 보고서 PDF 다운로드 (GET /api/export/daily/pdf) */
	function exportDailyPdf() {

		let day = document.querySelector("#reportDate").value;

		if (day == "") {
			alert("기준일을 골라 주세요.");
			return;
		}

		location.href = makeUrl("/api/export/daily/pdf?date=" + day);
	}


	/* ---------------------------------------------------------
	   데이터 내보내기

	   서버가 실제로 지원하는 내보내기는 3종류뿐입니다.
	   - 입출고 로그 (입고+출고 통합, /api/export/inout)
	   - 알림 이력 (/api/export/alerts)
	   - 통계 리포트 (입출고 집계 전체/대형/중형/소형 + 회전율 + 거래처
	     TOP5 + 월별 추이를 한 파일로, /api/export/statistics)
	   이동 로그·반품/폐기 로그는 내보내기 API 자체가 없어서 뺐습니다.
	   --------------------------------------------------------- */

	/* 데이터 종류를 바꾸면 통계 리포트 전용 칸을 보여주거나 숨깁니다 */
	function changeDataType() {

		let type = document.querySelector("#dataType").value;
		let show = (type == "statistics") ? "block" : "none";

		document.querySelector("#statOptionArea").style.display = show;
		document.querySelector("#statTrendArea").style.display = show;
	}


	function doExport() {

		let type = document.querySelector("#dataType").value;
		let from = document.querySelector("#fromDate").value;
		let to = document.querySelector("#toDate").value;

		if (from == "" || to == "") {
			alert("기간을 모두 골라 주세요.");
			return;
		}

		if (from > to) {
			alert("시작일이 종료일보다 늦을 수 없습니다.");
			return;
		}

		/* 라디오 버튼 중에 고른 값을 찾습니다 */
		let fileType = "CSV";
		let radios = document.getElementsByName("format");

		for (let i = 0; i < radios.length; i++) {
			if (radios[i].checked == true) {
				fileType = radios[i].value;
			}
		}

		let ext = (fileType == "Excel") ? "excel" : "csv";
		let path = "";

		if (type == "inout") {
			path = "/api/export/inout/" + ext + "?from=" + from + "&to=" + to;

		} else if (type == "alerts") {
			path = "/api/export/alerts/" + ext + "?from=" + from + "&to=" + to;

		} else {
			// 통계 리포트 - 집계 단위, 월별 추이 기간까지 같이 보냅니다
			let unit = document.querySelector("#statUnit").value;
			let trendStart = document.querySelector("#trendStart").value;
			let trendEnd = document.querySelector("#trendEnd").value;

			path = "/api/export/statistics/" + ext
				+ "?unit=" + unit + "&from=" + from + "&to=" + to
				+ "&start=" + trendStart + "&end=" + trendEnd;
		}

		location.href = makeUrl(path);

		document.querySelector("#msgArea").innerHTML = "<p>다운로드를 시작합니다.</p>";
	}


	/* 화면이 열릴 때 오늘 날짜를 기준일에 넣어 둡니다 */
	document.querySelector("#reportDate").value = getToday();
	loadReportData(getToday());

	/* 내보내기 기간도 최근 일주일로 기본값을 넣어 둡니다 */
	let today = new Date();
	let weekAgo = new Date();
	weekAgo.setDate(weekAgo.getDate() - 6);
	document.querySelector("#toDate").value = getDateText(today);
	document.querySelector("#fromDate").value = getDateText(weekAgo);


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

</body>


</html>

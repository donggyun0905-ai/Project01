<!DOCTYPE html> <!-- 보고서 내보내기 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>보고서 및 내보내기</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--report css -->
	<link rel="stylesheet" href="../css/report.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a class="active" href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<header class="top-menu">
			<button class="menu-btn" onclick="location.href='statistics.html'">통계 대시보드</button> 
			<button class="menu-btn active">보고서 및 내보내기</button> 
		</header>
		
		<!-- 왼쪽 : 일일 보고서(문서), 오른쪽 : 데이터 내보내기.
		     문서를 전체 폭으로 넙적하게 펼치지 않고 옆으로 붙여서 좁혀 둡니다. -->
		<div class="report-layout">

		<!-- 하나의 보고서 문서처럼 보이게 - 카드 여러 개로 흩어놓지 않고
		     한 틀 안에 전일 대비 / TOP 출고 품목 / 부족 품목을 순서대로 담습니다.
		     기준일을 날짜별로 다른 문서를 펼쳐보는 느낌으로 크게 보여줍니다. -->
		<section class="report-doc">

			<div class="report-doc-header">
				<div>
					<div class="report-doc-eyebrow">일일 보고서</div>
					<h2 id="reportTitleDate">-</h2>
				</div>

				<div class="report-doc-actions">
					<input type="date" id="reportDate" onchange="makeReport()">
					<button class="pdf-btn" onclick="exportDailyPdf()">PDF로 다운로드</button>
				</div>
			</div>

			<div class="doc-section">
				<h4 class="doc-section-title">전일 대비</h4>
				<div class="doc-stat-row">
					<div class="doc-stat">
						<span class="doc-stat-name">입고량</span>
						<span class="doc-stat-num"><span id="inCountText">-</span> EA</span>
						<div id="inDiffArea"></div>
					</div>
					<div class="doc-stat">
						<span class="doc-stat-name">출고량</span>
						<span class="doc-stat-num"><span id="outCountText">-</span> EA</span>
						<div id="outDiffArea"></div>
					</div>
				</div>
			</div>

			<div class="doc-section doc-section-last doc-section-row">

				<div class="doc-col">
					<h4 class="doc-section-title">TOP 출고 품목</h4>
					<div id="topArea"></div>
				</div>

				<div class="doc-col">
					<h4 class="doc-section-title">부족 품목</h4>
					<div class="scrollable-list" id="lowArea"></div>
				</div>

			</div>

		</section>
		
		<section class="report report-side"> <!-- 데이터 내보내기 -->
			<h3>데이터 내보내기</h3>

			<div class="form-group">
				<label>데이터</label>
				<select id="dataType" onchange="changeDataType()">
					<option value="inout">입출고 로그</option>
					<option value="alerts">알림 이력</option>
					<option value="statistics">통계 리포트</option>
				</select>
			</div>
			
			<div class="form-group">
				<label>기간</label>
				<div class="date-range">
					<input type="date" id="fromDate">
				</div>
				
				<div class="date-range">
					<input type="date" id="toDate">
				</div>
			</div>
			
			<!-- 통계 리포트를 골랐을 때만 나오는 칸입니다 (집계 단위 + 거래처 월별 추이 기간) -->
			<div class="form-group" id="statOptionArea" style="display:none;">
				<label>집계 단위</label>
				<select id="statUnit">
					<option value="day">일</option>
					<option value="week">주</option>
					<option value="month">월</option>
				</select>
			</div>

			<div class="form-group" id="statTrendArea" style="display:none;">
				<label>거래처 월별 추이 기간</label>
				<div class="date-range">
					<input type="month" id="trendStart">
				</div>
				<div class="date-range">
					<input type="month" id="trendEnd">
				</div>
			</div>
			
			<div class="form-group last-form-group">
				<label>형식</label>
				<div class="format-toggle">
					<button type="button" class="format-btn active" id="fmtCsvBtn" onclick="pickFormat('CSV')">CSV</button>
					<button type="button" class="format-btn" id="fmtExcelBtn" onclick="pickFormat('Excel')">Excel</button>
				</div>
			</div>
			
			<div id="msgArea"></div>

			<!-- 품목 데이터 엑셀화는 위 드롭다운(입출고 로그/알림 이력/통계 리포트)에 없는
			     별개의 내보내기라, 형식/기간 선택과 무관하게 바로 다운로드되는 버튼을 따로 둡니다. -->
			<div class="export-actions">
				<button class="push" onclick="exportItemsExcel()">품목 데이터 엑셀화</button>
				<button class="push" onclick="doExport()">내보내기</button>
			</div>
		</section>

		</div>

	</main>
	
	</div>

<!-- ============================================================
     보고서 / 내보내기 화면 로직
     ------------------------------------------------------------
     addComma 는 common.js 에 있습니다.
     파일 내보내기는 서버가 실제 파일(csv/xlsx/pdf)을 만들어서 주기 때문에
     saveFile()로 직접 CSV를 짜서 만드는 게 아니라, location.href로 그
     주소를 열어서 브라우저가 다운로드하게 합니다 (세션 쿠키가 자동으로
     따라가서 별도 처리가 필요 없습니다).
     ============================================================ -->
<script>

	/* ---------- 일일 보고서 자료 ---------- */

	let inTotal = 0;      // 입고량
	let inDiff = 0;       // 전일 대비 %
	let outTotal = 0;     // 출고량
	let outDiff = 0;

	let lowNames = [];    // 부족 품목
	let lowStocks = [];
	let lowMins = [];

	let topNames = [];    // 많이 나간 품목
	let topQtys = [];


	/* 기준일의 보고서 자료를 가져옵니다 (GET /api/reports/daily) */
	function loadReportData(day) {
		apiGet("/api/reports/daily?date=" + day, putReport);
	}


	function putReport(data) {

		let comp = data.dailyComparison;

		// 그 날짜에 비교할 전일 자료가 없으면 null로 옵니다
		if (comp == null) {
			inTotal = 0;
			inDiff = 0;
			outTotal = 0;
			outDiff = 0;
		} else {
			inTotal = comp.todayInboundQty;
			outTotal = comp.todayOutboundQty;
			// 전일 수량이 0이면 증감률이 null로 옵니다 (계산 불가)
			inDiff = comp.inboundQtyChangeRate == null ? 0 : Math.round(comp.inboundQtyChangeRate * 10) / 10;
			outDiff = comp.outboundQtyChangeRate == null ? 0 : Math.round(comp.outboundQtyChangeRate * 10) / 10;
		}

		lowNames  = [];
		lowStocks = [];
		lowMins   = [];

		let low = data.lowStockItem;
		for (let i = 0; i < low.length; i++) {
			lowNames[i]  = low[i].itemName;
			lowStocks[i] = low[i].currentQty;
			lowMins[i]   = low[i].minQty;
		}

		topNames = [];
		topQtys  = [];

		let top = data.topOutboundItem;
		for (let i = 0; i < top.length; i++) {
			topNames[i] = top[i].itemName;
			topQtys[i]  = top[i].totalOutboundQty;
		}

		drawReport();
	}


	/* 기준일이 바뀌면(날짜 입력 onchange) 그 날짜로 다시 불러옵니다.
	   문서 제목도 같이 바꿔서 "다른 날짜의 문서를 펼쳐본" 느낌이 나게 합니다. */
	function makeReport() {

		let day = document.querySelector("#reportDate").value;

		if (day == "") {
			alert("기준일을 골라 주세요.");
			return;
		}

		document.querySelector("#reportTitleDate").innerHTML = day;
		loadReportData(day);
	}


	/* 가져온 자료로 보고서를 그립니다 (단위는 서버가 EA로 통일해서 줍니다) */
	function drawReport() {

		/* ---- 전일 대비 : 메인 화면 요약카드와 같은 방식(숫자 + 증감 배지) ---- */
		document.querySelector("#inCountText").innerHTML = addComma(inTotal);
		document.querySelector("#outCountText").innerHTML = addComma(outTotal);
		document.querySelector("#inDiffArea").innerHTML = makeDiffBadge(inDiff);
		document.querySelector("#outDiffArea").innerHTML = makeDiffBadge(outDiff);

		/* ---- TOP 출고 품목 : 순위를 동그란 배지로 보여줍니다 ---- */
		let html = "";

		if (topNames.length == 0) {
			html = "<p class='panel-empty'>해당 없음</p>";
		} else {

			let maxQty = 0;
			for (let i = 0; i < topQtys.length; i++) {
				if (topQtys[i] > maxQty) {
					maxQty = topQtys[i];
				}
			}

			for (let i = 0; i < topNames.length; i++) {

				let percent = 0;
				if (maxQty > 0) {
					percent = Math.round(topQtys[i] / maxQty * 100);
				}

				html = html + "<div class='rank-row'>";
				html = html + "<span class='rank-badge'>" + (i + 1) + "</span>";
				html = html + "<div class='rank-body'>";
				html = html + "<div class='rank-top'>";
				html = html + "<span class='rank-name'>" + topNames[i] + "</span>";
				html = html + "<span class='rank-qty'>" + addComma(topQtys[i]) + " EA</span>";
				html = html + "</div>";
				html = html + "<div class='rank-bar'><div class='rank-bar-fill' style='width:" + percent + "%'></div></div>";
				html = html + "</div>";
				html = html + "</div>";
			}
		}
		document.querySelector("#topArea").innerHTML = html;

		/* ---- 부족 품목 : 현재/최소 비율을 작은 막대로 같이 보여줍니다 ---- */
		html = "";

		if (lowNames.length == 0) {
			html = "<p class='panel-empty'>해당 없음</p>";
		} else {
			for (let i = 0; i < lowNames.length; i++) {

				let percent = 0;
				if (lowMins[i] > 0) {
					percent = Math.round(lowStocks[i] / lowMins[i] * 100);
				}
				if (percent > 100) {
					percent = 100;
				}

				html = html + "<div class='low-row'>";
				html = html + "<div class='low-top'>";
				html = html + "<span class='low-name'>" + lowNames[i] + "</span>";
				html = html + "<span class='low-qty'>" + lowStocks[i] + " / 최소 " + lowMins[i] + " EA</span>";
				html = html + "</div>";
				html = html + "<div class='low-bar'><div class='low-bar-fill' style='width:" + percent + "%'></div></div>";
				html = html + "</div>";
			}
		}
		document.querySelector("#lowArea").innerHTML = html;
	}


	/* 증감 배지 - 메인 화면 카드의 ▲/▼ 배지와 같은 규칙 */
	function makeDiffBadge(diff) {

		if (diff > 0) {
			return "<span class='diff diff-up'>▲ " + diff + "% 전일 대비</span>";
		}
		if (diff < 0) {
			return "<span class='diff diff-down'>▼ " + (diff * -1) + "% 전일 대비</span>";
		}
		return "";
	}


	/* 품목 데이터 엑셀화 (GET /api/export/items/excel) */
	function exportItemsExcel() {
		location.href = makeUrl("/api/export/items/excel");
	}


	/* 일일 보고서 PDF 다운로드 (GET /api/export/daily/pdf) */
	function exportDailyPdf() {

		let day = document.querySelector("#reportDate").value;

		if (day == "") {
			alert("기준일을 골라 주세요.");
			return;
		}

		location.href = makeUrl("/api/export/daily/pdf?date=" + day);
	}


	/* ---------------------------------------------------------
	   데이터 내보내기

	   서버가 실제로 지원하는 내보내기는 3종류뿐입니다.
	   - 입출고 로그 (입고+출고 통합, /api/export/inout)
	   - 알림 이력 (/api/export/alerts)
	   - 통계 리포트 (입출고 집계 전체/대형/중형/소형 + 회전율 + 거래처
	     TOP5 + 월별 추이를 한 파일로, /api/export/statistics)
	   이동 로그·반품/폐기 로그는 내보내기 API 자체가 없어서 뺐습니다.
	   --------------------------------------------------------- */

	/* 데이터 종류를 바꾸면 통계 리포트 전용 칸을 보여주거나 숨깁니다 */
	function changeDataType() {

		let type = document.querySelector("#dataType").value;
		let show = (type == "statistics") ? "block" : "none";

		document.querySelector("#statOptionArea").style.display = show;
		document.querySelector("#statTrendArea").style.display = show;
	}


	/* CSV / Excel 형식 토글 (라디오 버튼 대신 버튼 두 개로) */
	let pickedFormat = "CSV";

	function pickFormat(fmt) {

		pickedFormat = fmt;

		document.querySelector("#fmtCsvBtn").className = (fmt == "CSV") ? "format-btn active" : "format-btn";
		document.querySelector("#fmtExcelBtn").className = (fmt == "Excel") ? "format-btn active" : "format-btn";
	}


	function doExport() {

		let type = document.querySelector("#dataType").value;
		let from = document.querySelector("#fromDate").value;
		let to = document.querySelector("#toDate").value;

		if (from == "" || to == "") {
			alert("기간을 모두 골라 주세요.");
			return;
		}

		if (from > to) {
			alert("시작일이 종료일보다 늦을 수 없습니다.");
			return;
		}

		let ext = (pickedFormat == "Excel") ? "excel" : "csv";
		let path = "";

		if (type == "inout") {
			path = "/api/export/inout/" + ext + "?from=" + from + "&to=" + to;

		} else if (type == "alerts") {
			path = "/api/export/alerts/" + ext + "?from=" + from + "&to=" + to;

		} else {
			// 통계 리포트 - 집계 단위, 월별 추이 기간까지 같이 보냅니다
			let unit = document.querySelector("#statUnit").value;
			let trendStart = document.querySelector("#trendStart").value;
			let trendEnd = document.querySelector("#trendEnd").value;

			path = "/api/export/statistics/" + ext
				+ "?unit=" + unit + "&from=" + from + "&to=" + to
				+ "&start=" + trendStart + "&end=" + trendEnd;
		}

		location.href = makeUrl(path);

		document.querySelector("#msgArea").innerHTML = "<p>다운로드를 시작합니다.</p>";
	}


	/* 화면이 열릴 때 오늘 날짜를 기준일에 넣어 둡니다 */
	document.querySelector("#reportDate").value = getToday();
	document.querySelector("#reportTitleDate").innerHTML = getToday();
	loadReportData(getToday());

	/* 내보내기 기간도 최근 일주일로 기본값을 넣어 둡니다 */
	let today = new Date();
	let weekAgo = new Date();
	weekAgo.setDate(weekAgo.getDate() - 6);
	document.querySelector("#toDate").value = getDateText(today);
	document.querySelector("#fromDate").value = getDateText(weekAgo);


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

</body>


</html>

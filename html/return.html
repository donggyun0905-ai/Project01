	<main class="content">
	

	<div class="top-bar">
		<h4 class= "page-title">반품 및 폐기 관리</h4>
	</div>
		
		<!-- 입력폼 -->
		<section class="form-box">
			<div class="form-group">
				<label>출고일</label>
				<input type="date">
			</div>
			
			<div class="form-group expiration-group">
				<label>유통기한</label>
				<div class= "date-range">
					<input type="date">
					<span>~</span>
					<input type="date">
				</div>
			</div>
			
			<div class="form-group">
				<label> 카테고리</label> <!-- 임의로 넣어놨습니다 -->
				<select>
					<option>냉동식품</option>
					<option>냉장식품</option>
					<option>유제품</option>
				</select>
			</div>
				
			<!-- 기존 반품 등록/ 폐기 등록을 하나로 합쳤습니다-->
			<button class="register-btn">반품/폐기 등록하기</button>
		</section>
		
		<!-- 출고 입력(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">반품/폐기 내역</h4>
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>구분</th> <!-- 반품/폐기 중 하나-->
						<th>처리 유형</th> <!-- 고객 반품, 공급처 반품, 폐기 등등-->
						<th>품목명</th>
						<th>품목 코드</th>
						<th>로트 번호</th>
						<th>구역</th>
						<th>수량</th>
						<th>사유</th> <!-- 배송 실수, 고객 변심 등등 -->
						<th>처리일</th>
						<th>담당자</th>
						<th>상태</th> <!-- 처리 중인지, 완료 되었는지, 대기 중인/  이 부분은 구현하기 어려우면 빼도 좋을 것 같습니다-->

						<td>1</td>

					<tr>

						<td>115</td>

						<td>2026-11-25</td>
						<td>홍길동</td>

<!-- 반품/폐기 등록 페이지 모달-->
<div class = "modal-overlay" id="recommendModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>반품/폐기 등록</h3>
			<button class = "modal-close"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label> 구분</label> 
				<select>
					<option>반품</option>
					<option>폐기</option>
				</select>
			</div>
				
			<div class="form-group">
				<label>처리 유형</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>품목명</label>
				<input type= "text">
			</div>

				<label>품목 번호</label>

			</div>
			
			<div class="form-group">

			</div>

					<option>A</option>

			</div>
			
			<div class="form-group">
				<label>사유</label>

			</div>
			
			<div class="form-group">
				<label>처리일</label>

				</div>

		</section>
			<div class="modal-footer">
				<button class= "btn-cancel">취소</button>
				<button class= "btn-primary">등록</button>

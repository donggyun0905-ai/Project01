<!-- ============================================================
     반품 / 폐기 화면 로직
     ------------------------------------------------------------
     서버(ReturnDisposalService)와 같은 규칙을 씁니다.
       - 로트에 남은 수량보다 많이 처리할 수 없음
       - 남은 수량 전체를 처리하면 그 로트는 더 이상 정상 재고가 아님
         (반품이면 RETURNED, 폐기면 DISPOSED 상태가 됨)
       - 일부만 처리하면 원본은 수량만 줄고, 처리된 만큼만 새 로트로 분리됨
     ============================================================ -->
<script>

	/* ============================================================
	   반품 / 폐기 - 서버 연동

	   보내는 값 : lotId / type / reason / quantity /
	              processedBy / processedDate

	   남은 수량 전체를 처리하면 그 로트가 통째로 빠지고,
	   일부만 처리하면 처리한 만큼만 새 로트로 나뉩니다.
	   ============================================================ */

	/* 고른 품목의 로트들 (표에 뿌려서 체크박스로 여러 개를 함께 고릅니다) */
	let lotIds = [];
	let lotQtys = [];
	let lotZoneTexts = [];
	let lotInDates = [];
	let lotExpDates = [];
	let rowChecked = [];    // lotIds[i]를 골랐는지
	let rowQtyValues = [];  // 그 로트에서 처리할 수량

	/* 여러 로트를 순서대로 보낼 때 쓰는 값 (출고 등록과 같은 방식) */
	let sendList = [];
	let sendIndex = 0;
	let doneCount = 0;
	let alertCount = 0;
	let approvalCount = 0;

	/* 반품/폐기 내역 (서버에서 받아옴, GET /api/returns) */
	let rowIds = [];
	let rowTypes = [];
	let rowKinds = [];
	let rowItemIds = [];
	let rowLots = [];
	let rowZoneIds = [];
	let rowQtys = [];
	let rowDates = [];

	let nowPage = 1;
	let totalCount = 0;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillCategory("#fCategory");

		/* 거르기용 드롭다운에는 "전체"를 맨 앞에 넣어 줍니다 */
		let box = document.querySelector("#fCategory");
		box.innerHTML = "<option>전체</option>" + box.innerHTML;

		fillItemList("#itemList");
		changeType();
		loadHistory();
	}


	/* 구분(반품/폐기)에 따라 처리 유형이 달라집니다 */
	function changeType() {

		let type = document.querySelector("#rdType").value;
		let html = "";

		if (type == "반품") {
			html = "<option>고객반품</option><option>공급처반품</option>";
		} else {
			html = "<option>파손</option><option>유통기한만료</option><option>기타폐기</option>";
		}

		document.querySelector("#rdReason").innerHTML = html;
	}


	/* ============================================================
	   품목을 고르면 그 품목의 로트를 서버에서 받아옵니다
	   ============================================================ */
	function changeItem() {

		let i = findItemByName(document.querySelector("#rdName").value);

		if (i == -1) {
			document.querySelector("#rdCode").value = "";
			lotIds = [];
			rowChecked = [];
			rowQtyValues = [];
			drawLotTable();
			return;
		}

		document.querySelector("#rdCode").value = itemCodes[i];

		apiGet("/api/stock-lots?itemId=" + getItemId(itemNameList[i]) + "&status=NORMAL&size=200", putLots);
	}


	function putLots(data) {

		let list = data.items;

		lotIds = [];
		lotQtys = [];
		lotZoneTexts = [];
		lotInDates = [];
		lotExpDates = [];
		rowChecked = [];
		rowQtyValues = [];

		for (let i = 0; i < list.length; i++) {

			if (list[i].quantity <= 0) {
				continue;
			}

			let last = lotIds.length;

			lotIds[last] = list[i].lotId;
			lotQtys[last] = list[i].quantity;
			lotZoneTexts[last] = findZoneName(list[i].zoneId);
			lotInDates[last] = list[i].inboundDate;
			lotExpDates[last] = list[i].expiryDate == null ? "-" : list[i].expiryDate;
		}

		drawLotTable();
	}


	/* 로트 표를 그립니다. 체크박스로 여러 로트를 동시에 고르고,
	   고른 로트마다 오른쪽 입력칸에 처리 수량을 따로 넣습니다. */
	function drawLotTable() {

		let html = "";

		if (lotIds.length == 0) {
			html = "<tr><td colspan='7'>처리할 수 있는 재고가 없습니다</td></tr>";
		} else {
			for (let i = 0; i < lotIds.length; i++) {

				let checked = rowChecked[i] == true;
				let qtyVal = (rowQtyValues[i] == null) ? lotQtys[i] : rowQtyValues[i];

				/* 체크박스가 작아서 누르기 불편하다는 의견이 있어, 행 전체를 눌러도
				   체크되도록 tr에 onclick을 걸었습니다. 수량 입력칸은 클릭해서 값을
				   고쳐야 하니 그 칸만 stopPropagation으로 행 클릭이 안 먹게 막았습니다. */
				html = html + "<tr class='rd-lot-row" + (checked ? " picked" : "") + "' onclick='toggleRow(" + i + ")'>";
				html = html + "<td><input type='checkbox'" + (checked ? " checked" : "") + "></td>";
				html = html + "<td>LOT-" + lotIds[i] + "</td>";
				html = html + "<td>" + lotZoneTexts[i] + "</td>";
				html = html + "<td>" + addComma(lotQtys[i]) + "</td>";
				html = html + "<td>" + lotInDates[i] + "</td>";
				html = html + "<td>" + lotExpDates[i] + "</td>";
				html = html + "<td onclick='event.stopPropagation()'><input type='number' class='rd-row-qty' value='" + qtyVal + "' max='" + lotQtys[i] + "'"
				            + " onchange='onRowQtyChange(" + i + ")'" + (checked ? "" : " disabled") + "></td>";
				html = html + "</tr>";
			}
		}

		document.querySelector("#rdLotBody").innerHTML = html;
		updatePickedText();
	}


	/* 체크박스를 누르면 그 로트를 고르고, 처음 고를 때는 남은 수량 전체를 기본값으로 넣어 둡니다 */
	function toggleRow(i) {

		rowChecked[i] = !(rowChecked[i] == true);

		if (rowChecked[i] == true && (rowQtyValues[i] == null || rowQtyValues[i] <= 0)) {
			rowQtyValues[i] = lotQtys[i];
		}

		drawLotTable();
	}


	/* 로트별 처리 수량 입력칸 - 그 로트에 남은 수량(input의 max)을 넘으면 그 값으로 맞춰 줍니다
	   (입고/출고/이동 등록 화면과 같은 clamp 방식) */
	function onRowQtyChange(i) {

		let input = document.querySelectorAll(".rd-row-qty")[i];
		let value = input.value * 1;
		let maxVal = lotQtys[i];

		if (value > maxVal) {
			value = maxVal;
			alert("LOT-" + lotIds[i] + " 에는 " + addComma(maxVal) + "개까지만 있습니다.");
		}
		if (value < 0) {
			value = 0;
		}

		input.value = value;
		rowQtyValues[i] = value;

		updatePickedText();
	}


	function updatePickedText() {

		let area = document.querySelector("#rdPickedText");
		let count = 0;
		let total = 0;

		for (let i = 0; i < lotIds.length; i++) {
			if (rowChecked[i] == true && rowQtyValues[i] > 0) {
				count = count + 1;
				total = total + rowQtyValues[i];
			}
		}

		if (count == 0) {
			area.innerHTML = lotIds.length == 0 ? "" : "위 표에서 처리할 로트를 골라 주세요. (여러 개 가능)";
			return;
		}

		area.innerHTML = count + "개 로트 선택됨 · 처리 수량 합계 " + addComma(total) + "개";
	}


	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   등록 모달
	   ============================================================ */
	function openRegister() {
		document.querySelector("#rdDate").value = getToday();
		openModal("#registerModal");
	}


	function closeRegister() {
		closeModal("#registerModal");
	}


	/* ============================================================
	   반품/폐기 등록  (POST /api/returns)

	   서버는 로트 하나당 한 건씩만 받아서, 여러 로트를 골랐으면
	   출고 등록과 같은 방식으로 한 건씩 순서대로 보냅니다.
	   ============================================================ */
	function doRegister() {

		if (isBlank(["#rdName", "#rdDate"]) == true) {
			alert("품목명, 처리일을 채워 주세요.");
			return;
		}

		sendList = [];

		for (let i = 0; i < lotIds.length; i++) {
			if (rowChecked[i] == true && rowQtyValues[i] > 0) {
				sendList[sendList.length] = i;
			}
		}

		if (sendList.length == 0) {
			alert("처리할 로트를 하나 이상 고르고 수량을 넣어 주세요.");
			return;
		}

		if (sessionStorage.getItem("userId") == null) {
			alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
			return;
		}

		sendIndex = 0;
		doneCount = 0;
		alertCount = 0;
		approvalCount = 0;

		sendOneReturn();
	}


	function sendOneReturn() {

		/* 다 보냈으면 마무리합니다 */
		if (sendIndex >= sendList.length) {
			finishRegister();
			return;
		}

		let i = sendList[sendIndex];

		let body = {
			lotId: lotIds[i],
			type: document.querySelector("#rdType").value,
			reason: document.querySelector("#rdReason").value,
			quantity: rowQtyValues[i],
			processedBy: sessionStorage.getItem("userId") * 1,
			processedDate: document.querySelector("#rdDate").value
		};

		apiSend("POST", "/api/returns", body, afterOneReturn, failOneReturn);
	}


	function afterOneReturn(data) {

		doneCount = doneCount + 1;

		if (data.alertCreated == true) {
			alertCount = alertCount + 1;
		}
		if (data.approvalId != null) {
			approvalCount = approvalCount + 1;
		}

		sendIndex = sendIndex + 1;
		sendOneReturn();
	}


	/* 한 건이 실패해도 나머지는 계속 보냅니다 */
	function failOneReturn(message) {

		let i = sendList[sendIndex];
		alert("LOT-" + lotIds[i] + " 처리 실패\n" + message);

		sendIndex = sendIndex + 1;
		sendOneReturn();
	}


	function finishRegister() {

		closeRegister();

		let msg = "등록되었습니다. (로트 " + doneCount + "건)";

		if (alertCount > 0) {
			msg = msg + "\n재고부족 알림이 " + alertCount + "건 생성되었습니다.";
		}
		if (approvalCount > 0) {
			msg = msg + "\n발주 승인 요청이 " + approvalCount + "건 자동 생성되었습니다.";
		}

		/* 방금 등록한 내역이 바로 보이게 다시 받아옵니다 */
		nowPage = 1;
		loadHistory();

		/* 로트 수량이 바뀌었으니 목록을 다시 받아옵니다 */
		changeItem();

		alert(msg);
	}


	/* ============================================================
	   내역 표  (GET /api/returns)

	   유형/카테고리/품목명/기간 모두 서버가 직접 걸러줍니다 - 그래서 쪽 번호(total)도
	   필터링된 기준으로 정확히 나옵니다.
	   ============================================================ */
	function loadHistory() {

		let url = "/api/returns?page=" + nowPage + "&size=" + pageSize;

		let type = document.querySelector("#fType").value;
		let category = document.querySelector("#fCategory").value;
		let word = document.querySelector("#fName").value;
		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;

		if (type != "전체") {
			url = url + "&type=" + encodeURIComponent(type);
		}
		if (category != "전체") {
			url = url + "&category=" + encodeURIComponent(category);
		}
		if (word != "") {
			url = url + "&keyword=" + encodeURIComponent(word);
		}
		if (from != "") {
			url = url + "&from=" + from;
		}
		if (to != "") {
			url = url + "&to=" + to;
		}

		apiGet(url, putHistory);
	}


	/* 조건이 바뀌면 1페이지부터 다시 봅니다 */
	function doSearch() {
		nowPage = 1;
		loadHistory();
	}


	function pressEnter(e) {
		if (e.keyCode == 13) {
			doSearch();
		}
	}


	function putHistory(data) {

		let list = data.items;
		totalCount = data.total;

		rowIds = [];
		rowTypes = [];
		rowKinds = [];
		rowItemIds = [];
		rowLots = [];
		rowZoneIds = [];
		rowQtys = [];
		rowDates = [];

		for (let i = 0; i < list.length; i++) {
			rowIds[i] = list[i].recordId;
			rowTypes[i] = list[i].type;
			rowKinds[i] = list[i].reason;
			rowItemIds[i] = list[i].itemId;
			rowLots[i] = list[i].lotId;
			rowZoneIds[i] = list[i].zoneId;
			rowQtys[i] = list[i].quantity;
			rowDates[i] = list[i].processedDate;
		}

		drawList();
	}


	/* 품목 번호로 이름/카테고리를 찾습니다 (common.js가 받아 둔 품목 목록에서) */
	function findItemName(itemId) {

		for (let i = 0; i < itemCodes.length; i++) {
			if (itemCodes[i] == "ITEM-" + itemId) {
				return itemNameList[i];
			}
		}
		return "품목 " + itemId;
	}

	function drawList() {

		let html = "";

		if (rowTypes.length == 0) {
			document.querySelector("#rdBody").innerHTML = "<tr><td colspan='9'>반품/폐기 내역이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		let startNo = (nowPage - 1) * pageSize;

		for (let i = 0; i < rowTypes.length; i++) {

			html = html + "<tr>";
			html = html + "<td>" + (startNo + i + 1) + "</td>";
			html = html + "<td>" + rowTypes[i] + "</td>";
			html = html + "<td>" + rowKinds[i] + "</td>";
			html = html + "<td>" + findItemName(rowItemIds[i]) + "</td>";
			html = html + "<td>ITEM-" + rowItemIds[i] + "</td>";
			html = html + "<td>LOT-" + rowLots[i] + "</td>";
			html = html + "<td>" + findZoneName(rowZoneIds[i]) + "</td>";
			html = html + "<td>" + addComma(rowQtys[i]) + "</td>";
			html = html + "<td>" + rowDates[i] + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#rdBody").innerHTML = html;

		/* 쪽 번호는 서버가 준 전체 건수 기준입니다 (유형/카테고리/품목명/기간 필터도 서버가 이미 반영한 값) */
		drawPaging("#paging", totalCount, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		loadHistory();
	}


	/* 화면이 열릴 때 실행 */
	startUp();


	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 바로 다시 받아오고, 연결이 끊기거나 신호를 놓쳐도
	   5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다(alert.html과
	   동일한 패턴). 로트 선택 모달(체크박스 선택도 그 안에 있음)을 보고 있는
	   중에는 건너뜁니다.
	   ============================================================ */
	function refreshIfIdle() {
		let modal = document.querySelector("#registerModal");
		if (modal.className.indexOf("active") == -1) {
			loadHistory();
		}
	}

	connectRealtimeRefresh(refreshIfIdle, ["disposal"]);
	setInterval(refreshIfIdle, 5000);

</script>

</body>
</html>

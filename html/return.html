<!DOCTYPE html> <!-- 08.13 반품 및 폐기 관리-->
<!-- FIFO/FEFO 모달이 추가되었습니다 모달을 보려면 outbound.css에서 210번줄을 찾아가세요 -->
<!-- 모달 2개 있는데 지금은 첫번째 페이지만 뜹니다 2번째 보려면 맨 밑으로 가서 주석 해제하시면 2번째 페이지가 뜹니다 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>반품 및 폐기 관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/return.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a class="active" href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
	

	<div class="top-bar">
		<h4 class= "page-title">반품 및 폐기 관리</h4>
	</div>
		
		<!-- 입력폼 -->
		<section class="form-box">
				<div class="form-group">
					<label>구분</label>
					<select id="fType" onchange="drawList()">
						<option>전체</option>
						<option>반품</option>
						<option>폐기</option>
					</select>
				</div>
				
				<div class="form-group expiration-group">
					<label>처리일</label>
					<div class="date-range">
						<input type="date" id="fFrom" onchange="drawList()">
						<span>~</span>
						<input type="date" id="fTo" onchange="drawList()">
					</div>
				</div>
				
				<div class="form-group">
					<label>품목명</label>
					<input type="text" id="fName" placeholder="검색" onkeyup="drawList()">
				</div>
				
				<div class="form-group">
					<label>카테고리</label>
					<select id="fCategory" onchange="drawList()">
					</select>
				</div>
					
				<!-- 기존 반품 등록/ 폐기 등록을 하나로 합쳤습니다-->
				<button class="register-btn" onclick="openRegister()">반품/폐기 등록하기</button>
			</section>
		
		<!-- 출고 입력(표)  -->
		
		<section class= "table-box">
		<h4 class="table-title">반품/폐기 내역</h4>
			<div id="listNote" class="list-note"></div>
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>구분</th> <!-- 반품/폐기 중 하나-->
						<th>처리 유형</th> <!-- 고객 반품, 공급처 반품, 폐기 등등-->
						<th>품목명</th>
						<th>품목 코드</th>
						<th>로트 번호</th>
						<th>구역</th>
						<th>수량</th>
						<th>사유</th> <!-- 배송 실수, 고객 변심 등등 -->
						<th>처리일</th>
						<th>상태</th>
						<th>삭제</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
					<tbody id="rdBody">
					</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

<!-- 반품/폐기 등록 페이지 모달-->
<div class="modal-overlay" id="registerModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>반품/폐기 등록</h3>
			<button class="modal-close" onclick="closeRegister()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>구분</label>
				<select id="rdType" onchange="changeType()">
					<option>반품</option>
					<option>폐기</option>
				</select>
			</div>
				
			<div class="form-group">
				<label>처리 유형</label>
				<select id="rdReason">
				</select>
			</div>
			
			<div class="form-group">
				<label>품목명 (치면 후보가 뜹니다)</label>
				<input type="text" id="rdName" list="itemList" onchange="changeItem()" onkeyup="changeItem()" placeholder="예: 두부">
				<datalist id="itemList"></datalist>
			</div>
			
			<div class="form-group">
				<label>품목 번호</label>
				<input type="text" id="rdCode" readonly>
			</div>
			
			<div class="form-group">
				<label>로트 번호</label>
				<select id="rdLot" onchange="changeLot()">
				</select>
			</div>
			
			<div class="form-group">
				<label>구역</label>
				<input type="text" id="rdZone" readonly>
			</div>
		
			<div class="form-group">
				<label>수량 (남은 수량 이하)</label>
				<input type="number" id="rdQty">
			</div>
			
			<div class="form-group">
				<label>처리일</label>
				<div class="date-range">
					<input type="date" id="rdDate">
				</div>
			</div>

		</section>
			<div class="modal-footer">
				<button class="btn-cancel" onclick="closeRegister()">취소</button>
				<button class="btn-primary" onclick="doRegister()">등록</button>
			</div>
	</div>
</div>

<!-- ============================================================
     반품 / 폐기 화면 로직
     ------------------------------------------------------------
     서버(ReturnDisposalService)와 같은 규칙을 씁니다.
       - 로트에 남은 수량보다 많이 처리할 수 없음
       - 남은 수량 전체를 처리하면 그 로트는 더 이상 정상 재고가 아님
         (반품이면 RETURNED, 폐기면 DISPOSED 상태가 됨)
       - 일부만 처리하면 원본은 수량만 줄고, 처리된 만큼만 새 로트로 분리됨
     ============================================================ -->
<script>

	/* ============================================================
	   반품 / 폐기 - 서버 연동

	   보내는 값 : lotId / type / reason / quantity /
	              processedBy / processedDate

	   남은 수량 전체를 처리하면 그 로트가 통째로 빠지고,
	   일부만 처리하면 처리한 만큼만 새 로트로 나뉩니다.
	   ============================================================ */

	/* 고른 품목의 로트들 */
	let lotIds = [];
	let lotQtys = [];
	let lotZoneTexts = [];

	/* 반품/폐기 내역 (이 화면에서 등록한 것만) */
	let rowTypes = [];
	let rowKinds = [];
	let rowNames = [];
	let rowCodes = [];
	let rowLots = [];
	let rowCategories = [];
	let rowZones = [];
	let rowQtys = [];
	let rowNotes = [];
	let rowDates = [];

	let nowPage = 1;


	function startUp() {
		loadMasterFromServer(afterMaster);
	}


	function afterMaster() {

		fillCategory("#fCategory");

		/* 거르기용 드롭다운에는 "전체"를 맨 앞에 넣어 줍니다 */
		let box = document.querySelector("#fCategory");
		box.innerHTML = "<option>전체</option>" + box.innerHTML;

		fillItemList("#itemList");
		changeType();
		drawList();
	}


	/* 구분(반품/폐기)에 따라 처리 유형이 달라집니다 */
	function changeType() {

		let type = document.querySelector("#rdType").value;
		let html = "";

		if (type == "반품") {
			html = "<option>고객반품</option><option>공급처반품</option>";
		} else {
			html = "<option>파손</option><option>유통기한만료</option><option>기타폐기</option>";
		}

		document.querySelector("#rdReason").innerHTML = html;
	}


	/* ============================================================
	   품목을 고르면 그 품목의 로트를 서버에서 받아옵니다
	   ============================================================ */
	function changeItem() {

		let i = findItemByName(document.querySelector("#rdName").value);

		if (i == -1) {
			document.querySelector("#rdCode").value = "";
			document.querySelector("#rdLot").innerHTML = "";
			document.querySelector("#rdZone").value = "";
			lotIds = [];
			return;
		}

		document.querySelector("#rdCode").value = itemCodes[i];

		apiGet("/api/stock-lots?itemId=" + getItemId(itemNameList[i]) + "&status=NORMAL&size=200", putLots);
	}


	function putLots(data) {

		let list = data.items;

		lotIds = [];
		lotQtys = [];
		lotZoneTexts = [];

		let html = "";

		for (let i = 0; i < list.length; i++) {

			if (list[i].quantity <= 0) {
				continue;
			}

			let last = lotIds.length;

			lotIds[last] = list[i].lotId;
			lotQtys[last] = list[i].quantity;
			lotZoneTexts[last] = findZoneName(list[i].zoneId);

			html = html + "<option value='" + last + "'>LOT-" + list[i].lotId
			            + " (남은 " + list[i].quantity + "개, " + lotZoneTexts[last] + ")</option>";
		}

		if (html == "") {
			html = "<option value='-1'>처리할 수 있는 재고가 없습니다</option>";
		}

		document.querySelector("#rdLot").innerHTML = html;
		changeLot();
	}


	function changeLot() {

		let k = document.querySelector("#rdLot").value * 1;

		if (k < 0 || lotIds.length == 0) {
			document.querySelector("#rdZone").value = "";
			return;
		}

		document.querySelector("#rdZone").value = lotZoneTexts[k];
	}


	function findZoneName(zoneId) {

		for (let i = 0; i < zoneIds.length; i++) {
			if (zoneIds[i] == zoneId) {

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == zoneWarehouseIds[i]) {
						return warehouseNames[k] + " " + zoneNames[i];
					}
				}
				return zoneNames[i];
			}
		}
		return "구역 " + zoneId;
	}


	/* ============================================================
	   등록 모달
	   ============================================================ */
	function openRegister() {
		document.querySelector("#rdDate").value = getToday();
		openModal("#registerModal");
	}


	function closeRegister() {
		closeModal("#registerModal");
	}


	/* ============================================================
	   반품/폐기 등록  (POST /api/returns)
	   ============================================================ */
	function doRegister() {

		if (isBlank(["#rdName", "#rdQty", "#rdDate"]) == true) {
			alert("품목명, 수량, 처리일을 채워 주세요.");
			return;
		}

		let k = document.querySelector("#rdLot").value * 1;

		if (k < 0 || lotIds.length == 0) {
			alert("처리할 로트를 골라 주세요.");
			return;
		}

		let qty = document.querySelector("#rdQty").value * 1;

		if (qty <= 0) {
			alert("수량은 1개 이상이어야 합니다.");
			return;
		}

		/* 남은 수량보다 많이 처리할 수 없습니다 */
		if (qty > lotQtys[k]) {
			alert("LOT-" + lotIds[k] + " 에 남은 수량은 " + lotQtys[k] + "개입니다.\n그보다 많이 처리할 수 없습니다.");
			return;
		}

		let processedBy = sessionStorage.getItem("userId");

		if (processedBy == null) {
			alert("로그인 정보가 없습니다. 다시 로그인해 주세요.");
			return;
		}

		let body = {
			lotId: lotIds[k],
			type: document.querySelector("#rdType").value,
			reason: document.querySelector("#rdReason").value,
			quantity: qty,
			processedBy: processedBy * 1,
			processedDate: document.querySelector("#rdDate").value
		};

		apiSend("POST", "/api/returns", body, afterRegister);
	}


	function afterRegister(data) {

		let k = document.querySelector("#rdLot").value * 1;
		let i = findItemByName(document.querySelector("#rdName").value);

		/* 표에 한 줄 추가 */
		let last = rowTypes.length;

		rowTypes[last] = document.querySelector("#rdType").value;
		rowKinds[last] = document.querySelector("#rdReason").value;
		rowNames[last] = document.querySelector("#rdName").value;
		rowCodes[last] = document.querySelector("#rdCode").value;
		rowLots[last] = "LOT-" + lotIds[k];
		rowZones[last] = lotZoneTexts[k];
		rowQtys[last] = document.querySelector("#rdQty").value;
		rowNotes[last] = document.querySelector("#rdReason").value;
		rowDates[last] = document.querySelector("#rdDate").value;

		if (i == -1) {
			rowCategories[last] = "-";
		} else {
			rowCategories[last] = itemCategoryList[i];
		}

		let msg = "";

		/* 전체를 처리하면 그 로트가 통째로 빠지고,
		   일부면 처리한 만큼만 새 로트로 나뉩니다 */
		if (data.splitOccurred == true) {
			msg = "등록되었습니다. 처리한 " + rowQtys[last] + "개가 LOT-" + data.disposedLotId + " 로 분리되었습니다.";
		} else {
			msg = "등록되었습니다. LOT-" + data.disposedLotId + " 전체가 처리되어 정상 재고에서 빠집니다.";
		}

		if (data.alertCreated == true) {
			msg = msg + "\n재고부족 알림이 생성되었습니다.";
		}
		if (data.approvalId != null) {
			msg = msg + "\n발주 승인 요청이 자동 생성되었습니다.";
		}

		clearInput(["#rdQty"]);
		drawList();
		closeRegister();

		/* 로트 수량이 바뀌었으니 목록을 다시 받아옵니다 */
		changeItem();

		alert(msg);
	}


	/* ============================================================
	   내역 표

	   서버에 반품/폐기 목록을 조회하는 API가 아직 없어서,
	   이 화면에서 등록한 건만 보여 줍니다.
	   (GET /api/returns 가 생기면 여기서 받아오면 됩니다)
	   ============================================================ */
	function getList() {

		let type = document.querySelector("#fType").value;
		let category = document.querySelector("#fCategory").value;
		let from = document.querySelector("#fFrom").value;
		let to = document.querySelector("#fTo").value;
		let word = document.querySelector("#fName").value;
		let result = [];

		for (let i = 0; i < rowTypes.length; i++) {

			if (type != "전체" && rowTypes[i] != type) {
				continue;
			}
			if (category != "전체" && rowCategories[i] != category) {
				continue;
			}
			if (word != "" && rowNames[i].indexOf(word) < 0) {
				continue;
			}
			if (from != "" && rowDates[i] < from) {
				continue;
			}
			if (to != "" && rowDates[i] > to) {
				continue;
			}

			result[result.length] = i;
		}

		return result;
	}


	function drawList() {

		let note = document.querySelector("#listNote");

		if (note != null) {
			note.innerHTML = "반품/폐기 목록 조회 기능이 서버에 아직 없어, 이 화면에서 등록한 건만 표시됩니다.";
		}

		let all = getList();
		let list = cutPage(all, nowPage);
		let html = "";

		if (all.length == 0) {
			document.querySelector("#rdBody").innerHTML = "<tr><td colspan='12'>이 화면에서 등록한 내역이 없습니다.</td></tr>";
			drawPaging("#paging", 0, 1, "goPage");
			return;
		}

		for (let n = 0; n < list.length; n++) {

			let i = list[n];

			html = html + "<tr>";
			html = html + "<td>" + (n + 1) + "</td>";
			html = html + "<td>" + rowTypes[i] + "</td>";
			html = html + "<td>" + rowKinds[i] + "</td>";
			html = html + "<td>" + rowNames[i] + "</td>";
			html = html + "<td>" + rowCodes[i] + "</td>";
			html = html + "<td>" + rowLots[i] + "</td>";
			html = html + "<td>" + rowZones[i] + "</td>";
			html = html + "<td>" + rowQtys[i] + "</td>";
			html = html + "<td>" + rowNotes[i] + "</td>";
			html = html + "<td>" + rowDates[i] + "</td>";
			html = html + "<td>완료</td>";
			html = html + "<td><button class='delete-btn' onclick='doDelete(" + i + ")'>지우기</button></td>";
			html = html + "</tr>";
		}

		document.querySelector("#rdBody").innerHTML = html;
		drawPaging("#paging", all.length, nowPage, "goPage");
	}


	function goPage(p) {
		nowPage = p;
		drawList();
	}


	/* 표에서만 지웁니다. 실제 처리는 되돌아가지 않습니다. */
	function doDelete(index) {

		if (confirm("이 줄을 목록에서 지울까요?\n(실제 반품/폐기는 취소되지 않습니다)") == false) {
			return;
		}

		removeAt([rowTypes, rowKinds, rowNames, rowCodes, rowLots,
		          rowCategories, rowZones, rowQtys, rowNotes, rowDates], index);

		drawList();
	}


	/* 화면이 열릴 때 실행 */
	startUp();

</script>

</body>
</html>

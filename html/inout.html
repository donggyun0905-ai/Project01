<!DOCTYPE html> <!-- 08.12 입출고 등록 -->
<!-- 입출고 등록 페이지입니다. 명세서에 없는데 있으면 입출고 등록으로 가는 길이 자연스러울 것 같아서 넣었습니다 -->
<!-- 디자인은 생각나는대로 일단 만들었는데 나중에 시간이 되면 고쳐보도록 하겠습니다 -->
<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>입출고 등록</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/inout.css">
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
			<a class="active">입출고 관리</a>
			<a>반품 및 폐기 관리</a>
			<a>알림</a>
			<a>통계</a>
			<a>설정 및 권한 관리</a>
		</nav>
	</aside>
	
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
	
		<!-- 사용자 계정 -->
	<div class="top-bar">
		<h2>품목 관리</h2>
		
		<div class="user-info">
			<span class="notification">🔔</span>

		</div>
	</div>

			<button class="menu-btn">품목 관리</button>

			<button class="menu-btn">감사로그</button>
		</header>

		<div class="form-group">
			<button class="register-btn1">입고 등록</button>
			<button class="register-btn2">출고 등록</button>
		</div>	
		
	</main>
	
	</div>

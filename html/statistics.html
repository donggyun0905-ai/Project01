	<meta charset="UTF-8">

	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!-- statistics css -->

	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디 -->
<body>
	<!-- 전체 화면 -->
	<div class="container">

	<!-- 사이드바 -->
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a class="active" href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>

	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		

		<!-- 통계 안의 화면 전환 -->
		<header class="top-menu">
			<button class="menu-btn active">통계 대시보드</button> <!--현재 화면이 통계 대시보드라서 -->
			<button class="menu-btn" onclick="location.href='report.html'">보고서 및 내보내기</button>
		</header>

		<h4 class="page-title">통계 대시보드</h4>

		<!-- 조회 조건 -->
		<section class="form-box">
			<div class="form-group">
				<label>조회 기간</label>
				<div class="date-range">
					<input type="date" id="fromDate" onchange="loadData()">
					<span>~</span>
					<input type="date" id="toDate" onchange="loadData()">
				</div>
			</div>
		</section>

		<!-- 회전율 / 거래처 순위 -->
		<section class="panel-wrap">

			<div class="card">
				<div class="card-header">
					<h4>재고 회전율 (높은 순)</h4>
				</div>
				<div id="turnArea"></div>
			</div>

			<div class="card">
				<div class="card-header">
					<h4>거래처별 출고 TOP5</h4>
				</div>
				<div id="rankArea"></div>
			</div>

		</section>

		<!-- 입출고량 집계(그래프) / 예측 데이터 - 위 재고 회전율/거래처별 출고와 같은 방식으로
		     컨테이너 자체를 둘로 나눠 나란히 놓습니다. 그래프 크기(760px)는 그대로 두고,
		     예측 데이터 쪽만 그 자체로 카드가 됐으니 폭에 맞게 다시 정리합니다. -->
		<section class="panel-wrap">

			<div class="card chart-card">
				<div class="card-header">
					<h4>입출고량 집계</h4>
					<div class="switch-btns">
						<button id="btnDay" class="active" onclick="changeUnit('일')">일</button>
						<button id="btnWeek" onclick="changeUnit('주')">주</button>
						<button id="btnMonth" onclick="changeUnit('월')">월</button>
					</div>
				</div>
				<div class="chart-area">
					<canvas id="lineChart"></canvas>
				</div>
			</div>

			<!-- 예측 데이터 두 가지 - 반대되는 두 위험을 짝으로 보여줍니다.
			     소진 예상: 일평균 소진 속도(회전율 계산에 이미 쓰던 값) 기준
			     초과 임박: 일평균 입고 속도 기준 (같은 방식, 반대 방향) -->
			<div class="card forecast-card">
				<div class="card-header">
					<h4>예측 데이터</h4>
				</div>
				<div class="forecast-panel">
					<div class="forecast-section">
						<h5>재고 소진 예상</h5>
						<div id="forecastArea"></div>
					</div>
					<div class="forecast-section">
						<h5>재고초과 임박 예상</h5>
						<div id="overstockArea"></div>
					</div>
				</div>
			</div>

		</section>

	</main>

	</div>

<!-- 그래프를 그려주는 도구 (Chart.js) - 인터넷 없이도 되도록 파일로 받아서 넣어둠 -->
<script src="../js/chart.js"></script>

<script type="text/javascript">
	/* =========================================================
	   통계 자료를 담아둘 배열들 (처음에는 비어 있다)
	   ========================================================= */

	// 재고 회전율 (서버가 회전율 높은 순 6개를 줍니다 - 아래 loadTurnover() 주석 참고)
	let turnNames = [];
	let turnRates = [];

	// 거래처별 출고 (금액은 서버에 없는 값이라 수량만 씁니다)
	let custNames = [];
	let custQtys  = [];

	// 입출고량 집계
	let lineLabels = [];
	let lineIn     = [];
	let lineOut    = [];


	/* =========================================================
	   화면에 쓸 자료를 가져온다

	   카드 3개가 서로 다른 API에서 나뉘어 오기 때문에, 각자 받아오는
	   대로 자기 카드만 다시 그립니다. (dashboard.html과 같은 방식)
	   ========================================================= */
	function loadData() {
		loadTurnover();
		loadRanking();
		loadLineChart();
		loadForecast();
		loadOverstockForecast();
	}


	/* ---------------------------------------------------------
	   재고 회전율 (높은 순) - 잘 나가는 상품 TOP6
	   서버(/api/statistics/turnover)가 회전율 높은 순으로 6개를 줍니다.
	   --------------------------------------------------------- */
	function loadTurnover() {
		apiGet("/api/statistics/turnover", putTurnover);
	}

	function putTurnover(data) {

		turnNames = [];
		turnRates = [];

		for (let i = 0; i < data.length; i++) {
			turnNames[i] = data[i].itemName;
			turnRates[i] = data[i].turnoverRatio;
		}

		drawTurnover();
	}


	/* ---------------------------------------------------------
	   거래처별 출고 TOP5 (수량 기준)
	   --------------------------------------------------------- */
	function loadRanking() {

		let from = document.querySelector("#fromDate").value;
		let to = document.querySelector("#toDate").value;

		apiGet("/api/statistics/clients/top5?from=" + from + "&to=" + to, putRanking);
	}

	function putRanking(data) {

		custNames = [];
		custQtys  = [];

		for (let i = 0; i < data.length; i++) {
			custNames[i] = data[i].partnerName;
			custQtys[i]  = data[i].totalQty;
		}

		drawRanking();
	}


	/* ---------------------------------------------------------
	   입출고량 집계 (일/주/월 버튼을 누를 때마다 서버에 새로 요청합니다.
	   예전처럼 세 단위를 미리 다 받아서 화면에서만 바꾸는 방식이 아닙니다)
	   --------------------------------------------------------- */
	function loadLineChart() {

		let from = document.querySelector("#fromDate").value;
		let to = document.querySelector("#toDate").value;
		let unit = unitToParam(nowUnit); // "일/주/월" -> "day/week/month"

		apiGet("/api/statistics/inout?unit=" + unit + "&from=" + from + "&to=" + to, putLineChart);
	}

	// 서버는 unit 값을 영어(day/week/month)로만 받습니다
	function unitToParam(unit) {
		if (unit == "주") {
			return "week";
		}
		if (unit == "월") {
			return "month";
		}
		return "day";
	}

	function putLineChart(data) {

		lineLabels = [];
		lineIn     = [];
		lineOut    = [];

		for (let i = 0; i < data.length; i++) {
			lineLabels[i] = formatPeriodLabel(data[i].period);
			lineIn[i]     = data[i].inboundQty;
			lineOut[i]    = data[i].outboundQty;
		}

		drawLineChart();
	}

	/* 서버가 주는 period 값을 화면에 보여줄 라벨로 바꿉니다.
	   - 일: "2026-08-11" -> 그대로 둡니다 (바꿀 필요 없음)
	   - 월: "2026-08" -> 그대로 둡니다
	   - 주: "2026-23"(ISO 연도-주차) -> "8월 3주" 처럼 몇 월의 몇 번째 주인지로 바꿉니다.
	     (서버 집계 자체는 계속 ISO 주차 기준이라 데이터는 그대로이고, 화면에 보이는
	     라벨만 바꾸는 것입니다) */
	function formatPeriodLabel(period) {

		if (nowUnit != "주") {
			return period;
		}

		let parts = period.split("-");
		let isoYear = Number(parts[0]);
		let isoWeek = Number(parts[1]);

		let monday = isoWeekToMonday(isoYear, isoWeek);

		let month = monday.getMonth() + 1;
		// 그 달 1일부터 며칠째인지를 보고 몇 번째 주인지를 정합니다 (1~7일=1주, 8~14일=2주 ...)
		let weekOfMonth = Math.ceil(monday.getDate() / 7);

		return month + "월 " + weekOfMonth + "주";
	}

	// ISO 연도-주차(예: 2026년 23주)의 월요일 날짜를 구합니다.
	// (ISO 기준으로 1월 4일은 항상 그 해의 1주차에 속한다는 규칙을 이용합니다)
	function isoWeekToMonday(isoYear, isoWeek) {

		let jan4 = new Date(isoYear, 0, 4);

		let jan4DayOfWeek = jan4.getDay(); // 일요일=0, 월요일=1 ...
		if (jan4DayOfWeek == 0) {
			jan4DayOfWeek = 7;
		}

		let week1Monday = new Date(jan4);
		week1Monday.setDate(jan4.getDate() - jan4DayOfWeek + 1);

		let monday = new Date(week1Monday);
		monday.setDate(week1Monday.getDate() + (isoWeek - 1) * 7);

		return monday;
	}


	/* ---------------------------------------------------------
	   재고 소진 예상 (입출고량 집계 카드 오른쪽 패널)

	   서버(/api/statistics/stockout-forecast)가 이미 회전율 계산에 쓰던 일평균
	   소진 속도(dailyVelocity)를 그대로 활용해 "이 추세면 현재 재고가 며칠 뒤
	   바닥나는지"를 가장 임박한 순으로 계산해서 줍니다. 여기선 받은 걸 그대로
	   그리기만 하면 됩니다.
	   --------------------------------------------------------- */
	function loadForecast() {
		apiGet("/api/statistics/stockout-forecast?limit=5", putForecast);
	}

	function putForecast(data) {
		drawForecastList("#forecastArea", data, "daysLeft", "소진",
			"최근 출고 이력이 있는 품목이 없어 예상할 수 없습니다.");
	}

	/* ---------------------------------------------------------
	   재고초과 임박 예상 (재고 소진 예상과 짝을 이루는 반대쪽 위험)

	   서버(/api/statistics/overstock-forecast)가 일평균 입고 속도 기준으로
	   "이 추세면 며칠 뒤 capacity_max를 넘는지"를 가장 임박한 순으로 계산해서
	   줍니다. 계산 방식만 반대일 뿐 보여주는 방식은 소진 예상과 같아서
	   drawForecastList()를 그대로 같이 씁니다.
	   --------------------------------------------------------- */
	function loadOverstockForecast() {
		apiGet("/api/statistics/overstock-forecast?limit=5", putOverstockForecast);
	}

	function putOverstockForecast(data) {
		drawForecastList("#overstockArea", data, "daysUntilFull", "초과",
			"최근 입고 이력이 있는 품목이 없어 예상할 수 없습니다.");
	}

	/* 재고 소진 예상/재고초과 임박 예상 공통 그리기 - field는 남은 일수가 담긴 키
	   (daysLeft/daysUntilFull), verb는 "소진"/"초과"처럼 문구에 넣을 말 */
	function drawForecastList(areaId, data, field, verb, emptyMsg) {

		let area = document.querySelector(areaId);

		if (data.length == 0) {
			area.innerHTML = "<p class='forecast-empty'>" + emptyMsg + "</p>";
			return;
		}

		let html = "";

		for (let i = 0; i < data.length; i++) {

			let days = data[i][field];
			let cls = "forecast-days";

			if (days <= 7) {
				cls = cls + " urgent";
			} else if (days <= 14) {
				cls = cls + " warn";
			}

			html = html + "<div class='forecast-row'>";
			html = html + "<span class='forecast-name'>" + data[i].itemName + "</span>";
			html = html + "<span class='" + cls + "'>약 " + days + "일 후 " + verb + " 예상</span>";
			html = html + "</div>";
		}

		area.innerHTML = html;
	}


	/* =========================================================
	   화면 상태
	   ========================================================= */
	let nowUnit = "일";     // 입출고 집계 단위
	let lineChart = null;   // 그래프를 담아둘 변수

	/* =========================================================
	   숫자에 쉼표를 넣어준다
	   ========================================================= */
	/* addComma 는 common.js 로 옮겼습니다 */

	/* =========================================================
	   재고 회전율 막대를 그린다
	   ========================================================= */
	function drawTurnover() {

		if (turnNames.length == 0) {
			document.querySelector("#turnArea").innerHTML = "<p>표시할 자료가 없습니다.</p>";
			return;
		}

		// 가장 큰 값을 찾는다 (이 값을 100%로 잡고 나머지 길이를 정한다).
		// 서버는 6개까지 주지만, 칸을 짧게 유지하려고 화면에는 상위 5개만 보여줍니다.
		let showCount = turnNames.length;
		if (showCount > 5) {
			showCount = 5;
		}

		let maxRate = 0;
		for (let i = 0; i < showCount; i++) {
			if (turnRates[i] > maxRate) {
				maxRate = turnRates[i];
			}
		}

		let html = "";
		for (let i = 0; i < showCount; i++) {
			// 막대 길이를 퍼센트로 계산한다
			let percent = 0;
			if (maxRate > 0) {
				percent = Math.round(turnRates[i] / maxRate * 100);
			}

			html = html + '<div class="bar-row">';
			html = html + '	<div class="bar-top">';
			html = html + '		<span class="bar-name">' + turnNames[i] + '</span>';
			html = html + '		<span class="bar-num">' + turnRates[i].toFixed(2) + '</span>';
			html = html + '	</div>';
			html = html + '	<div class="bar-back">';
			html = html + '		<div class="bar-fill" style="width:' + percent + '%"></div>';
			html = html + '	</div>';
			html = html + '</div>';
		}

		document.querySelector("#turnArea").innerHTML = html;
	}

	/* =========================================================
	   거래처별 출고 순위를 그린다
	   ========================================================= */
	function drawRanking() {

		if (custNames.length == 0) {
			document.querySelector("#rankArea").innerHTML = "<p>표시할 자료가 없습니다.</p>";
			return;
		}

		// 가장 큰 값을 찾는다
		let maxValue = 0;
		for (let i = 0; i < custQtys.length; i++) {
			if (custQtys[i] > maxValue) {
				maxValue = custQtys[i];
			}
		}

		let html = "";
		for (let i = 0; i < custNames.length; i++) {
			let percent = 0;
			if (maxValue > 0) {
				percent = Math.round(custQtys[i] / maxValue * 100);
			}

			html = html + '<div class="bar-row">';
			html = html + '	<div class="bar-top">';
			html = html + '		<span class="bar-name">' + (i + 1) + '. ' + custNames[i] + '</span>';
			html = html + '		<span class="bar-num">' + addComma(custQtys[i]) + ' EA</span>';
			html = html + '	</div>';
			html = html + '	<div class="bar-back">';
			html = html + '		<div class="bar-fill" style="width:' + percent + '%"></div>';
			html = html + '	</div>';
			html = html + '</div>';
		}

		document.querySelector("#rankArea").innerHTML = html;
	}

	/* =========================================================
	   입출고량 집계 선그래프를 그린다
	   ========================================================= */
	function drawLineChart() {

		// 이미 그려둔 그래프가 있으면 먼저 지운다
		if (lineChart != null) {
			lineChart.destroy();
		}

		let area = document.querySelector("#lineChart");

		lineChart = new Chart(area, {
			type: "line",
			data: {
				labels: lineLabels,
				datasets: [
					{ label: "입고량", data: lineIn, borderColor: "#e0433f", backgroundColor: "#e0433f22", fill: true, tension: 0.3 },
					{ label: "출고량", data: lineOut, borderColor: "#3b6fd4", backgroundColor: "#3b6fd422", fill: true, tension: 0.3 }
				]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false
			}
		});
	}

	/* =========================================================
	   일 / 주 / 월 버튼을 눌렀을 때
	   ========================================================= */
	function changeUnit(unit) {
		nowUnit = unit;

		// 누른 버튼만 진하게 만든다
		document.querySelector("#btnDay").className = "";
		document.querySelector("#btnWeek").className = "";
		document.querySelector("#btnMonth").className = "";

		if (unit == "일") {
			document.querySelector("#btnDay").className = "active";
		} else if (unit == "주") {
			document.querySelector("#btnWeek").className = "active";
		} else {
			document.querySelector("#btnMonth").className = "active";
		}

		/* 단위에 맞게 조회 기간도 같이 넓혀줍니다. 안 그러면 예전처럼
		   기간(예: 최근 7일)은 그대로인 채 "주/월로 나눠 달라"고만 하게 돼서,
		   나눌 수 있는 게 1~2개뿐이라 그래프에 점이 몇 개 안 찍힙니다.
		   일 = 최근 7일 / 주 = 최근 12주 / 월 = 최근 12개월(1년). */
		let to = new Date();
		let from = new Date();

		if (unit == "일") {
			from.setDate(from.getDate() - 6);       // 오늘 포함 7일
		} else if (unit == "주") {
			from.setDate(from.getDate() - 7 * 12);  // 최근 12주

			// 여기서 구한 from이 그 주의 월요일이 아니면(예: 오늘이 수요일이라
			// from도 수요일), 서버는 "그 주부터 세라"고 받아들여서 가장 오래된 주는
			// 월~일 전체가 아니라 from요일~일요일까지만 집계해버립니다. 그러면
			// 맨 앞 주만 항상 실제보다 낮게 나오므로, from을 그 주의 월요일로
			// 당겨서 첫 주도 통째로(월~일) 잡히게 맞춥니다.
			let day = from.getDay(); // 일요일=0, 월요일=1 ... 토요일=6
			let diffToMonday = (day == 0) ? 6 : day - 1;
			from.setDate(from.getDate() - diffToMonday);
		} else {
			from.setMonth(from.getMonth() - 12);    // 최근 12개월

			// 여기도 "주"와 같은 문제가 있습니다. from이 그 달 1일이 아니면
			// (예: 오늘이 8월 27일이면 from도 작년 8월 27일), 서버는 가장 오래된
			// 달을 1일부터가 아니라 27일부터 월말까지만 집계해버려서 맨 앞 달이
			// 항상 낮게 나옵니다. from을 그 달 1일로 당겨서 첫 달도 온전히 잡히게 합니다.
			from.setDate(1);
		}

		document.querySelector("#toDate").value = getDateText(to);
		document.querySelector("#fromDate").value = getDateText(from);

		// 기간 입력칸을 같이 쓰는 거래처 TOP5, 재고 회전율도 넓어진 기간에 맞춰 다시 받아옵니다
		loadData();
	}

	/* =========================================================
	   페이지가 열릴 때 처음 한 번 실행
	   ========================================================= */

	// 조회 기간 칸에 기본값을 넣어둔다 (최근 일주일)
	let today = new Date();
	let weekAgo = new Date();
	weekAgo.setDate(weekAgo.getDate() - 6);

	document.querySelector("#toDate").value = getDateText(today);
	document.querySelector("#fromDate").value = getDateText(weekAgo);

	loadData();

	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

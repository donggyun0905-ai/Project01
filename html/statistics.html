<!DOCTYPE html> <!--statistics 통계 대시보드-->

<html lang = "ko">
<head>
	<meta charset="UTF-8">
	<title>통계 대시보드</title>

	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!-- statistics css -->
	<link rel="stylesheet" href="../css/statistics.css">
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디 -->
<body>
	<!-- 전체 화면 -->
	<div class="container">

	<!-- 사이드바 -->
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a class="active" href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>

	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		

		<!-- 통계 안의 화면 전환 -->
		<header class="top-menu">
			<button class="menu-btn active">통계 대시보드</button> <!--현재 화면이 통계 대시보드라서 -->
			<button class="menu-btn" onclick="location.href='report.html'">보고서 및 내보내기</button>
		</header>

		<h4 class="page-title">통계 대시보드</h4>

		<!-- 조회 조건 -->
		<section class="form-box">
			<div class="form-group">
				<label>조회 기간</label>
				<div class="date-range">
					<input type="date" id="fromDate">
					<span>~</span>
					<input type="date" id="toDate">
				</div>
			</div>
		</section>

		<!-- 회전율 / 거래처 순위 / 입출고 집계 -->
		<section class="panel-wrap">

			<div class="card">
				<div class="card-header">
					<h4>재고 회전율 (낮은 순)</h4>
				</div>
				<div id="turnArea"></div>
			</div>

			<div class="card">
				<div class="card-header">
					<h4>거래처별 출고 TOP5</h4>
					<div class="switch-btns">
						<button id="btnQty" class="active" onclick="changeSort('수량')">수량</button>
						<button id="btnAmt" onclick="changeSort('금액')">금액</button>
					</div>
				</div>
				<div id="rankArea"></div>
			</div>

			<div class="card">
				<div class="card-header">
					<h4>입출고량 집계</h4>
					<div class="switch-btns">
						<button id="btnDay" class="active" onclick="changeUnit('일')">일</button>
						<button id="btnWeek" onclick="changeUnit('주')">주</button>
						<button id="btnMonth" onclick="changeUnit('월')">월</button>
					</div>
				</div>
				<div class="chart-area">
					<canvas id="lineChart"></canvas>
				</div>
			</div>

		</section>

	</main>

	</div>

<!-- 그래프를 그려주는 도구 (Chart.js) - 인터넷 없이도 되도록 파일로 받아서 넣어둠 -->
<script src="../js/chart.js"></script>

<script type="text/javascript">
	/* =========================================================
	   통계 자료를 담아둘 배열들 (처음에는 비어 있다)
	   ========================================================= */

	// 재고 회전율 (회전율 = 기간 안에 나간 수량 / 평균 재고량)
	let turnNames = [];
	let turnRates = [];

	// 거래처별 출고
	let custNames = [];
	let custQtys  = [];
	let custAmts  = [];

	// 입출고량 집계 (일 / 주 / 월)
	let dayLabels = [];
	let dayIn     = [];
	let dayOut    = [];

	let weekLabels = [];
	let weekIn     = [];
	let weekOut    = [];

	let monthLabels = [];
	let monthIn     = [];
	let monthOut    = [];

	/* =========================================================
	   통계 자료를 가져온다

	   [서버 연동 방법]
	   지금은 서버가 없어서 값을 직접 적어두고 쓴다.
	   나중에 서버가 완성되면 이 함수 안쪽만 아래처럼 바꾸면 되고,
	   화면을 그리는 코드는 하나도 고칠 필요가 없다.

	     function loadData() {
	       let xhr = new XMLHttpRequest();
	       xhr.open("GET", "http://localhost:8080/api/statistics/turnover", true);

	       // 로그인 세션 쿠키(JSESSIONID)를 같이 보낸다 - 이게 없으면 401이 온다
	       xhr.withCredentials = true;

	       xhr.onload = function() {
	         let res = JSON.parse(xhr.responseText);

	         if (res.success == false) {
	           alert(res.error.message);
	           return;
	         }

	         let list = res.data;
	         for (let i = 0; i < list.length; i++) {
	           turnNames[i] = list[i].itemName;
	           turnRates[i] = list[i].turnoverRate;
	         }

	         drawAll();
	       };
	       xhr.send();
	     }
	   ========================================================= */
	function loadData() {
		turnNames = ["두부 프리미엄", "어묵 정품", "유리병 소스", "베이컨 정품", "즉석밥 세트", "생수 2L"];
		turnRates = [0.12, 0.18, 0.31, 0.45, 1.20, 2.85];

		// 거래처 이름은 실제 시드 데이터 기준
		custNames = ["쿠팡 풀필먼트", "이마트 성수점", "홈플러스 강서점", "롯데마트 잠실점", "GS25 물류센터"];
		custQtys  = [8420, 6870, 5230, 4910, 4380];
		custAmts  = [42100000, 35600000, 27300000, 31200000, 18900000];

		dayLabels = ["08-05", "08-06", "08-07", "08-08", "08-09", "08-10", "08-11"];
		dayIn     = [820, 1040, 690, 1250, 900, 760, 1180];
		dayOut    = [640, 880, 720, 980, 1100, 540, 860];

		weekLabels = ["1주차", "2주차", "3주차", "4주차"];
		weekIn     = [5230, 6110, 4980, 6640];
		weekOut    = [4870, 5490, 5960, 5120];

		monthLabels = ["5월", "6월", "7월", "8월"];
		monthIn     = [21200, 23400, 24800, 12600];
		monthOut    = [19800, 22100, 23950, 11400];

		// 자료를 다 받은 뒤에 화면을 그린다
		drawAll();
	}

	// 화면 전체를 그린다
	function drawAll() {
		drawTurnover();
		drawRanking();
		drawLineChart();
	}

	/* =========================================================
	   화면 상태
	   ========================================================= */
	let nowSort = "수량";   // 거래처 정렬 기준
	let nowUnit = "일";     // 입출고 집계 단위
	let lineChart = null;   // 그래프를 담아둘 변수

	/* =========================================================
	   숫자에 쉼표를 넣어준다
	   ========================================================= */
	/* addComma 는 common.js 로 옮겼습니다 */

	/* =========================================================
	   재고 회전율 막대를 그린다
	   회전율이 낮은 순서로 이미 정렬해 두었다
	   ========================================================= */
	function drawTurnover() {
		// 가장 큰 값을 찾는다 (이 값을 100%로 잡고 나머지 길이를 정한다)
		let maxRate = 0;
		for (let i = 0; i < turnRates.length; i++) {
			if (turnRates[i] > maxRate) {
				maxRate = turnRates[i];
			}
		}

		let html = "";
		for (let i = 0; i < turnNames.length; i++) {
			// 막대 길이를 퍼센트로 계산한다
			let percent = Math.round(turnRates[i] / maxRate * 100);

			// 회전율이 0.2 미만이면 오래 묵은 재고로 본다
			let isDead = false;
			if (turnRates[i] < 0.2) {
				isDead = true;
			}

			html = html + '<div class="bar-row">';
			html = html + '	<div class="bar-top">';
			html = html + '		<span class="bar-name">' + turnNames[i];
			if (isDead == true) {
				html = html + '<span class="dead-tag">장기 재고</span>';
			}
			html = html + '		</span>';
			html = html + '		<span class="bar-num">' + turnRates[i].toFixed(2) + '</span>';
			html = html + '	</div>';
			html = html + '	<div class="bar-back">';
			if (isDead == true) {
				html = html + '		<div class="bar-fill dead" style="width:' + percent + '%"></div>';
			} else {
				html = html + '		<div class="bar-fill" style="width:' + percent + '%"></div>';
			}
			html = html + '	</div>';
			html = html + '</div>';
		}

		document.querySelector("#turnArea").innerHTML = html;
	}

	/* =========================================================
	   거래처별 출고 순위를 그린다
	   ========================================================= */
	function drawRanking() {
		// 정렬 기준에 따라 쓸 값을 정한다
		let values = custQtys;
		let unit = "EA";
		if (nowSort == "금액") {
			values = custAmts;
			unit = "원";
		}

		// 가장 큰 값을 찾는다
		let maxValue = 0;
		for (let i = 0; i < values.length; i++) {
			if (values[i] > maxValue) {
				maxValue = values[i];
			}
		}

		let html = "";
		for (let i = 0; i < custNames.length; i++) {
			let percent = Math.round(values[i] / maxValue * 100);

			html = html + '<div class="bar-row">';
			html = html + '	<div class="bar-top">';
			html = html + '		<span class="bar-name">' + (i + 1) + '. ' + custNames[i] + '</span>';
			html = html + '		<span class="bar-num">' + addComma(values[i]) + ' ' + unit + '</span>';
			html = html + '	</div>';
			html = html + '	<div class="bar-back">';
			html = html + '		<div class="bar-fill" style="width:' + percent + '%"></div>';
			html = html + '	</div>';
			html = html + '</div>';
		}

		document.querySelector("#rankArea").innerHTML = html;
	}

	/* =========================================================
	   입출고량 집계 선그래프를 그린다
	   ========================================================= */
	function drawLineChart() {
		// 단위에 맞는 자료를 고른다
		let labels = dayLabels;
		let inData = dayIn;
		let outData = dayOut;

		if (nowUnit == "주") {
			labels = weekLabels;
			inData = weekIn;
			outData = weekOut;
		} else if (nowUnit == "월") {
			labels = monthLabels;
			inData = monthIn;
			outData = monthOut;
		}

		// 이미 그려둔 그래프가 있으면 먼저 지운다
		if (lineChart != null) {
			lineChart.destroy();
		}

		let area = document.querySelector("#lineChart");

		lineChart = new Chart(area, {
			type: "line",
			data: {
				labels: labels,
				datasets: [
					{ label: "입고량", data: inData, borderColor: "#1f2628", backgroundColor: "#1f262822", fill: true, tension: 0.3 },
					{ label: "출고량", data: outData, borderColor: "#9b9b9b", backgroundColor: "#9b9b9b22", fill: true, tension: 0.3 }
				]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false
			}
		});
	}

	/* =========================================================
	   버튼을 눌렀을 때
	   ========================================================= */

	// 수량 / 금액 버튼
	function changeSort(sort) {
		nowSort = sort;

		// 누른 버튼만 진하게 만든다
		if (sort == "수량") {
			document.querySelector("#btnQty").className = "active";
			document.querySelector("#btnAmt").className = "";
		} else {
			document.querySelector("#btnQty").className = "";
			document.querySelector("#btnAmt").className = "active";
		}

		drawRanking();
	}

	// 일 / 주 / 월 버튼
	function changeUnit(unit) {
		nowUnit = unit;

		// 누른 버튼만 진하게 만든다
		document.querySelector("#btnDay").className = "";
		document.querySelector("#btnWeek").className = "";
		document.querySelector("#btnMonth").className = "";

		if (unit == "일") {
			document.querySelector("#btnDay").className = "active";
		} else if (unit == "주") {
			document.querySelector("#btnWeek").className = "active";
		} else {
			document.querySelector("#btnMonth").className = "active";
		}

		drawLineChart();
	}

	/* =========================================================
	   페이지가 열릴 때 처음 한 번 실행
	   ========================================================= */

	// 조회 기간 칸에 기본값을 넣어둔다 (최근 일주일)
	/* getDateText 는 common.js 로 옮겼습니다 */

	let today = new Date();
	let weekAgo = new Date();
	weekAgo.setDate(weekAgo.getDate() - 6);

	document.querySelector("#toDate").value = getDateText(today);
	document.querySelector("#fromDate").value = getDateText(weekAgo);

	loadData();

	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>

</body>



</html>

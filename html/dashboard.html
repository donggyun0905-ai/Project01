<!DOCTYPE html> <!--dashboard 메인 대시보드-->

<html lang = "ko">
<head>
	<meta charset="UTF-8">
	<title>메인 화면</title>

	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!-- dashboard css -->
	<link rel="stylesheet" href="../css/dashboard.css">
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디 -->
<body>
	<!-- 전체 화면 -->
	<div class="container">

	<!-- 사이드바 -->
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a class="active" href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a href="setting.html">설정 및 권한 관리</a>
			</nav>
		<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>

	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		

	<div class="top-bar">
		<h4 class="page-title">메인 화면</h4>
	</div>

		<!-- 조회 조건 -->
		<section class="form-box">
			<div class="form-group">
				<!-- 서버(통계 API)가 개별 창고가 아니라 대형/중형/소형 구분으로만 걸러 줘서
				     (WAREHOUSE.name 자체가 "대형"/"중형"/"소형" 뿐이라 개별 창고 이름이 없음)
				     드롭다운도 그 4개로 맞췄습니다. -->
				<label>창고</label>
				<select id="warehouse" onchange="changeWarehouse()">
					<option value="전체">전체</option>
					<option value="대형">대형 (5개소)</option>
					<option value="중형">중형 (3개소)</option>
					<option value="소형">소형 (2개소)</option>
				</select>
			</div>

			<div class="form-group">
				<label>기준일</label>
				<input type="date" id="pickDate" onchange="changeDate()">
			</div>
		</section>

		<!-- 요약 카드 5개 -->
		<section class="summary-wrap" id="cardArea"></section>

		<!-- 입출고 현황 / 창고별 재고 / 실시간 알림 -->
		<section class="panel-wrap">

			<div class="card">
				<div class="card-header">
					<h4>입출고 현황</h4>
					<span>최근 7일</span>
				</div>
				<div class="chart-area">
					<canvas id="barChart"></canvas>
				</div>
			</div>

			<div class="card">
				<div class="card-header">
					<h4>창고별 재고 비중</h4>
				</div>
				<div class="donut-area">
					<canvas id="donutChart"></canvas>
				</div>
				<div class="donut-total" id="totalNum">-
					<span>총 재고(EA)</span>
				</div>
				<div id="legendArea"></div>
			</div>

			<div class="card">
				<div class="card-header">
					<h4>실시간 알림</h4>
					<span><a href="alert.html">전체 보기</a></span>
				</div>
				<div id="alertArea"></div>
			</div>

		</section>

	</main>

	</div>

<!-- 그래프를 그려주는 도구 (Chart.js) - 인터넷 없이도 되도록 파일로 받아서 넣어둠 -->
<script src="../js/chart.js"></script>

<script type="text/javascript">
	/* =========================================================
	   화면에 보여줄 값들을 담아둘 배열 (처음에는 비어 있다)
	   ========================================================= */

	// 위쪽 요약 카드 5개
	let cardNames = [];
	let cardNums  = [];
	let cardUnits = [];
	let cardDiffs = [];

	// 카드 1(총 보유 재고 수량)/2(오늘 입고)/3(오늘 출고) 옆에 보여줄 팔레트/박스/낱개
	// 소분류 - {PALLET, BOX, EA} 아니면 아직 안 채워졌거나 해당 없는 카드면 null
	let cardBreakdowns = [null, null, null, null, null];

	// 입출고 현황
	let days     = [];
	let inQtys   = [];
	let outQtys  = [];
	let dispQtys = [];  // 반품/폐기 (출고량과는 별도 테이블이라 따로 받아옵니다)

	// 창고별 재고
	let whNames  = [];
	let whQtys   = [];
	let whColors = [];

	// 실시간 알림
	let alertTypes   = [];
	let alertItemIds = [];
	let alertItems   = [];
	let alertMsgs    = [];
	let alertTimes   = [];

	// 알림에 쓰는 품목 이름을 한 번 받아오면 기억해 뒀다가 재사용합니다.
	// (이게 없으면 실시간 새로고침될 때마다 같은 이름을 매번 다시 받아오면서
	// 그때마다 목록을 다시 그려서 화면이 깜빡였습니다)
	let alertItemNameCache = {};

	// 방금 그린 알림 내용을 기억해 뒀다가, 다음 새로고침 때 완전히 똑같으면
	// 다시 그리지 않습니다 (안 그러면 바뀐 게 없어도 몇 초마다 화면이 깜빡입니다)
	let lastAlertSnapshot = "";

	// 그래프를 담아둘 변수 (다시 그릴 때 이전 것을 지우기 위해 필요)
	let barChart = null;
	let donutChart = null;

	/* =========================================================
	   화면에 쓸 자료를 가져온다

	   카드 5개가 서로 다른 API에서 나뉘어 오기 때문에,
	   한 번에 다 받아서 그리는 게 아니라 각자 받아오는 대로
	   drawCards()를 다시 불러서 채워 넣는 방식입니다.
	   (먼저 온 자료부터 화면에 바로바로 나타납니다)
	   ========================================================= */
	function loadData() {

		// 카드 자리를 먼저 만들어 둡니다 (자료가 오기 전엔 "-" 로 보입니다)
		/* 처음 열 때만 "-" 로 자리를 잡아 둡니다. 그 이후(실시간 갱신 때)는 이전 값을
		   그대로 보여준 채로 새 값이 오면 바뀌게 해서, 5초마다 숫자가 잠깐씩
		   비어 보이는 깜빡임이 없게 합니다. */
		if (cardNames.length == 0) {
			cardNames = ["총 보유 품목", "총 보유 재고 수량", "오늘 입고 수량", "오늘 출고 수량", "재고 부족 품목"];
			cardNums  = ["-", "-", "-", "-", "-"];
			// 재고 수량 3개는 팔레트/박스/EA가 섞인 합계라 "EA"라고 단위를 붙이면 오해가
			// 생겨서 뺍니다(오른쪽에 종류별 소분류가 따로 있음). 나머지 두 개는 품목 "종" 수라 그대로 둡니다.
			cardUnits = ["종", "", "", "", "종"];
			cardDiffs = [0, 0, 0, 0, 0];
			drawCards();
		}

		loadItemCount();       // 카드 0 : 총 보유 품목
		loadWarehouseStock();  // 카드 1 + 창고별 재고 도넛
		loadDailyCompare();    // 카드 2, 3 : 오늘 입고/출고
		loadAlerts();          // 카드 4 + 실시간 알림 목록
		loadBarChart();        // 입출고 현황 막대그래프
	}


	/* ---------------------------------------------------------
	   카드 0 : 총 보유 품목 (사용 중인 품목만)
	   /api/items 는 total 만 필요해서 size=1로 최소한만 받습니다.
	   --------------------------------------------------------- */
	function loadItemCount() {
		apiGet("/api/items?page=1&size=1&active=true", putItemCount);
	}

	function putItemCount(data) {
		cardNums[0] = data.total;
		drawCards();
	}


	/* ---------------------------------------------------------
	   카드 1 + 창고별 재고 도넛 : 대형/중형/소형 합산

	   [주의] 통계 API 중에 /api/statistics/warehouseStock 도 있지만,
	   지금 서버 코드에 버그가 있어서(같은 이름의 창고가 여러 개일 때
	   합치지 않고 마지막 값으로 덮어써 버림 - 대형 5개 중 1개 값만 남음)
	   그 API 대신 warehouse.html과 같은 방식으로 창고/구역/재고를
	   직접 받아서 화면에서 합산합니다. 안주희 님께 별도로 전달 예정.
	   --------------------------------------------------------- */
	let whWhNames  = [];   // 창고 번호 -> 창고 구분(대형/중형/소형)
	let whGroupQty = {};   // 창고 구분별 합계를 담아둘 객체

	function loadWarehouseStock() {
		apiGet("/api/warehouses?size=200", putWarehousesForStock);
	}

	function putWarehousesForStock(data) {

		whWhNames = [];

		for (let i = 0; i < data.items.length; i++) {
			whWhNames[data.items[i].warehouseId] = data.items[i].name; // "대형"/"중형"/"소형"
		}

		apiGet("/api/zones?size=200", putZonesForStock);
	}

	/* 구역별 usedQuantity(ZoneServlet이 stockLotDao.sumQuantityByZoneId로 서버에서 정확히
	   더해서 내려주는 값)를 창고 구분(대/중/소)별로 더합니다.

	   예전엔 여기서 /api/stock-lots?status=NORMAL을 200개씩 페이지네이션으로 받아
	   클라이언트에서 직접 더했는데, 재고 로트가 400개(2페이지)를 넘으면 뒤쪽이 조용히
	   빠지는 문제가 있었습니다. warehouse.html에도 같은 문제가 있었고 zone.usedQuantity로
	   이미 고쳐져 있어서, 여기도 그 값을 그대로 가져다 쓰도록 맞췄습니다. */
	function putZonesForStock(data) {

		whGroupQty = { "대형": 0, "중형": 0, "소형": 0 };

		// 구역 이름(zoneName)이 곧 그 구역이 다루는 단위(PALLET/BOX/EA)라서, 창고 크기별
		// 합계와 같은 자료(usedQuantity)를 단위별로도 그냥 다시 더하기만 하면 됩니다.
		let unitQty = { PALLET: 0, BOX: 0, EA: 0 };

		for (let i = 0; i < data.items.length; i++) {

			let groupName = whWhNames[data.items[i].warehouseId];

			if (groupName != null) {
				whGroupQty[groupName] = whGroupQty[groupName] + data.items[i].usedQuantity;
			}

			let unit = data.items[i].zoneName;
			if (unitQty[unit] != null) {
				unitQty[unit] = unitQty[unit] + data.items[i].usedQuantity;
			}
		}

		cardBreakdowns[1] = unitQty;

		drawDonutFromGroups();
	}

	function drawDonutFromGroups() {

		whNames  = ["대형 창고 (5개소)", "중형 창고 (3개소)", "소형 창고 (2개소)"];
		whQtys   = [whGroupQty["대형"], whGroupQty["중형"], whGroupQty["소형"]];
		whColors = ["#EBDCC3", "#347A55", "#1F3A63"];

		cardNums[1] = whQtys[0] + whQtys[1] + whQtys[2];
		drawCards();
		drawDonutChart();
	}


	/* ---------------------------------------------------------
	   카드 2, 3 : 오늘 입고/출고 수량 + 전일 대비
	   --------------------------------------------------------- */
	function loadDailyCompare() {

		let pick = document.querySelector("#pickDate").value;
		apiGet("/api/reports/daily?date=" + pick, putDailyCompare);
	}

	function putDailyCompare(data) {

		let comp = data.dailyComparison;

		// 그 날짜에 비교할 자료가 없으면 null로 옵니다
		if (comp == null) {
			cardNums[2] = 0;
			cardNums[3] = 0;
			cardDiffs[2] = 0;
			cardDiffs[3] = 0;
			cardBreakdowns[2] = { PALLET: 0, BOX: 0, EA: 0 };
			cardBreakdowns[3] = { PALLET: 0, BOX: 0, EA: 0 };
		} else {
			cardNums[2] = comp.todayInboundQty;
			cardNums[3] = comp.todayOutboundQty;

			// 전일 수량이 0이면 증감률이 null로 옵니다 (계산 불가)
			// 서버가 소수점을 안 자르고 그대로 보내서(예: 13.333333...) 화면에서 소수 첫째 자리로 반올림합니다
			cardDiffs[2] = comp.inboundQtyChangeRate == null ? 0 : Math.round(comp.inboundQtyChangeRate * 10) / 10;
			cardDiffs[3] = comp.outboundQtyChangeRate == null ? 0 : Math.round(comp.outboundQtyChangeRate * 10) / 10;

			cardBreakdowns[2] = unitBreakdownOrZero(comp.inboundByUnit);
			cardBreakdowns[3] = unitBreakdownOrZero(comp.outboundByUnit);
		}

		drawCards();
	}

	/* 서버가 그 날 활동이 있었던 단위만 묶어서 주므로(GROUP BY), 활동이 없던 단위는
	   키 자체가 없을 수 있습니다 - 화면에서 항상 세 줄이 다 보이게 0으로 채워 줍니다. */
	function unitBreakdownOrZero(map) {
		if (map == null) {
			return { PALLET: 0, BOX: 0, EA: 0 };
		}
		return {
			PALLET: map.PALLET == null ? 0 : map.PALLET,
			BOX: map.BOX == null ? 0 : map.BOX,
			EA: map.EA == null ? 0 : map.EA
		};
	}


	/* ---------------------------------------------------------
	   카드 4 + 실시간 알림 목록

	   서버는 종류별로 걸러 주지 않아서(resolved만 지원),
	   해결 안 된 알림을 한 번에 받아서 화면에서 종류를 셉니다.
	   목록에는 최근 5건만 보여줍니다.
	   --------------------------------------------------------- */
	function loadAlerts() {
		apiGet("/api/alerts?resolved=false&page=1&size=200", putAlertsForDashboard);
	}

	/* 서버가 주는 알림 문구는 "품목(itemId=252) 재고가 threshold_min(10) 미만입니다
	   (현재 0, 폐기로 인한 감소)" 처럼 개발자용 변수명이 그대로 들어있습니다.
	   알림 탭에서 정리했던 것과 같은 규칙으로 사람이 읽기 좋게 다듬습니다.
	   -> "재고가 기준 수량 10개 미만입니다 (현재 0, 폐기로 인한 감소)" */
	function prettyAlertMessage(raw) {

		if (raw == null) {
			return "";
		}

		let text = raw;

		// "품목(itemId=252) " 접두어는 화면에 품목명을 이미 따로 보여주므로 뗍니다
		text = text.replace(/^품목\(itemId=\d+\)\s*/, "");

		// 변수명 그대로 노출된 부분을 자연스러운 말로 바꿉니다
		text = text.replace(/threshold_min\((\d+)\)/, "기준 수량 $1개");
		text = text.replace(/capacity_max\((\d+)\)/, "최대 보유량 $1개");

		// 창고정리추천 알림은 "대형(0) EA[zoneId=3]" 처럼 이름 뒤에 실제 구역 번호를 [ ] 안에
		// 남겨 둡니다(승인 관리 화면이 이동 실행할 때 읽는 값). 화면엔 이름만 보이면 되므로 지웁니다.
		text = text.replace(/\[zoneId=\d+\]/g, "");

		return text;
	}


	function putAlertsForDashboard(data) {

		let list = data.items;

		// 카드 4 : 재고부족 알림 개수
		let lowCount = 0;
		for (let i = 0; i < list.length; i++) {
			if (list[i].alertType == "재고부족") {
				lowCount = lowCount + 1;
			}
		}
		cardNums[4] = lowCount;
		drawCards();

		// 목록 : 최근 5건
		// 서버가 이미 최신순(ORDER BY created_at DESC)으로 정렬해서 주기 때문에
		// 그냥 앞에서 5개만 그대로 쓰면 됩니다 (뒤집을 필요 없음)
		alertTypes    = [];
		alertItemIds  = [];
		alertItems    = [];
		alertMsgs     = [];
		alertTimes    = [];

		let count = list.length;
		if (count > 5) {
			count = 5;
		}

		let needFetch = []; // 이름을 아직 모르는 itemId들만 따로 모아 둡니다

		for (let i = 0; i < count; i++) {

			alertTypes[i]   = list[i].alertType;
			alertItemIds[i] = list[i].itemId;
			alertMsgs[i]    = prettyAlertMessage(list[i].message);

			// 이미 알고 있는 이름이면 바로 씁니다 - 서버에 다시 안 물어봅니다
			if (alertItemNameCache[list[i].itemId] != null) {
				alertItems[i] = alertItemNameCache[list[i].itemId];
			} else {
				alertItems[i] = "품목 " + list[i].itemId;  // 받아올 때까지만 임시로 보여줍니다
				needFetch[needFetch.length] = i;
			}

			let t = list[i].createdAt;
			if (t == null) {
				alertTimes[i] = "";
			} else {
				t = t.replace("T", " ");
				alertTimes[i] = t.substring(11, 16); // 시:분만
			}
		}

		// 내용이 지난번이랑 완전히 똑같으면 다시 그리지 않습니다 (깜빡임 방지)
		let snapshot = JSON.stringify([alertTypes, alertItemIds, alertItems, alertMsgs, alertTimes]);

		if (snapshot != lastAlertSnapshot) {
			lastAlertSnapshot = snapshot;
			drawAlerts();
		}

		// 이름을 모르는 것만 새로 받아옵니다
		for (let k = 0; k < needFetch.length; k++) {
			loadAlertItemName(needFetch[k], alertItemIds[needFetch[k]]);
		}
	}

	function loadAlertItemName(index, itemId) {
		apiGet("/api/items/" + itemId, function (data) {

			alertItemNameCache[itemId] = data.itemName;

			// 그 사이 또 새로고침이 돌아서 이 자리(index)에 다른 알림이 들어와 있을 수 있으니,
			// 지금도 여전히 이 itemId를 보여주고 있는 자리인지 확인하고 나서만 바꿔 그립니다
			if (alertItemIds[index] == itemId) {
				alertItems[index] = data.itemName;
				lastAlertSnapshot = JSON.stringify([alertTypes, alertItemIds, alertItems, alertMsgs, alertTimes]);
				drawAlerts();
			}
		});
	}


	/* ---------------------------------------------------------
	   입출고 현황 막대그래프 (기준일까지 최근 7일)
	   창고 드롭다운에서 고른 값(전체/대형/중형/소형)을 그대로 넘깁니다.
	   --------------------------------------------------------- */
	function loadBarChart() {

		let pick = document.querySelector("#pickDate").value;
		let to = new Date(pick);
		let from = new Date(pick);
		from.setDate(from.getDate() - 6);

		let wh = document.querySelector("#warehouse").value;

		let path = "/api/statistics/inout?unit=day"
			+ "&from=" + getDateText(from)
			+ "&to=" + getDateText(to)
			+ "&warehouse=" + encodeURIComponent(wh);

		apiGet(path, putBarChart);
	}

	function putBarChart(data) {

		days    = [];
		inQtys  = [];
		outQtys = [];

		for (let i = 0; i < data.length; i++) {
			days[i]    = data[i].period.substring(5); // "2026-08-11" -> "08-11"
			inQtys[i]  = data[i].inboundQty;
			outQtys[i] = data[i].outboundQty;
		}

		drawBarChart();
		loadDisposalBar();
	}


	/* 반품/폐기는 OUTBOUND가 아니라 RETURN_DISPOSAL이라는 별도 테이블이라
	   "출고량" 통계엔 전혀 안 잡힙니다. 그래서 재고가 빠지는데도 안 보이던
	   그 물량을 따로 받아와서 막대그래프에 다른 색으로 같이 보여줍니다
	   (안 그러면 입고량만 유난히 많아 보여서 뭔가 문제가 있는 것처럼 보입니다 -
	   실은 출고/반품/폐기 세 갈래로 나가는 재고 중 하나만 "출고량"에 잡히는 것뿐). */
	function loadDisposalBar() {

		if (days.length == 0) {
			dispQtys = [];
			drawBarChart();
			return;
		}

		let pick = document.querySelector("#pickDate").value;
		let to = new Date(pick);
		let from = new Date(pick);
		from.setDate(from.getDate() - 6);

		let path = "/api/returns?from=" + getDateText(from) + "&to=" + getDateText(to) + "&size=200";
		apiGet(path, putDisposalBar);
	}

	function putDisposalBar(data) {

		let list = data.items;

		// 날짜별(월-일)로 수량을 더합니다
		let sumByDay = {};

		for (let i = 0; i < list.length; i++) {
			let day = list[i].processedDate.substring(5); // "2026-08-11" -> "08-11"
			if (sumByDay[day] == null) {
				sumByDay[day] = 0;
			}
			sumByDay[day] = sumByDay[day] + list[i].quantity;
		}

		// 막대그래프에 이미 그려진 날짜 순서(days)에 맞춰 채웁니다
		dispQtys = [];
		for (let i = 0; i < days.length; i++) {
			dispQtys[i] = sumByDay[days[i]] == null ? 0 : sumByDay[days[i]];
		}

		drawBarChart();
	}

	/* =========================================================
	   숫자에 쉼표를 넣어준다   52350 -> 52,350
	   ========================================================= */
	/* addComma 는 common.js 로 옮겼습니다 */

	/* =========================================================
	   위쪽 요약 카드 5개를 그린다
	   ========================================================= */
	function drawCards() {
		let html = "";

		for (let i = 0; i < cardNames.length; i++) {
			html = html + '<div class="summary-card">';
			html = html + '	<div class="summary-main">';
			html = html + '		<div class="summary-name">' + cardNames[i] + '</div>';
			html = html + '		<div class="summary-count">' + addComma(cardNums[i]);
			html = html + '			<span class="summary-unit">' + cardUnits[i] + '</span>';
			html = html + '		</div>';

			// 전일 대비 증감 표시 (0이면 표시하지 않는다)
			if (cardDiffs[i] > 0) {
				html = html + '		<div class="diff diff-up">▲ ' + cardDiffs[i] + '% 전일 대비</div>';
			} else if (cardDiffs[i] < 0) {
				html = html + '		<div class="diff diff-down">▼ ' + (cardDiffs[i] * -1) + '% 전일 대비</div>';
			}

			html = html + '	</div>';

			// 총 보유 재고 수량/오늘 입고/오늘 출고 카드만 팔레트/박스/낱개 소분류를 오른쪽에 작게 보여줌
			let b = cardBreakdowns[i];
			if (b != null) {
				html = html + '	<div class="summary-breakdown">';
				html = html + '		<span>PALLET ' + addComma(b.PALLET) + '</span>';
				html = html + '		<span>BOX ' + addComma(b.BOX) + '</span>';
				html = html + '		<span>ea ' + addComma(b.EA) + '</span>';
				html = html + '	</div>';
			}

			html = html + '</div>';
		}

		document.querySelector("#cardArea").innerHTML = html;
	}

	/* =========================================================
	   입출고 현황 막대그래프를 그린다
	   ========================================================= */
	function drawBarChart() {
		// 이미 그려둔 그래프가 있으면 먼저 지운다 (안 지우면 겹쳐서 이상해진다)
		if (barChart != null) {
			barChart.destroy();
		}

		let area = document.querySelector("#barChart");

		barChart = new Chart(area, {
			type: "bar",
			data: {
				labels: days,
				datasets: [
					{ label: "입고량", data: inQtys, backgroundColor: "#e0433f" },
					{ label: "출고량", data: outQtys, backgroundColor: "#3b6fd4" },
					{ label: "반품/폐기", data: dispQtys, backgroundColor: "rgb(0, 128, 0)" }
				]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false
			}
		});
	}

	/* =========================================================
	   창고별 재고 도넛그래프를 그린다
	   ========================================================= */
	function drawDonutChart() {
		if (donutChart != null) {
			donutChart.destroy();
		}

		let area = document.querySelector("#donutChart");

		donutChart = new Chart(area, {
			type: "doughnut",
			data: {
				labels: whNames,
				datasets: [
					{ data: whQtys, backgroundColor: whColors }
				]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					legend: { display: false }
				}
			}
		});

		// 전체 합계를 구해서 도넛 아래에 표시한다
		let total = 0;
		for (let i = 0; i < whQtys.length; i++) {
			total = total + whQtys[i];
		}
		document.querySelector("#totalNum").innerHTML = addComma(total) + '<span>총 재고(EA)</span>';

		// 창고 목록을 아래에 적는다
		let html = "";
		for (let i = 0; i < whNames.length; i++) {
			html = html + '<div class="legend-row">';
			html = html + '	<span class="legend-color" style="background:' + whColors[i] + '"></span>';
			html = html + '	<span class="legend-name">' + whNames[i] + '</span>';
			html = html + '	<span class="legend-num">' + addComma(whQtys[i]) + '</span>';
			html = html + '</div>';
		}
		document.querySelector("#legendArea").innerHTML = html;
	}

	/* =========================================================
	   실시간 알림 목록을 그린다
	   ========================================================= */
	function drawAlerts() {
		let html = "";

		for (let i = 0; i < alertTypes.length; i++) {
			html = html + '<div class="alert-row">';
			html = html + '	<div class="alert-top">';
			html = html + '		<span class="tag tag-' + alertTypes[i] + '">' + alertTypes[i] + '</span>';
			html = html + '		<span class="alert-item">' + alertItems[i] + '</span>';
			html = html + '		<span class="alert-time">' + alertTimes[i] + '</span>';
			html = html + '	</div>';
			html = html + '	<div class="alert-msg">' + alertMsgs[i] + '</div>';
			html = html + '</div>';
		}

		document.querySelector("#alertArea").innerHTML = html;
	}

	/* =========================================================
	   기준일을 바꿨을 때
	   -> 날짜에 걸린 카드(오늘 입고/출고)와 막대그래프(그 날짜까지 7일)만
	      다시 받아오면 됩니다. 나머지 카드·도넛·알림은 날짜와 무관합니다.
	   ========================================================= */
	function changeDate() {
		loadDailyCompare();
		loadBarChart();
	}

	/* =========================================================
	   창고 구분을 바꿨을 때
	   -> 막대그래프(입출고 현황)만 그 구분으로 다시 받아옵니다.
	   ========================================================= */
	function changeWarehouse() {
		loadBarChart();
	}

	/* =========================================================
	   페이지가 열릴 때 처음 한 번 실행
	   ========================================================= */

	// 날짜 칸에 오늘 날짜를 넣어둔다
	let today = new Date();
	let yyyy = today.getFullYear();
	let mm = today.getMonth() + 1;       // 달은 0부터 시작해서 1을 더해준다
	let dd = today.getDate();
	if (mm < 10) mm = "0" + mm;          // 한 자리면 앞에 0을 붙인다
	if (dd < 10) dd = "0" + dd;
	document.querySelector("#pickDate").value = yyyy + "-" + mm + "-" + dd;

	loadData();

	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();


	/* ============================================================
	   서버가 데이터 바뀔 때마다 바로 알려주는 실시간 연결(connectRealtimeRefresh,
	   common.js)을 받으면 실시간 알림 위젯만 바로 다시 받아오고, 연결이 끊기거나
	   신호를 놓쳐도 5초마다 한 번씩은 따라잡도록 폴링도 안전망으로 같이 둡니다.
	   카드·그래프는 실시간으로 안 바꾸고, 왼쪽 위 로고를 눌러 이 화면을
	   다시 들어오면(location.href로 페이지가 새로 열림) 그때 같이 새로 반영됩니다.
	   새 알림은 출고/입고/승인/폐기 처리 중에 생길 수 있어서 그 종류를 다 구독합니다. */
	connectRealtimeRefresh(loadAlerts, ["alert", "outbound", "inbound", "approval", "disposal"]);
	setInterval(loadAlerts, 5000);

</script>

</body>

<!DOCTYPE html> <!-- 설정 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>설정 및 권한관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/setting.css">
	
	<!-- 서버 통신 공통 함수 -->
	<script src="../js/api.js"></script>
	<script src="../js/common.js"></script>
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo" onclick="location.href='dashboard.html'">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
				<a href="dashboard.html">메인 화면</a>
				<a href="item.html">입출고 관리</a>
				<a href="return.html">반품 및 폐기 관리</a>
				<a href="alert.html">알림</a>
				<a href="statistics.html">통계</a>
				<a class="active" href="setting.html">설정 및 권한 관리</a>
			</nav>
			<div class="logout-area">
			<a href="login.html" onclick="logout()">로그아웃</a>
		</div>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<!-- 오른쪽 위 로그인 안내 -->
		<div class="user-bar" id="userBar"></div>
		
		<div class="setting-top-row">
			<header class="top-menu">
				<button class="menu-btn active">사용자 관리</button> 
				<button class="menu-btn" onclick="location.href='approval.html'">자동 제안 및 승인</button> 
				<button class="menu-btn" onclick="location.href='roles.html'">권한 관리</button>
			</header>
			
			<button class="small-btn" onclick="openUser(-1)">사용자 등록</button>
		</div>
		<!-- 출고 입력(표)  -->
		
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>아이디</th> 
						<th>이름</th> 
						<th>역할</th>
						<th>계정 생성일</th>
						<th>상태</th>
						<th>관리</th>
					</tr>				
				</thead>
				
				<!-- 표 내용은 drawList()가 채웁니다 -->
				<tbody id="usBody">
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

<!-- 담당 창고 팝업: 표에서는 빼고, 줄을 누르면 여기에 따로 보여줍니다 -->
<div class="modal-overlay" id="whListModal">
	<div class="modal-box wh-list-box">

		<div class="modal-header">
			<h3 id="whListTitle">담당 창고</h3>
			<button class="modal-close" onclick="closeWhList()"> x </button>
		</div>

		<section class="modal-content">
			<div id="whListArea"></div>
		</section>
	</div>
</div>

<!-- 사용자 추가/수정 모달 -->
<div class="modal-overlay" id="usModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3 id="usTitle">사용자 추가</h3>
			<button class="modal-close" onclick="closeUser()"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>아이디</label>
				<input type="text" id="usName">
			</div>
			
			<div class="form-group">
				<label>이름</label>
				<input type="text" id="usReal">
			</div>
			
			<div class="form-group">
				<label>비밀번호</label>
				<input type="password" id="usPw" placeholder="수정 시 비워두면 그대로 둡니다">
			</div>
			
			<div class="form-group">
				<label>역할</label>
				<select id="usRole" onchange="changeRole()">
					<option>ADMIN</option>
					<option>STAFF</option>
				</select>
			</div>

		</section>
		
		<div class="warehouse-group">
			<label>담당 창고</label>
			<div class="checkbox-group" id="usWarehouses">
			</div>
		</div>
				
		<div class="modal-footer">
			<button class="btn-cancel" onclick="closeUser()">취소</button>
			<button class="btn-primary" onclick="saveUser()">저장</button>
		</div>
	</div>
</div>

<!-- ============================================================
     사용자 / 권한 관리 화면 로직
     ------------------------------------------------------------
     ADMIN 은 모든 창고에 접근할 수 있어 담당 창고를 고르지 않습니다.
     STAFF 만 담당 창고를 배정받습니다 (USER_WAREHOUSE 표).

     삭제는 계정을 실제로 지우지 않고 "비활성" 으로 바꿉니다.
     그 사람이 처리한 입고·출고 기록이 계정을 참조하고 있어서,
     실제로 지우면 기록이 깨지기 때문입니다.

     서버 연동
       loadData()  -> apiGet("/api/users?active=true", ...) 와
                       apiGet("/api/users?active=false", ...) 를 이어서 불러
                       사용중/비활성 계정을 모두 모읍니다.
       saveUser()  -> apiSend("POST", "/api/users", ...)            (등록)
                       apiSend("PUT",  "/api/users/{id}", ...)      (수정, 이름·비밀번호만)
                       apiSend("PUT",  "/api/users/{id}/warehouses", ...)  (담당 창고 교체)
       doDisable() -> apiSend("DELETE", "/api/users/{id}", ...)     (비활성화)
       doEnable()  -> apiSend("PATCH",  "/api/users/{id}/activate", ...)  (재활성화)

       아이디(username)와 역할(role)은 API 상 수정 경로가 없어
       수정 화면에서는 잠가 둡니다.
     ============================================================ -->
<script>

	/* 사용자 목록 */
	let usIds = [];
	let usNames = [];        // 로그인 아이디
	let usReals = [];        // 이름
	let usRoles = [];
	let usWhs = [];          // 담당 창고 이름을 이어붙인 글자 (화면 표시용)
	let usWhIds = [];        // 담당 창고 번호 배열 (수정 모달 체크박스 복원용)
	let usDates = [];
	let usActives = [];      // 쓸 수 있는 계정인지

	let editUs = -1;


	/* 화면이 열리면 창고 등 기준 데이터부터 받아옵니다 (담당 창고 이름 표시에 필요) */
	function startUp() {
		loadMasterFromServer(afterMaster);
	}

	function afterMaster() {
		loadData();
	}


	/* ------------------------------------------------------------
	   사용자 목록 받아오기
	   서버는 active=true / active=false 중 하나만 걸러 주기 때문에
	   두 번 나눠 받아서 하나로 모읍니다.
	   ------------------------------------------------------------ */
	function loadData() {
		apiGet("/api/users?active=true&size=200", putActiveUsers);
	}

	function putActiveUsers(data) {

		usIds = [];
		usNames = [];
		usReals = [];
		usRoles = [];
		usWhs = [];
		usWhIds = [];
		usDates = [];
		usActives = [];

		addUsers(data.items);

		apiGet("/api/users?active=false&size=200", putInactiveUsers);
	}

	function putInactiveUsers(data) {
		addUsers(data.items);
		drawList();
	}

	function addUsers(list) {

		for (let i = 0; i < list.length; i++) {

			let last = usIds.length;

			usIds[last] = list[i].userId;
			usNames[last] = list[i].username;
			usReals[last] = list[i].name;
			usRoles[last] = list[i].role;
			usWhIds[last] = list[i].warehouseIds;
			usWhs[last] = makeWhText(list[i].role, list[i].warehouseIds);
			usActives[last] = list[i].isActive;

			/* 서버가 주는 시각은 "2026-01-24T00:00:00" 모양이라 날짜만 잘라 씁니다 */
			let created = list[i].createdAt;

			if (created == null) {
				created = "";
			} else if (created.length > 10) {
				created = created.substring(0, 10);
			}
			usDates[last] = created;
		}
	}


	/* 담당 창고 번호 배열을 화면에 보여줄 이름으로 바꿉니다 (창고 목록은 common.js) */
	function makeWhText(role, ids) {

		if (role == "ADMIN") {
			return "전체";
		}

		if (ids == null || ids.length == 0) {
			return "";
		}

		let text = "";

		for (let i = 0; i < ids.length; i++) {
			for (let k = 0; k < warehouseIds.length; k++) {
				if (warehouseIds[k] == ids[i]) {
					if (text != "") {
						text = text + ", ";
					}
					text = text + warehouseNames[k];
				}
			}
		}

		return text;
	}


	function drawList() {

		let html = "";

		if (usIds.length == 0) {
			document.querySelector("#usBody").innerHTML = "<tr><td colspan='7'>등록된 사용자가 없습니다.</td></tr>";
			return;
		}

		for (let i = 0; i < usIds.length; i++) {

			let state = "사용중";
			let btn = "<button class='delete-btn' onclick='doDisable(" + i + ")'>비활성</button>";

			if (usActives[i] == false) {
				state = "비활성";
				btn = "<button class='edit-btn' onclick='doEnable(" + i + ")'>되살리기</button>";
			}

			html = html + "<tr class='row-clickable' onclick='openWhList(" + i + ")'>";
			html = html + "<td>" + (i + 1) + "</td>";
			html = html + "<td>" + usNames[i] + "</td>";
			html = html + "<td>" + usReals[i] + "</td>";
			html = html + "<td>" + usRoles[i] + "</td>";
			html = html + "<td>" + usDates[i] + "</td>";
			html = html + "<td>" + state + "</td>";
			html = html + "<td onclick='event.stopPropagation()'>";
			html = html + "<button class='edit-btn' onclick='openUser(" + i + ")'>수정</button>";
			html = html + btn;
			html = html + "</td>";
			html = html + "</tr>";
		}

		document.querySelector("#usBody").innerHTML = html;
	}


	/* ---------- 담당 창고 팝업 ---------- */

	function openWhList(index) {

		document.querySelector("#whListTitle").innerHTML = usReals[index] + " (" + usNames[index] + ") 담당 창고";

		let html = "";

		if (usRoles[index] == "ADMIN") {
			html = "<p class='wh-empty'>관리자는 모든 창고에 접근할 수 있습니다.</p>";

		} else if (usWhIds[index] == null || usWhIds[index].length == 0) {
			html = "<p class='wh-empty'>배정된 창고가 없습니다.</p>";

		} else {

			let ids = usWhIds[index];

			for (let i = 0; i < ids.length; i++) {

				/* 창고 번호로 이름·크기 구분(대형/중형/소형)을 찾습니다 */
				let label = "창고 " + ids[i];
				let sizeClass = "";

				for (let k = 0; k < warehouseIds.length; k++) {
					if (warehouseIds[k] == ids[i]) {
						label = warehouseNames[k];

						if (warehouseBaseNames[k] == "대형") {
							sizeClass = " wh-tag-large";
						} else if (warehouseBaseNames[k] == "중형") {
							sizeClass = " wh-tag-medium";
						} else {
							sizeClass = " wh-tag-small";
						}
					}
				}

				html = html + "<div class='wh-tag" + sizeClass + "'>";
				html = html + "<span class='wh-tag-dot'></span>";
				html = html + label;
				html = html + "</div>";
			}
		}

		document.querySelector("#whListArea").innerHTML = html;

		openModal("#whListModal");
	}

	function closeWhList() {
		closeModal("#whListModal");
	}


	/* ---------- 등록 / 수정 모달 ---------- */

	function openUser(index) {

		editUs = index;

		/* 담당 창고 목록을 체크박스로 만듭니다 */
		let html = "";
		for (let i = 0; i < warehouseIds.length; i++) {
			html = html + "<label><input type='checkbox' id='wh" + warehouseIds[i] + "'>" + warehouseNames[i] + "</label>";
		}
		document.querySelector("#usWarehouses").innerHTML = html;

		if (index == -1) {
			document.querySelector("#usTitle").innerHTML = "사용자 추가";
			clearInput(["#usName", "#usReal", "#usPw"]);
			document.querySelector("#usRole").value = "STAFF";
			document.querySelector("#usName").disabled = false;
			document.querySelector("#usRole").disabled = false;
		} else {
			document.querySelector("#usTitle").innerHTML = "사용자 수정";
			document.querySelector("#usName").value = usNames[index];
			document.querySelector("#usReal").value = usReals[index];
			document.querySelector("#usPw").value = "";
			document.querySelector("#usRole").value = usRoles[index];

			/* 아이디와 역할은 서버에서 고치는 경로가 없어 수정 화면에서는 잠급니다 */
			document.querySelector("#usName").disabled = true;
			document.querySelector("#usRole").disabled = true;

			/* 이미 배정된 창고에 표시를 남깁니다 */
			let ids = usWhIds[index];
			if (ids != null) {
				for (let i = 0; i < ids.length; i++) {
					let box = document.querySelector("#wh" + ids[i]);
					if (box != null) {
						box.checked = true;
					}
				}
			}
		}

		changeRole();
		openModal("#usModal");
	}


	/* ADMIN 은 전체 창고에 접근할 수 있어 창고를 고를 필요가 없습니다 */
	function changeRole() {

		let role = document.querySelector("#usRole").value;
		let box = document.querySelector("#usWarehouses");

		if (role == "ADMIN") {
			box.innerHTML = "<label>ADMIN 은 모든 창고에 접근할 수 있습니다.</label>";
		} else {

			/* STAFF 로 되돌리면 체크박스를 다시 그립니다 */
			if (box.innerHTML.indexOf("checkbox") < 0) {
				let html = "";
				for (let i = 0; i < warehouseIds.length; i++) {
					html = html + "<label><input type='checkbox' id='wh" + warehouseIds[i] + "'>" + warehouseNames[i] + "</label>";
				}
				box.innerHTML = html;
			}
		}
	}


	/* 체크된 담당 창고 번호를 모읍니다. ADMIN 이면 빈 배열을 돌려줍니다 */
	function collectPickedWarehouses(role) {

		let picked = [];

		if (role != "STAFF") {
			return picked;
		}

		for (let i = 0; i < warehouseIds.length; i++) {
			let box = document.querySelector("#wh" + warehouseIds[i]);
			if (box != null && box.checked == true) {
				picked[picked.length] = warehouseIds[i];
			}
		}

		return picked;
	}


	function saveUser() {

		if (isBlank(["#usName", "#usReal"]) == true) {
			alert("아이디와 이름을 채워 주세요.");
			return;
		}

		let id = document.querySelector("#usName").value;
		let real = document.querySelector("#usReal").value;
		let pw = document.querySelector("#usPw").value;
		let role = document.querySelector("#usRole").value;

		/* 새로 만들 때는 비밀번호가 꼭 있어야 합니다 */
		if (editUs == -1 && pw == "") {
			alert("비밀번호를 입력해 주세요.");
			return;
		}

		/* 아이디는 겹치면 안 됩니다 (등록할 때만 확인하면 됩니다) */
		if (editUs == -1) {
			for (let i = 0; i < usIds.length; i++) {
				if (usNames[i] == id) {
					alert("이미 쓰고 있는 아이디입니다.");
					return;
				}
			}
		}

		let picked = collectPickedWarehouses(role);

		if (role == "STAFF" && picked.length == 0) {
			alert("담당 창고를 하나 이상 골라 주세요.");
			return;
		}

		if (editUs == -1) {
			apiSend("POST", "/api/users", { username: id, password: pw, name: real, role: role }, function (data) {

				if (role == "STAFF" && picked.length > 0) {
					apiSend("PUT", "/api/users/" + data.userId + "/warehouses", { warehouseIds: picked }, afterSaveUser);
				} else {
					afterSaveUser();
				}
			});
		} else {

			let body = { name: real };
			if (pw != "") {
				body.password = pw;
			}

			apiSend("PUT", "/api/users/" + usIds[editUs], body, function (data) {

				if (role == "STAFF") {
					apiSend("PUT", "/api/users/" + usIds[editUs] + "/warehouses", { warehouseIds: picked }, afterSaveUser);
				} else {
					afterSaveUser();
				}
			});
		}
	}


	function afterSaveUser() {
		loadData();
		closeUser();
	}


	function closeUser() {
		closeModal("#usModal");
	}


	/* 계정을 못 쓰게 막습니다 (기록은 그대로 남습니다) */
	function doDisable(index) {

		/* 본인 계정은 스스로 막을 수 없습니다 (명세서 F-19) */
		if (usIds[index] == sessionStorage.getItem("userId")) {
			alert("본인 계정은 비활성으로 바꿀 수 없습니다.");
			return;
		}

		if (usRoles[index] == "ADMIN") {

			/* 관리자가 하나도 없으면 아무도 관리 기능을 못 씁니다 */
			let count = 0;
			for (let i = 0; i < usIds.length; i++) {
				if (usRoles[i] == "ADMIN" && usActives[i] == true) {
					count = count + 1;
				}
			}

			if (count <= 1) {
				alert("마지막 관리자 계정은 비활성으로 바꿀 수 없습니다.");
				return;
			}
		}

		if (confirm(usReals[index] + " 계정을 비활성으로 바꿀까요?\n로그인이 막히지만 지난 기록은 그대로 남습니다.") == false) {
			return;
		}

		apiSend("DELETE", "/api/users/" + usIds[index], null, function (data) {
			loadData();
		});
	}

	function doEnable(index) {

		apiSend("PATCH", "/api/users/" + usIds[index] + "/activate", null, function (data) {
			loadData();
			alert(usReals[index] + " 계정을 다시 쓸 수 있습니다.");
		});
	}

	/* 화면이 열릴 때 실행 */
	startUp();

	/* 오른쪽 위에 로그인한 사람을 보여 줍니다 */
	drawUserBar();

</script>
</body>
</html>

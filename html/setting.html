<!DOCTYPE html> <!-- 설정 -->

<html lang = "ko">
<head> 
	<meta charset="UTF-8">
	<title>설정 및 권한관리</title>
	
	<!-- 공통 css -->
	<link rel="stylesheet" href="../css/common.css">
	<!--inbound css -->
	<link rel="stylesheet" href="../css/setting.css">
</head>

<!-- 바디  -->
<body>
	<!-- 전체 화면 -->
	<div class="container">
	
	<!--  사이드바-->	
	<aside class="sidebar">
		<div class="logo">
			<img src="../images/logo.png" alt="DOWN MART">
		<p>DOWN MART</p>
		</div>
		<nav class="sidebar-menu">
			<a>입출고 관리</a>
			<a>반품 및 폐기 관리</a>
			<a>알림</a>
			<a>통계</a>
			<a class="active">설정 및 권한 관리</a>
		</nav>
	</aside>
		
	<!-- 오른쪽 위에 뜨는거 -->
	<main class="content">
		<header class="top-menu">
			<button class="menu-btn active">사용자 관리</button> 
			<button class="menu-btn">자동 제안 및 승인</button> 
			<button class="menu-btn">권한 관리</button>
		</header>
		
		<button class="small-btn">사용자 등록</button>
		<!-- 출고 입력(표)  -->
		
		<section class= "table-box">
			<table>
				<thead>
					<tr>
						<th>NO</th>
						<th>아이디</th> 
						<th>이름</th> 
						<th>역할</th>
						<th>담당 창고</th>
						<th>계정 생성일</th>
						<th>관리</th>
					</tr>				
				</thead>
				
				<tbody> 
					<tr>
						<td>1</td>
						<td>honggilldong</td>
						<td>홍길동</td>
						<td>ADMIN</td>
						<td>전체</td>
						<td>2026-01-24</td>
						<td>
							<button class="edit-btn">수정</button>
							<button class="delete-btn">삭제</button>
						</td>
					</tr>
					
					<tr>
						<td>2</td>
						<td>kimmingi</td>
						<td>김민지</td>
						<td>STAFF</td>
						<td>B</td>
						<td>2026-01-24</td>
						<td>
							<button class="edit-btn">수정</button>
							<button class="delete-btn">삭제</button>
						</td>
					</tr>
				</tbody>
			</table>
		</section>
		
	</main>
	
	</div>

<!-- 사용자 추가 모달 -->
<div class = "modal-overlay" id="recommendModal">
	<div class="modal-box">
	
		<div class="modal-header">
			<h3>사용자 추가</h3>
			<button class = "modal-close"> x </button>
		</div>
		
		<section class="form-box">
			<div class="form-group">
				<label>아이디</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>이름</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>비밀번호</label>
				<input type= "text">
			</div>
			
			<div class="form-group">
				<label>역할</label>
					<select>
					<option>ADMIN</option>
					<option>STAFF</option>
				</select>
			</div>
		
			

		</section>
		
		<div class="warehouse-group">
					<label>담당 창고</label>
						<div class="checkbox-group">	
							<label><input type = "checkbox">전체</label>
							<label><input type = "checkbox">A</label>
							<label><input type = "checkbox">B</label>
							<label><input type = "checkbox">C</label>
						</div>
				</div>
				
			<div class="modal-footer">
				<button class= "btn-cancel">취소</button>
				<button class= "btn-primary">등록</button>
			</div>
	</div>
</div>
</body>


</html>
